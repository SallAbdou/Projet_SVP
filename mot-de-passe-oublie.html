<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Mot de passe oublié · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="Forgot password · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/parcours.css">
</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div class="parcours">
<header class="entete" data-entete></header>
<main class="contenu centre">
<section class="carte" aria-labelledby="titre">
<h1 id="titre" class="titre">{{t.titre}}</h1>
<p class="chapo">{{t.chapo}}</p>
<form onSubmit="{{valider}}" novalidate>
<div class="champ">
<label for="email">{{t.email}}</label>
<input id="email" type="email" autocomplete="email" inputmode="email" value="{{email}}" onInput="{{saisirEmail}}" aria-invalid="{{invalide}}" aria-describedby="err-email">
<p id="err-email" class="erreur">{{erreur}}</p>
</div>
<button type="submit" class="bouton" data-focus="valider">{{t.valider}}</button>
</form>
<div class="liens-bas"><a href="/connexion">{{t.retour}}</a></div>
<p class="mention-demo">{{t.demo}}</p>
</section>
</main>
</div>
</script>
<script src="/dc.js"></script><script>
var T = {
fr: {
titre: 'Mot de passe oublié', chapo: 'Indique ton e-mail : on t’envoie un lien pour choisir un nouveau mot de passe.',
email: 'Ton e-mail', valider: 'Recevoir le lien', retour: '← Retour à la connexion',
reseau: 'Le serveur ne répond pas. Réessaie dans un instant.',
requis: 'Indique ton e-mail.', invalide: 'Cet e-mail ne semble pas valide (exemple : lea@mail.fr).',
demo: 'Démo : aucun e-mail ni mot de passe n’est réellement envoyé ou enregistré.'
},
en: {
titre: 'Forgot your password', chapo: 'Enter your email: we will send you a link to choose a new password.',
email: 'Your email', valider: 'Send me the link', retour: '← Back to log in',
reseau: 'The server is not responding. Try again in a moment.',
requis: 'Enter your email.', invalide: 'This email does not look valid (example: lea@mail.com).',
demo: 'Demo: no email or password is actually sent or stored.'
}
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr', email: '', erreur: '' }; }
afterRender(root) {
if (this.pendingFocus) Parcours.focaliser(root.querySelector('#email'));
this.pendingFocus = false;
}
valider() {
var email = this.state.email.trim();
var code = !email ? 'requis' : (Auth.emailValide(email) ? '' : 'invalide');
if (code) { this.pendingFocus = true; this.setState({ erreur: code }); return; }
// Même suite que le compte existe ou non : on ne révèle pas quels comptes existent.
// Démo : réponse immédiate ; mode réel : promesse (Supabase). Seule une panne réseau arrête la suite.
var self = this;
if (this.envoi) return;
this.envoi = true;
Promise.resolve(Auth.motDePasseOublie(email)).then(function (r) {
self.envoi = false;
if (r && r.erreur === 'reseau') { self.pendingFocus = true; self.setState({ erreur: 'reseau' }); return; }
try { sessionStorage.setItem('pq-mail', JSON.stringify({ email: email })); } catch (e) {}
location.href = '/verifie-tes-mails';
});
}
renderVals() {
var self = this;
var st = this.state || {};
var t = T[st.lang || 'fr'];
return {
t: t, email: st.email, erreur: st.erreur ? t[st.erreur] : '', invalide: st.erreur ? 'true' : 'false',
saisirEmail: function (e) { self.setState({ email: e.target.value, erreur: '' }); },
valider: function () { self.valider(); }
};
}
}
</script><script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/parcours.js"></script><script src="/boot.js"></script></body></html>
