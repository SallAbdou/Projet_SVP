<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Mon profil · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="My profile · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<style>
body{margin:0;background:var(--fond-page)}
a{color:var(--brun)}a:hover{color:var(--brun-fonce)}
button:focus-visible,a:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
</style>
<style>
.pf-carte{max-width:760px;background:var(--creme);border:1px solid var(--bord);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.pf-titre{margin:0;font-family:Fraunces, Georgia, serif;font-size:22px}
.pf-liste{margin:0}
.pf-ligne{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:4px 24px;padding:12px 0;border-top:1px solid var(--trait)}
.pf-ligne:first-child{border-top:0;padding-top:4px}
.pf-ligne dt{color:var(--doux);font-weight:600}
.pf-ligne dd{margin:0;font-weight:600;color:var(--texte);overflow-wrap:anywhere}
.pf-note{margin:0;font-size:14px;color:var(--doux)}
.pf-btn{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--brun);background:var(--creme);color:var(--brun);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.pf-btn:hover{background:var(--sable);color:var(--brun-fonce)}
.pf-sortie{border-color:var(--bord-fort);color:var(--brun-fonce)}
.pf-intro{margin:0;color:var(--texte-2)}
.pf-form{display:flex;flex-direction:column;gap:8px;margin:0}
.pf-label{font-weight:700;color:var(--texte)}
.pf-zone{width:100%;min-height:112px;resize:vertical;padding:12px 14px;border:1.5px solid var(--bord-champ);border-radius:12px;background:var(--champ);color:var(--texte);font:inherit;line-height:1.5}
.pf-zone:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
.pf-zone[aria-invalid="true"]{border-color:var(--erreur)}
.pf-sous-zone{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pf-erreur{margin:0;color:var(--erreur);font-weight:600;font-size:14px}
.pf-compteur{margin:0 0 0 auto;font-size:13px;color:var(--doux);white-space:nowrap;font-variant-numeric:tabular-nums}
.pf-compteur.trop{color:var(--erreur);font-weight:700}
.pf-envoyer{background:var(--brun);color:var(--sur-plein)}
.pf-envoyer:hover{background:var(--brun-fonce);color:var(--sur-plein)}
.pf-envoyer[aria-disabled="true"]{opacity:.65;cursor:progress}
.pf-succes{margin:0;color:var(--ok);font-weight:600}
.pf-succes:empty{display:none}
.pf-sous-titre{margin:8px 0 0;font-family:Fraunces, Georgia, serif;font-size:17px}
.pf-retours{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pf-retours li{padding:10px 0;border-top:1px solid var(--trait)}
.pf-retours li:first-child{border-top:0;padding-top:2px}
.pf-retour-texte{margin:0;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pf-retour-date{margin:2px 0 0;font-size:13px;color:var(--doux)}
.pf-themes{border:0;margin:0;padding:0;min-width:0}
.pf-themes legend{padding:0;margin:0 0 10px}
.pf-themes-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pf-theme{display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;border:1.5px solid var(--bord-fort);border-radius:14px;background:var(--creme);color:var(--texte);font-weight:600;cursor:pointer}
.pf-theme:hover{border-color:var(--brun)}
.pf-theme:has(input:checked){border-color:var(--brun);box-shadow:0 0 0 2px var(--brun)}
.pf-theme:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
.pf-theme-choix{display:flex;align-items:center;gap:8px;min-height:24px}
.pf-theme input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--brun);cursor:pointer}
.pf-apercu{display:block;height:62px;padding:8px;border-radius:10px;border:1px solid var(--bord);background:var(--fond)}
.pf-apercu-carte{display:flex;align-items:center;gap:6px;height:100%;padding:0 8px;border-radius:8px;background:var(--creme)}
.pf-apercu-ligne{flex:1;height:8px;border-radius:4px;background:var(--texte)}
.pf-apercu-or{flex:none;width:20px;height:20px;border-radius:6px;background:var(--maillard)}
.pf-apercu-pain{flex:none;width:34px;height:18px;border-radius:50%;background:linear-gradient(170deg,var(--pain-haut),var(--pain-bas))}
@media (max-width:640px){.pf-carte{padding:18px}.pf-ligne{grid-template-columns:1fr}}
</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script><script src="/theme.js"></script><script src="/retours.js"></script>
</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:var(--fond);color:var(--texte);font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="profil" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:var(--sable);border-right:1px solid var(--bord);padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:22px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--sur-titre)">{{t.eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:var(--doux);font-size:16px">{{t.subtitle}}</p>
</div>
</header>
<section aria-labelledby="infos-t" class="pf-carte">
<h2 id="infos-t" class="pf-titre">{{t.infos}}</h2>
<dl class="pf-liste">
<sc-for list="{{infos}}" as="l" hint-placeholder-count="2"><div class="pf-ligne"><dt>{{l.label}}</dt><dd>{{l.valeur}}</dd></div></sc-for>
</dl>
</section>
<section aria-labelledby="prefs-t" class="pf-carte">
<h2 id="prefs-t" class="pf-titre">{{t.prefs}}</h2>
<dl class="pf-liste">
<sc-for list="{{prefs}}" as="l" hint-placeholder-count="4"><div class="pf-ligne"><dt>{{l.label}}</dt><dd>{{l.valeur}}</dd></div></sc-for>
</dl>
<p class="pf-note">{{t.source}}</p>
<a href="/questionnaire" class="pf-btn" data-focus="profil-modifier">{{t.redo}}</a>
</section>
<section aria-labelledby="apparence-t" class="pf-carte">
<h2 id="apparence-t" class="pf-titre">{{t.apparenceT}}</h2>
<p class="pf-intro">{{t.apparenceIntro}}</p>
<fieldset class="pf-themes"><legend class="pf-label">{{t.themeLegende}}</legend>
<div class="pf-themes-grille"><sc-for list="{{themes}}" as="c" hint-placeholder-count="4"><label class="pf-theme" for="{{c.id}}"><span class="pf-apercu" data-theme="{{c.valeur}}" aria-hidden="true"><span class="pf-apercu-carte"><span class="pf-apercu-ligne"></span><span class="pf-apercu-or"></span><span class="pf-apercu-pain"></span></span></span><span class="pf-theme-choix"><input id="{{c.id}}" type="radio" name="theme" data-valeur="{{c.valeur}}" onChange="{{choisirTheme}}" {{c.coche}}><span>{{c.label}}</span></span></label></sc-for></div>
</fieldset>
<p role="status" aria-live="polite" class="pf-succes">{{themeAnnonce}}</p>
</section>
<section aria-labelledby="retour-t" class="pf-carte">
<h2 id="retour-t" class="pf-titre">{{t.retourT}}</h2>
<p class="pf-intro">{{t.retourIntro}}</p>
<form class="pf-form" novalidate onSubmit="{{envoyerRetour}}">
<label for="retour-texte" class="pf-label">{{t.retourLabel}}</label>
<p id="retour-aide" class="pf-note">{{t.retourAide}}</p>
<textarea id="retour-texte" class="pf-zone" rows="4" aria-describedby="{{retourDecrit}}" aria-invalid="{{retourInvalide}}" onInput="{{saisirRetour}}">{{retour}}</textarea>
<div class="pf-sous-zone"><p id="retour-erreur" class="pf-erreur" style="{{erreurStyle}}">{{erreurTexte}}</p><p id="retour-compteur" class="pf-compteur {{compteurClasse}}">{{compteur}}</p></div>
<button type="submit" class="pf-btn pf-envoyer" data-focus="retour-envoyer" aria-disabled="{{envoiEnCours}}">{{boutonTexte}}</button>
<p role="status" aria-live="polite" class="pf-succes">{{succes}}</p>
</form>
<h3 class="pf-sous-titre">{{t.derniersT}}</h3>
<ul class="pf-retours" style="{{listeStyle}}"><sc-for list="{{derniers}}" as="r" hint-placeholder-count="2"><li><p class="pf-retour-texte">{{r.texte}}</p><p class="pf-retour-date">{{r.date}}</p></li></sc-for></ul>
<p class="pf-note" style="{{listeVideStyle}}">{{listeVide}}</p>
</section>
<button type="button" class="pf-btn pf-sortie" data-focus="profil-logout" onClick="{{deconnexion}}">{{t.logout}}</button>
</main>
</div>
</script>
<script src="/dc.js"></script><script src="/questionnaire.js"></script><script src="/profil.js"></script><script>
// Compte de l'utilisatrice connectée (auth.js) : informations, puis préférences saisies au questionnaire.
var T = {
fr: {
navLabel: 'Navigation principale', eyebrow: 'Ton compte', title: 'Mon profil',
subtitle: 'Ce que ta fournée sait de toi pour choisir tes sujets chaque matin.',
infos: 'Informations', prefs: 'Préférences',
source: 'Tes préférences viennent du questionnaire d’inscription.', redo: 'Modifier mes préférences', logout: 'Se déconnecter',
retourT: 'Affine ta fournée',
retourIntro: 'Dis-nous ce que tu veux voir plus ou moins souvent : l’IA en tiendra compte pour choisir tes prochains sujets.',
retourLabel: 'Ton retour', retourAide: 'Ex. : plus de sujets sur l’IA en PME, moins sur le hardware',
max: '1 000', envoyer: 'Envoyer mon retour', envoi: 'Envoi…',
succes: 'Merci, ton retour est enregistré. Il comptera pour tes prochaines fournées.',
erreurs: {
vide: 'Écris quelques mots avant d’envoyer.',
'trop-long': 'Ton retour dépasse 1 000 caractères : raccourcis-le un peu.',
reseau: 'Envoi impossible pour l’instant (connexion ou serveur). Ton texte est gardé : réessaie dans un moment.',
session: 'Ta session a expiré : reconnecte-toi, ton texte sera à réécrire.'
},
derniersT: 'Tes derniers retours', listeVide: 'Aucun retour pour l’instant.', listeErreur: 'Impossible d’afficher tes retours pour l’instant.',
apparenceT: 'Apparence', apparenceIntro: 'Choisis les couleurs du site. Ton choix est gardé pour ton compte.', themeLegende: 'Thème de couleur',
themes: { bronze: 'Bronze', classique: 'Boulangerie classique', nuit: 'Nuit', contraste: 'Contraste élevé' }, themeApplique: 'Thème « {nom} » appliqué.'
},
en: {
navLabel: 'Main navigation', eyebrow: 'Your account', title: 'My profile',
subtitle: 'What your batch knows about you to pick your topics every morning.',
infos: 'Details', prefs: 'Preferences',
source: 'Your preferences come from the sign-up questionnaire.', redo: 'Edit my preferences', logout: 'Log out',
retourT: 'Fine-tune your batch',
retourIntro: 'Tell us what you want to see more or less often: the AI will use it to pick your next topics.',
retourLabel: 'Your feedback', retourAide: 'E.g. more topics on AI in small businesses, less on hardware',
max: '1,000', envoyer: 'Send my feedback', envoi: 'Sending…',
succes: 'Thanks, your feedback is saved. It will count for your next batches.',
erreurs: {
vide: 'Write a few words before sending.',
'trop-long': 'Your feedback is over 1,000 characters: please shorten it.',
reseau: 'Could not send right now (connection or server). Your text is kept: try again in a moment.',
session: 'Your session has expired: log in again, you will need to rewrite your text.'
},
derniersT: 'Your latest feedback', listeVide: 'No feedback yet.', listeErreur: 'Your feedback can’t be shown right now.',
apparenceT: 'Appearance', apparenceIntro: 'Pick the site’s colours. Your choice is kept for your account.', themeLegende: 'Colour theme',
themes: { bronze: 'Bronze', classique: 'Classic bakery', nuit: 'Night', contraste: 'High contrast' }, themeApplique: '“{nom}” theme applied.'
}
};
var CACHE = 'display: none';
function stockageTheme() { try { return window.localStorage; } catch (e) { return null; } }
function cleTheme() { try { return Theme.cleCompte(Auth.utilisateurCourant()); } catch (e) { return null; } }
class Component extends DCLogic {
constructor(props) {
super(props);
// retour : saisie en cours ; succes : booléen (texte traduit au rendu) ; derniers : null tant que la liste charge.
this.state = { lang: 'fr', retour: '', retourErreur: null, succes: false, envoi: false, derniers: null, derniersErreur: false, theme: Theme.lire(stockageTheme(), cleTheme()), themeAnnonce: null };
this.chargerDerniers();
}
chargerDerniers() {
var self = this;
Retours.derniersRetours(3).then(function (l) { self.setState({ derniers: l, derniersErreur: false }); },
function () { self.setState({ derniers: [], derniersErreur: true }); });
}
// Erreur : le focus va (une fois) sur le champ, curseur à la fin. Succès : il reste sur le bouton, la zone live parle.
afterRender(root) {
if (!this.focusRetour) return;
this.focusRetour = false;
var el = root.querySelector('#retour-texte');
if (!el) return;
el.focus();
try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
}
renderVals() {
var self = this;
var s = this.state;
var lang = s.lang || 'fr';
var t = T[lang];
var u = null;
try { u = Auth.utilisateurCourant(); } catch (e) {}
var l = Profil.lignes(u, lang, Questionnaire.libelle);
var maintenant = new Date();
var derniers = (s.derniers || []).map(function (r) { return { texte: r.texte, date: Retours.pur.dateRelative(r.cree_le, maintenant, lang) }; });
var erreur = s.retourErreur ? t.erreurs[s.retourErreur] || t.erreurs.reseau : '';
var vide = s.derniers !== null && !derniers.length;
return {
t: t, infos: l.infos, prefs: l.prefs,
retour: s.retour,
retourDecrit: (erreur ? 'retour-erreur ' : '') + 'retour-aide retour-compteur',
retourInvalide: erreur ? 'true' : 'false',
erreurTexte: erreur, erreurStyle: erreur ? '' : CACHE,
compteur: s.retour.length + ' / ' + t.max,
compteurClasse: s.retour.length > Retours.pur.MAX ? 'trop' : '',
envoiEnCours: s.envoi ? 'true' : 'false',
boutonTexte: s.envoi ? t.envoi : t.envoyer,
succes: s.succes ? t.succes : '',
derniers: derniers, listeStyle: derniers.length ? '' : CACHE,
listeVide: s.derniersErreur ? t.listeErreur : t.listeVide, listeVideStyle: vide ? '' : CACHE,
saisirRetour: function (e) { self.setState({ retour: e.target.value, retourErreur: null, succes: false }); },
envoyerRetour: function () {
if (self.state.envoi) return;
var texte = self.state.retour;
var err = Retours.pur.valider(texte);
if (err) { self.focusRetour = true; self.setState({ retourErreur: err, succes: false }); return; }
self.setState({ envoi: true, retourErreur: null, succes: false });
Retours.envoyerRetour(texte).then(function (r) {
if (r.ok) { self.setState({ envoi: false, retour: '', succes: true }); self.chargerDerniers(); return; }
self.focusRetour = true;
self.setState({ envoi: false, retourErreur: r.erreur });
});
},
themes: Theme.THEMES.map(function (v) { return { id: 'theme-' + v, valeur: v, label: t.themes[v], coche: v === s.theme ? 'checked' : '' }; }),
themeAnnonce: s.themeAnnonce ? t.themeApplique.replace('{nom}', t.themes[s.themeAnnonce]) : '',
choisirTheme: function (e) {
var v = Theme.normaliser(e.target.getAttribute('data-valeur'));
Theme.appliquer(document, v);
var st = stockageTheme();
if (st) Theme.enregistrer(st, cleTheme(), v);
self.setState({ theme: v, themeAnnonce: v });
},
deconnexion: function () { try { Auth.seDeconnecter(); } catch (e) {} window.location.href = '/'; }
};
}
}
</script><script src="/nav.js"></script><script src="/boot.js"></script></body></html>
