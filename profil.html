<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Mon profil · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="My profile · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<style>
body{margin:0;background:var(--fond)}
a{color:#8A4F1C}a:hover{color:#5E3412}
button:focus-visible,a:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
</style>
<style>
.pf-carte{max-width:760px;background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.pf-titre{margin:0;font-family:Fraunces, Georgia, serif;font-size:22px}
.pf-liste{margin:0}
.pf-ligne{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:4px 24px;padding:12px 0;border-top:1px solid #F0E5D2}
.pf-ligne:first-child{border-top:0;padding-top:4px}
.pf-ligne dt{color:#6B5443;font-weight:600}
.pf-ligne dd{margin:0;font-weight:600;color:#2E1D12;overflow-wrap:anywhere}
.pf-note{margin:0;font-size:14px;color:#6B5443}
.pf-btn{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #8A4F1C;background:#FFFDF8;color:#8A4F1C;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.pf-btn:hover{background:#F3E6CF;color:#5E3412}
.pf-sortie{border-color:#D9C29C;color:#5E3412}
@media (max-width:640px){.pf-carte{padding:18px}.pf-ligne{grid-template-columns:1fr}}
</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script>
</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:var(--fond);color:#2E1D12;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="profil" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:#F3E6CF;border-right:1px solid #E7D6B8;padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:22px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--sur-titre)">{{t.eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:#6B5443;font-size:16px">{{t.subtitle}}</p>
</div>
</header>
<section aria-labelledby="infos-t" class="pf-carte">
<h2 id="infos-t" class="pf-titre">{{t.infos}}</h2>
<dl class="pf-liste">
<sc-for list="{{infos}}" as="l" hint-placeholder-count="2"><div class="pf-ligne"><dt>{{l.label}}</dt><dd>{{l.valeur}}</dd></div></sc-for>
</dl>
</section>
<section aria-labelledby="prefs-t" class="pf-carte">
<h2 id="prefs-t" class="pf-titre">{{t.prefs}}</h2>
<dl class="pf-liste">
<sc-for list="{{prefs}}" as="l" hint-placeholder-count="4"><div class="pf-ligne"><dt>{{l.label}}</dt><dd>{{l.valeur}}</dd></div></sc-for>
</dl>
<p class="pf-note">{{t.source}}</p>
<a href="/questionnaire" class="pf-btn" data-focus="profil-modifier">{{t.redo}}</a>
</section>
<button type="button" class="pf-btn pf-sortie" data-focus="profil-logout" onClick="{{deconnexion}}">{{t.logout}}</button>
</main>
</div>
</script>
<script src="/dc.js"></script><script src="/questionnaire.js"></script><script src="/profil.js"></script><script>
// Compte de l'utilisatrice connectée (auth.js) : informations, puis préférences saisies au questionnaire.
var T = {
fr: {
navLabel: 'Navigation principale', eyebrow: 'Ton compte', title: 'Mon profil',
subtitle: 'Ce que ta fournée sait de toi pour choisir tes sujets chaque matin.',
infos: 'Informations', prefs: 'Préférences',
source: 'Tes préférences viennent du questionnaire d’inscription.', redo: 'Modifier mes préférences', logout: 'Se déconnecter'
},
en: {
navLabel: 'Main navigation', eyebrow: 'Your account', title: 'My profile',
subtitle: 'What your batch knows about you to pick your topics every morning.',
infos: 'Details', prefs: 'Preferences',
source: 'Your preferences come from the sign-up questionnaire.', redo: 'Edit my preferences', logout: 'Log out'
}
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr' }; }
renderVals() {
var lang = (this.state && this.state.lang) || 'fr';
var u = null;
try { u = Auth.utilisateurCourant(); } catch (e) {}
var l = Profil.lignes(u, lang, Questionnaire.libelle);
return {
t: T[lang], infos: l.infos, prefs: l.prefs,
deconnexion: function () { try { Auth.seDeconnecter(); } catch (e) {} window.location.href = '/'; }
};
}
}
</script><script src="/nav.js"></script><script src="/boot.js"></script></body></html>
