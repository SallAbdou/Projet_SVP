<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>QR code de la démo · Votre pAIn quotidien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<link rel="stylesheet" href="/parcours.css">
<style>
.qr-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 16px;text-align:center}
.qr-page h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:40px;line-height:1.1}
.qr-page p{margin:0}
.qr-cadre{background:var(--qr-fond);border:1px solid var(--bord);border-radius:24px;padding:20px}
.qr-cadre img{display:block;width:min(420px,80vw);height:auto}
.qr-adresse{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:800;color:var(--brun-fonce);word-break:break-word}
.qr-aide{color:var(--doux);max-width:46ch}
.qr-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.qr-actions button,.qr-actions a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.qr-actions button{border:0;background:var(--braise);color:var(--sur-plein)}
.qr-actions a{border:1.5px solid var(--bord-fort);color:var(--texte);background:var(--creme)}
.qr-actions button:focus-visible,.qr-actions a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media print{
  body{background:var(--qr-fond)}
  .qr-actions{display:none}
  .qr-page{min-height:auto;padding:0;gap:16px}
  .qr-cadre{border:0;padding:0}
  .qr-cadre img{width:12cm}
}
</style>
</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a>
<main id="contenu" tabindex="-1" class="qr-page">
<h1>Scanne pour goûter la démo</h1>
<p class="qr-aide">Votre pAIn quotidien : chaque matin, l’actu IA qui compte pour ton métier, prête à pétrir en post LinkedIn.</p>
<div class="qr-cadre"><img src="/assets/qr-landing.svg" width="420" height="420" alt="QR code vers https://team42svp.vercel.app/"></div>
<p class="qr-adresse">team42svp.vercel.app</p>
<div class="qr-actions">
<button type="button" onclick="window.print()">Imprimer</button>
<a href="/">Retour à l’accueil</a>
</div>
</main>
</body></html>
