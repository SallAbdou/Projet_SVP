<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>La fournée du jour · Votre pAIn quotidien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EA}
a{color:#8A4F1C}a:hover{color:#5E3412}
button:focus-visible,a:focus-visible{outline:2px solid #B5651D;outline-offset:2px}
</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<style>
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:264px;grid-auto-flow:dense;gap:16px}
.tile{min-width:0;min-height:0;overflow:hidden;background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.tile-body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-right:-10px;padding-right:10px}
.tile-body:focus-visible{outline:2px solid #B5651D;outline-offset:2px;border-radius:8px}
.tile[hidden]{display:none}
.tile-S{grid-column:span 1;grid-row:span 1}
.tile-M{grid-column:span 2;grid-row:span 1}
.tile-L{grid-column:span 2;grid-row:span 2}
.tile-dark{background:#2E1D12;color:#FBF5EA;border-color:#2E1D12}
.tile-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.tile-title{margin:0;font-family:Fraunces, Georgia, serif;font-size:20px;line-height:1.2}
.muted{font-size:13px;color:#6B5443}
.tile-tools{display:none;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1.5px dashed #D9C29C}
.bento.editing .tile-tools{display:flex}
.bento.editing .tile{border:1.5px dashed #B5651D;box-shadow:0 2px 0 #E7D6B8}
.tool-sizes{display:inline-flex;gap:4px}
.tool{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:1.5px solid #D9C29C;background:#FBF5EA;color:#2E1D12;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tool[aria-pressed="true"]{background:#8A4F1C;border-color:#8A4F1C;color:#FFFDF8}
.tool-drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px}
.tile.dragging{opacity:.6;box-shadow:0 12px 28px rgba(46,29,18,.25);transform:scale(.98)}
html.is-dragging,html.is-dragging *{cursor:grabbing!important;user-select:none}
.tile-dark .tool{background:#FFFDF8}
.tile-dark .tool[aria-pressed="true"]{background:#F2C77A;border-color:#F2C77A;color:#2E1D12}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-S{grid-column:span 1}.tile-M,.tile-L{grid-column:span 2}}
@media (max-width:640px){.bento{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}.tile-S,.tile-M,.tile-L{grid-column:auto;grid-row:auto}.tile,.tile-body{overflow:visible}}
</style>
</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:#FBF5EA;color:#2E1D12;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:#F3E6CF;border-right:1px solid #E7D6B8;padding:28px 18px;display:flex;flex-direction:column;gap:26px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:10px">
<span style="width:38px;height:38px;border-radius:12px;background:#8A4F1C;color:#FBF5EA;display:inline-flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14c0-4.4 3.6-8 8-8s8 3.6 8 8v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M9 10l1.5 2M12 9.5l1.5 2M15 10l1.5 2"></path></svg>
</span>
<span style="font-family:Fraunces, Georgia, serif;font-weight:800;font-size:20px;line-height:1.1">Votre p<span style="color:#B5651D">AI</span>n quotidien</span>
</div>
<span style="font-size:13px;color:#6B5443">{{t.tagline}}</span>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<a href="/" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v10H3z"></path><path d="M5 10l2-5h10l2 5"></path></svg>{{t.nav.counter}}</a>
<a href="/fournee" aria-current="page" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;background:#FFFDF8;color:#5E3412;font-weight:700;text-decoration:none;box-shadow:inset 0 0 0 1px #E7D6B8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>{{t.nav.batch}}</a>
<a href="/fournil" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><rect x="7" y="9" width="10" height="7" rx="2"></rect></svg>{{t.nav.kitchen}}</a>
<a href="/garde-manger" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>{{t.nav.pantry}}<span style="margin-left:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">4</span></a>
<a href="/preferences" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>{{t.nav.prefs}}<span style="margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">V1</span></a>
</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:14px">
<div role="group" aria-label="{{t.langLabel}}" style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#E9D8BA;align-self:flex-start">
<button type="button" aria-pressed="{{frPressed}}" onClick="{{setFr}}" style="{{frStyle}}">FR</button>
<button type="button" aria-pressed="{{enPressed}}" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
</div>
<div style="border-top:1px solid #E7D6B8;padding-top:14px;display:flex;align-items:center;gap:10px">
<span style="width:36px;height:36px;border-radius:50%;background:#B5651D;color:#FFFDF8;display:inline-flex;align-items:center;justify-content:center;font-weight:700">L</span>
<div style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:14px">Léa Martin</span><span style="font-size:12px;color:#6B5443">{{t.role}}</span></div>
</div>
</div>
</nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:22px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A5B23">{{eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}} <span style="font-family:'DM Sans', sans-serif;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#DCEBD6;color:#2F5E36;vertical-align:middle">MVP</span></h1>
<p style="margin:0;color:#6B5443;font-size:16px">{{t.subtitle}}</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#FFFDF8;border:1px dashed #D9C29C;color:#6B5443">{{t.sample}}</span>
<button type="button" data-act="edit" aria-pressed="{{editPressed}}" onClick="{{toggleEdit}}" style="{{editBtnStyle}}">{{editLabel}}</button>
</div>
</header>
<p role="status" style="{{loadingStyle}}">{{t.loading}}</p>
<p role="alert" style="{{errorStyle}}">{{t.loadError}}</p>
<p style="{{emptyStyle}}">{{t.allHidden}}</p>
<p style="{{hintStyle}}">{{t.editHint}}</p>
<div data-bento class="bento {{gridClass}}" style="{{gridStyle}}">

<section data-tile="news" class="tile" aria-labelledby="tt-news">
<div class="tile-head"><h2 id="tt-news" class="tile-title">{{t.tiles.news}}</h2><span class="muted">{{newsCountLabel}}</span></div>
<div class="tile-tools" role="group" aria-label="{{a.news.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="news" data-act="up" onClick="{{tileUp}}" aria-label="{{a.news.up}}">↑</button>
<button type="button" class="tool" data-id="news" data-act="down" onClick="{{tileDown}}" aria-label="{{a.news.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="news" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="news" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="news" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="news" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.news.hide}}">✕</button>
</div>
<div class="tile-tools" role="group" aria-label="{{t.countLabel}}">
<span class="muted" style="align-self:center">{{t.countLabel}}</span>
<button type="button" class="tool" data-id="news" data-count="1" data-act="count-1" onClick="{{setCount}}" aria-pressed="false">1</button>
<button type="button" class="tool" data-id="news" data-count="3" data-act="count-3" onClick="{{setCount}}" aria-pressed="false">3</button>
<button type="button" class="tool" data-id="news" data-count="5" data-act="count-5" onClick="{{setCount}}" aria-pressed="false">5</button>
<button type="button" class="tool" data-id="news" data-count="7" data-act="count-7" onClick="{{setCount}}" aria-pressed="false">7</button>
</div>
<div class="tile-body" tabindex="0" role="region" aria-labelledby="tt-news" style="gap:0">
<sc-for list="{{topics}}" as="c" hint-placeholder-count="5">
<article style="flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:14px 0 12px;border-top:1px solid #F0E3CC">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:#4A3324">
<span style="{{c.chip}}">{{c.state}}</span>
<span style="font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#F3E6CF">{{c.axis}}</span><span>{{c.source}}</span>
</div>
<h3 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:18px;line-height:1.3">{{c.title}}</h3>
<p style="margin:0;color:#5A4434;font-size:14px">{{c.summary}}</p>
<p style="margin:0;font-size:13.5px;color:#8A4F1C;font-weight:600">{{c.forYou}}</p>
<div style="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:#6B5443">
<span>{{c.scoreLine}}</span>
<strong style="font-family:Fraunces, Georgia, serif;font-size:18px;color:#2E1D12">{{c.money}}</strong>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:4px">
<a href="/fournil" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;background:#8A4F1C;color:#FFFDF8;font-weight:700;font-size:14px;text-decoration:none">{{c.knead}}</a>
<a href="{{c.url}}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #D9C29C;color:#2E1D12;font-weight:700;font-size:14px;text-decoration:none">{{c.read}}</a>
</div>
</article>
</sc-for>
</div>
</section>

<section data-tile="top" class="tile tile-dark" aria-labelledby="tt-top">
<div class="tile-head"><h2 id="tt-top" class="tile-title">{{t.tiles.top}}</h2></div>
<div class="tile-tools" role="group" aria-label="{{a.top.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="top" data-act="up" onClick="{{tileUp}}" aria-label="{{a.top.up}}">↑</button>
<button type="button" class="tool" data-id="top" data-act="down" onClick="{{tileDown}}" aria-label="{{a.top.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="top" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="top" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="top" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="top" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.top.hide}}">✕</button>
</div>
<div class="tile-body">
<span style="align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F2C77A;color:#3B2416">{{t.hotNow}}</span>
<p style="margin:0;font-weight:700;font-size:17px;line-height:1.35">{{top.title}}</p>
<p style="margin:0;font-size:13.5px;color:#E9D8BA">{{top.forYou}}</p>
</div>
<a href="/fournil" style="flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:#F2C77A;color:#2E1D12;font-weight:700;text-decoration:none">{{t.kneadPost}}</a>
</section>

<section data-tile="graph" class="tile" aria-labelledby="tt-graph">
<div class="tile-head"><h2 id="tt-graph" class="tile-title">{{t.tiles.graph}}</h2><span class="muted">{{t.graphSub}}</span></div>
<div class="tile-tools" role="group" aria-label="{{a.graph.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="graph" data-act="up" onClick="{{tileUp}}" aria-label="{{a.graph.up}}">↑</button>
<button type="button" class="tool" data-id="graph" data-act="down" onClick="{{tileDown}}" aria-label="{{a.graph.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="graph" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="graph" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="graph" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="graph" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.graph.hide}}">✕</button>
</div>
<div style="flex:1 1 auto;min-height:90px;display:flex;gap:10px;align-items:stretch;border-bottom:2px solid #E7D6B8;padding-bottom:4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px">
<span style="font-size:12px;font-weight:700">{{b.value}}</span>
<div style="{{b.barStyle}}" aria-hidden="true"></div>
</div>
</sc-for>
</div>
<div style="display:flex;gap:10px;font-size:11.5px;color:#4A3324;text-align:center">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<span style="flex:1 1 0;min-width:0;overflow-wrap:anywhere">{{b.label}}</span>
</sc-for>
</div>
</section>

<section data-tile="stats" class="tile" aria-labelledby="tt-stats">
<div class="tile-head"><h2 id="tt-stats" class="tile-title">{{t.tiles.stats}}</h2></div>
<div class="tile-tools" role="group" aria-label="{{a.stats.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="stats" data-act="up" onClick="{{tileUp}}" aria-label="{{a.stats.up}}">↑</button>
<button type="button" class="tool" data-id="stats" data-act="down" onClick="{{tileDown}}" aria-label="{{a.stats.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="stats" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="stats" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="stats" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="stats" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.stats.hide}}">✕</button>
</div>
<div class="tile-body">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:10px;font-size:14px">
<span style="{{s.dot}}" aria-hidden="true"></span>
<span style="flex:1 1 auto;min-width:0">{{s.label}}</span>
<strong style="font-family:Fraunces, Georgia, serif;font-size:24px">{{s.value}}</strong>
</div>
</sc-for>
</div>
</section>

<section data-tile="profile" class="tile" aria-labelledby="tt-profile">
<div class="tile-head"><h2 id="tt-profile" class="tile-title">{{t.tiles.profile}}</h2></div>
<div class="tile-tools" role="group" aria-label="{{a.profile.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="profile" data-act="up" onClick="{{tileUp}}" aria-label="{{a.profile.up}}">↑</button>
<button type="button" class="tool" data-id="profile" data-act="down" onClick="{{tileDown}}" aria-label="{{a.profile.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="profile" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="profile" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="profile" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="profile" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.profile.hide}}">✕</button>
</div>
<div class="tile-body" style="gap:6px">
<div style="display:flex;align-items:center;gap:10px">
<span style="flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:#B5651D;color:#FFFDF8;display:inline-flex;align-items:center;justify-content:center;font-weight:700">{{profile.initial}}</span>
<div style="display:flex;flex-direction:column;min-width:0"><strong>{{profile.name}}</strong><span class="muted">{{profile.role}}</span></div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<sc-for list="{{axes}}" as="a" hint-placeholder-count="2">
<span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F3E6CF;color:#5E3412">{{a.label}}</span>
</sc-for>
</div>
<p style="margin:0" class="muted">{{profile.sources}}</p>
</div>
</section>

<section data-tile="painperdu" class="tile" aria-labelledby="tt-painperdu">
<div class="tile-head"><h2 id="tt-painperdu" class="tile-title">{{t.tiles.painperdu}}</h2></div>
<div class="tile-tools" role="group" aria-label="{{a.painperdu.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="painperdu" data-act="up" onClick="{{tileUp}}" aria-label="{{a.painperdu.up}}">↑</button>
<button type="button" class="tool" data-id="painperdu" data-act="down" onClick="{{tileDown}}" aria-label="{{a.painperdu.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="painperdu" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="painperdu" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="painperdu" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="painperdu" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.painperdu.hide}}">✕</button>
</div>
<p style="{{left.emptyStyle}}" class="muted">{{t.noLeftover}}</p>
<div class="tile-body" style="{{left.style}}">
<span style="align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F5DAD3;color:#8E2A1C">{{left.state}}</span>
<p style="margin:0;font-weight:700;line-height:1.35">{{left.title}}</p>
<p style="margin:0;font-size:14px;color:#8A4F1C;font-weight:600">{{left.angle}}</p>
<a href="/fournil" style="align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #8A4F1C;color:#8A4F1C;font-weight:700;font-size:14px;text-decoration:none">{{t.reknead}}</a>
</div>
</section>

<section data-tile="pantry" class="tile" aria-labelledby="tt-pantry">
<div class="tile-head"><h2 id="tt-pantry" class="tile-title">{{t.tiles.pantry}}</h2><a href="/garde-manger" style="font-weight:700;font-size:14px">{{t.pantryAll}}</a></div>
<div class="tile-tools" role="group" aria-label="{{a.pantry.group}}">
<span class="tool tool-drag" data-drag title="{{t.drag}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="pantry" data-act="up" onClick="{{tileUp}}" aria-label="{{a.pantry.up}}">↑</button>
<button type="button" class="tool" data-id="pantry" data-act="down" onClick="{{tileDown}}" aria-label="{{a.pantry.down}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{t.sizeLabel}}">
<button type="button" class="tool" data-id="pantry" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="pantry" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="pantry" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
<button type="button" class="tool" data-id="pantry" data-act="hide" onClick="{{tileHide}}" aria-label="{{a.pantry.hide}}">✕</button>
</div>
<div class="tile-body" tabindex="0" role="region" aria-labelledby="tt-pantry" style="gap:0">
<sc-for list="{{pantry}}" as="p" hint-placeholder-count="3">
<div style="flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid #F0E3CC">
<div style="flex:999 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:700">{{p.title}}</span><span style="font-size:12px;color:#6B5443">{{p.meta}}</span></div>
<span style="{{p.chip}}">{{p.state}}</span>
</div>
</sc-for>
</div>
</section>

</div>
<section aria-labelledby="tray-t" style="{{trayStyle}}">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px">
<h2 id="tray-t" class="tile-title">{{t.trayTitle}}</h2>
<button type="button" class="tool" data-act="reset" onClick="{{resetLayout}}">{{t.reset}}</button>
</div>
<p style="{{trayEmptyStyle}}" class="muted">{{t.trayEmpty}}</p>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{hiddenTiles}}" as="h" hint-placeholder-count="2">
<button type="button" class="tool" data-id="{{h.id}}" data-act="show" onClick="{{tileShow}}" aria-label="{{h.aria}}">+ {{h.label}}</button>
</sc-for>
</div>
</section>
</main>
</div>
</script>
<script src="/dc.js"></script><script src="/bento.js"></script><script src="/bento-ui.js"></script><script>
var CHIP = {
hot: 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #DCEBD6; color: #2F5E36',
knead: 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #FBE3C2; color: #8A4B00',
stale: 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #F5DAD3; color: #8E2A1C'
};
var DOT = {
hot: 'flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; background: #3F8A4A',
knead: 'flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; background: #D98200',
stale: 'flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; background: #C0392B'
};
var BAR_COLOR = { hot: '#B5651D', knead: '#E3B678', stale: '#EAD7B4' };
var HIDE = 'display: none';
var T = {
fr: {
navLabel: 'Navigation principale', langLabel: 'Langue', tagline: 'On pétrit l’actu IA pour toi.', role: 'Consultante IA · solopreneuse',
nav: { counter: 'Le comptoir', batch: 'La fournée du jour', kitchen: 'Le fournil', pantry: 'Le garde-manger', prefs: 'Mes préférences' },
eyebrowTail: 'choisi pour toi par l’IA', title: 'La fournée du jour',
subtitle: 'Les sujets tout juste sortis du four, triés selon ton métier. Arrange ta page comme tu veux.',
sample: 'Données d’exemple', customize: 'Personnaliser', done: 'Terminer',
loading: 'Mise au four…', loadError: 'Impossible de charger la fournée. Recharge la page.',
allHidden: 'Toutes les tuiles sont masquées. Clique sur Personnaliser pour les remettre.',
tiles: { news: 'Sujets du jour', top: 'Tout juste sorti du four', graph: 'Tes derniers posts', stats: 'État de la fournée', profile: 'Ton profil', painperdu: 'Pain perdu', pantry: 'Garde-manger' },
states: { hot: 'Tout chaud', knead: 'À pétrir', stale: 'Rassis' },
statLabels: { hot: 'Tout chaud · publie vite', knead: 'À pétrir · trouve un angle', stale: 'Rassis · déjà saturé' },
axis: 'Axe', topicsCount: '{n} sur {total} sujets',
scoreLine: 'Durabilité {d}/5 · Propension {p}/5 · Lien offre {o}/5', money: 'Monétisation {m}/15',
knead: 'Pétrir un post', read: 'Lire la source', hotNow: 'Tout chaud · publie vite', kneadPost: 'Pétrir le post',
graphSub: 'impressions par post', noLeftover: 'Rien de rassis aujourd’hui.', reknead: 'Repétrir ce sujet',
pantryAll: 'Tout voir →', today: 'mis de côté aujourd’hui', yesterday: 'mis de côté hier', daysAgo: 'mis de côté il y a {n} jours',
editHint: 'Glisse les tuiles par la poignée ⠿ ou utilise les flèches. Tes choix sont enregistrés sur cet appareil.',
drag: 'Glisser pour déplacer', sizeLabel: 'Taille', countLabel: 'Sujets affichés',
toolsGroup: 'Outils de la tuile {name}', up: 'Monter la tuile {name}', down: 'Descendre la tuile {name}', hide: 'Masquer la tuile {name}', add: 'Ajouter la tuile {name}',
trayTitle: 'Tuiles masquées', trayEmpty: 'Aucune tuile masquée.', reset: 'Disposition par défaut'
},
en: {
navLabel: 'Main navigation', langLabel: 'Language', tagline: 'We knead the AI news for you.', role: 'AI consultant · solopreneur',
nav: { counter: 'The counter', batch: 'Today’s batch', kitchen: 'The kitchen', pantry: 'The pantry', prefs: 'My preferences' },
eyebrowTail: 'picked for you by AI', title: 'Today’s batch',
subtitle: 'Topics fresh out of the oven, sorted for your job. Arrange your page the way you like.',
sample: 'Sample data', customize: 'Customise', done: 'Done',
loading: 'Baking…', loadError: 'Could not load the batch. Reload the page.',
allHidden: 'All tiles are hidden. Click Customise to bring them back.',
tiles: { news: 'Today’s topics', top: 'Fresh out of the oven', graph: 'Your latest posts', stats: 'Batch status', profile: 'Your profile', painperdu: 'French toast', pantry: 'Pantry' },
states: { hot: 'Piping hot', knead: 'Needs kneading', stale: 'Gone stale' },
statLabels: { hot: 'Piping hot · post it fast', knead: 'Needs kneading · find an angle', stale: 'Gone stale · saturated' },
axis: 'Axis', topicsCount: '{n} of {total} topics',
scoreLine: 'Shelf life {d}/5 · Shareability {p}/5 · Offer fit {o}/5', money: 'Monetisation {m}/15',
knead: 'Knead a post', read: 'Read the source', hotNow: 'Piping hot · post it fast', kneadPost: 'Knead the post',
graphSub: 'impressions per post', noLeftover: 'Nothing stale today.', reknead: 'Re-knead this topic',
pantryAll: 'See all →', today: 'saved today', yesterday: 'saved yesterday', daysAgo: 'saved {n} days ago',
editHint: 'Drag tiles by the ⠿ handle or use the arrows. Your choices are saved on this device.',
drag: 'Drag to move', sizeLabel: 'Size', countLabel: 'Topics shown',
toolsGroup: '{name} tile tools', up: 'Move {name} tile up', down: 'Move {name} tile down', hide: 'Hide {name} tile', add: 'Add {name} tile',
trayTitle: 'Hidden tiles', trayEmpty: 'No hidden tiles.', reset: 'Default layout'
}
};
function fill(s, vals) { return s.replace(/\{(\w+)\}/g, function (m, k) { return vals[k] == null ? m : vals[k]; }); }
class Component extends DCLogic {
constructor(props) {
super(props);
var layout;
try { layout = Bento.loadLayout(window.localStorage); } catch (e) { layout = Bento.defaultLayout(); }
this.state = { lang: 'fr', editing: false, layout: layout, data: null, loadError: false };
var self = this;
BentoUI.initDrag({
isEditing: function () { return !!self.state.editing; },
onDrop: function (id, index) { self.updateLayout(Bento.moveTile(self.state.layout, id, index)); }
});
fetch('/data/fournee.json')
.then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
.then(function (data) { self.setState({ data: data }); })
.catch(function () { self.setState({ loadError: true }); });
}
// Enregistre la disposition puis re-rend la page. focus = { id, act } du bouton à refocaliser après le rendu.
updateLayout(layout, focus) {
try { Bento.saveLayout(window.localStorage, layout); } catch (e) {}
this.pendingFocus = focus || null;
this.setState({ layout: layout });
}
afterRender(root) {
BentoUI.applyLayout(root, this.state.layout);
var f = this.pendingFocus;
this.pendingFocus = null;
if (!f) return;
var sel = '[data-act="' + f.act + '"]' + (f.id ? '[data-id="' + f.id + '"]' : '');
var el = root.querySelector(sel);
if (!el || el.closest('[hidden]') || !el.offsetParent) el = root.querySelector('[data-act="edit"]');
if (el) el.focus();
}
renderVals() {
var st = this.state || {};
var lang = st.lang || 'fr';
var t = T[lang];
var data = st.data;
var layout = st.layout;
var locale = lang === 'fr' ? 'fr-FR' : 'en-GB';
var L = function (v) { return v ? (v[lang] || v.fr || '') : ''; };
var num = function (n) { return new Intl.NumberFormat(locale).format(n); };
var on = 'min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #8A4F1C; color: #FFFDF8; font: inherit; font-weight: 700; cursor: pointer';
var off = 'min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #5E3412; font: inherit; font-weight: 600; cursor: pointer';
var self = this;
var topics = data ? data.topics : [];
var hidden = Bento.hiddenIds(layout);
var allHidden = hidden.length === layout.tiles.length;
var idOf = function (e) { return e.currentTarget.getAttribute('data-id'); };
var eyebrow = t.eyebrowTail;
if (data) {
var d = new Intl.DateTimeFormat(locale, { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(data.date + 'T12:00:00'));
eyebrow = d.charAt(0).toUpperCase() + d.slice(1) + ' · ' + t.eyebrowTail;
}
var picked = Bento.pickTopics(topics, layout.newsCount);
var top = Bento.topTopic(topics);
var left = Bento.leftover(topics);
var counts = Bento.countStates(topics);
var maxImp = Math.max.apply(null, (data ? data.posts : []).map(function (p) { return p.impressions; }).concat([1]));
var profile = data ? data.profile : { name: '', role: null, axes: [], sources: [] };
return {
t: t,
eyebrow: eyebrow,
setFr: function () { self.setState({ lang: 'fr' }); },
setEn: function () { self.setState({ lang: 'en' }); },
frPressed: String(lang === 'fr'), enPressed: String(lang === 'en'),
frStyle: lang === 'fr' ? on : off, enStyle: lang === 'en' ? on : off,
toggleEdit: function () { self.pendingFocus = { act: 'edit' }; self.setState({ editing: !st.editing }); },
tileUp: function (e) { var id = idOf(e); self.updateLayout(Bento.stepTile(layout, id, -1), { id: id, act: 'up' }); },
tileDown: function (e) { var id = idOf(e); self.updateLayout(Bento.stepTile(layout, id, 1), { id: id, act: 'down' }); },
tileSize: function (e) { var id = idOf(e), s = e.currentTarget.getAttribute('data-size'); self.updateLayout(Bento.setSize(layout, id, s), { id: id, act: 'size-' + s }); },
tileHide: function (e) { var id = idOf(e); self.updateLayout(Bento.setVisible(layout, id, false), { id: id, act: 'hide' }); },
tileShow: function (e) { var id = idOf(e); self.updateLayout(Bento.setVisible(layout, id, true), { id: id, act: 'up' }); },
setCount: function (e) { var n = Number(e.currentTarget.getAttribute('data-count')); self.updateLayout(Bento.setNewsCount(layout, n), { id: 'news', act: 'count-' + n }); },
resetLayout: function () { self.updateLayout(Bento.defaultLayout(), { act: 'reset' }); },
gridClass: st.editing ? 'editing' : '',
hintStyle: data && st.editing ? 'margin: 0; font-size: 14px; color: #5E3412; padding: 10px 14px; border-radius: 12px; background: #F6E7CC' : HIDE,
trayStyle: data && st.editing ? 'display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: 18px; border: 1.5px dashed #D9C29C; background: #F3E6CF' : HIDE,
trayEmptyStyle: hidden.length ? HIDE : 'margin: 0',
hiddenTiles: hidden.map(function (id) { return { id: id, label: t.tiles[id], aria: fill(t.add, { name: t.tiles[id] }) }; }),
a: Bento.TILE_IDS.reduce(function (acc, id) {
var n = { name: t.tiles[id] };
acc[id] = { group: fill(t.toolsGroup, n), up: fill(t.up, n), down: fill(t.down, n), hide: fill(t.hide, n) };
return acc;
}, {}),
editPressed: String(!!st.editing),
editLabel: st.editing ? t.done : t.customize,
editBtnStyle: 'min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #8A4F1C; background: ' + (st.editing ? '#8A4F1C; color: #FFFDF8' : '#FFFDF8; color: #8A4F1C') + '; font: inherit; font-weight: 700; cursor: pointer',
loadingStyle: !data && !st.loadError ? 'margin: 0; color: #6B5443' : HIDE,
errorStyle: st.loadError ? 'margin: 0; padding: 14px 18px; border-radius: 14px; background: #F5DAD3; color: #8E2A1C; font-weight: 600' : HIDE,
emptyStyle: data && allHidden && !st.editing ? 'margin: 0; padding: 18px 20px; border-radius: 14px; border: 1.5px dashed #D9C29C; color: #6B5443' : HIDE,
gridStyle: data ? '' : HIDE,
newsCountLabel: fill(t.topicsCount, { n: picked.length, total: topics.length }),
topics: picked.map(function (c) {
return {
chip: CHIP[c.state], state: t.states[c.state], axis: t.axis + ' ' + c.axis, source: c.source,
title: L(c.title), summary: L(c.summary), forYou: L(c.forYou),
scoreLine: fill(t.scoreLine, { d: c.scores.durability, p: c.scores.propensity, o: c.scores.offer }),
money: fill(t.money, { m: Bento.totalScore(c) }),
knead: t.knead, read: t.read, url: Bento.safeUrl(c.url)
};
}),
top: { title: top ? L(top.title) : '', forYou: top ? L(top.forYou) : '' },
bars: (data ? data.posts : []).map(function (p) {
return {
value: num(p.impressions), label: L(p.label),
barStyle: 'width: 100%; max-width: 44px; height: ' + Math.round(p.impressions / maxImp * 100) + '%; background: ' + BAR_COLOR[p.state] + '; border-radius: 10px 10px 3px 3px'
};
}),
stats: ['hot', 'knead', 'stale'].map(function (k) { return { dot: DOT[k], label: t.statLabels[k], value: counts[k] }; }),
profile: { initial: (profile.name || '?').charAt(0), name: profile.name, role: L(profile.role), sources: profile.sources.join(' · ') },
axes: profile.axes.map(function (a) { return { label: t.axis + ' ' + a.id + ' · ' + L(a.label) }; }),
left: {
emptyStyle: left ? HIDE : 'margin: 0',
style: left ? 'display: flex; flex-direction: column; gap: 10px' : HIDE,
state: t.states.stale, title: left ? L(left.title) : '', angle: left ? L(left.newAngle) : ''
},
pantry: (data ? data.pantry : []).slice(0, 3).map(function (p) {
var age = p.savedDaysAgo === 0 ? t.today : (p.savedDaysAgo === 1 ? t.yesterday : fill(t.daysAgo, { n: p.savedDaysAgo }));
return { title: L(p.title), meta: p.source + ' · ' + age, chip: CHIP[p.state], state: t.states[p.state] };
})
};
}
}
