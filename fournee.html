<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>La fournée du jour · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="Today’s batch · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EA}
a{color:#8A4F1C}a:hover{color:#5E3412}
button:focus-visible,a:focus-visible{outline:2px solid #B5651D;outline-offset:2px}
</style>
<style>.four-pain-miche{transform-origin:48px 56px;animation:lever 1.6s ease-in-out infinite alternate}@keyframes lever{from{transform:scale(.86,.7)}to{transform:scale(1,1)}}@media (prefers-reduced-motion:reduce){.four-pain-miche{animation:none}}</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<style>
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:264px;grid-auto-flow:dense;gap:16px}
.tile{min-width:0;min-height:0;overflow:hidden;background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.tile-body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-right:-10px;padding-right:10px}
.tile[hidden]{display:none}
.tile-S{grid-column:span 1;grid-row:span 1}
.tile-M{grid-column:span 2;grid-row:span 1}
.tile-L{grid-column:span 2;grid-row:span 2}
.tile-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.tile-title{margin:0;font-family:Fraunces, Georgia, serif;font-size:20px;line-height:1.2}
.news-title{margin:0;font-family:Fraunces, Georgia, serif;font-size:18px;line-height:1.3}
.tile-S .news-title{font-size:16px}
.tile-L .news-title{font-size:24px}
.rank{font-family:Fraunces, Georgia, serif;font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;background:#2E1D12;color:#FBF5EA}
.muted{font-size:13px;color:#6B5443}
/* Emplacement n°1 : doré « Maillard », la croûte bien dorée, pour repérer d'un coup d'œil la news la mieux notée. */
.tile[data-tile="n1"]{background:linear-gradient(140deg,#FBE3A8 0%,#F2C46D 55%,#E3A54A 100%);border:2px solid #B87420;box-shadow:0 8px 22px rgba(184,116,32,.30)}
.bento.editing .tile[data-tile="n1"]{border:2px dashed #8A4F1C}
.tile[data-tile="n1"] .rank{background:#8A4F1C;color:#FBE3A8;box-shadow:0 0 0 2px #FBE3A8}
.tile[data-tile="n1"] .tile-body p{color:#3B2416!important}
.tile[data-tile="n1"] .tile-body a[target]{background:#FFF6E3;border-color:#B87420!important}
.tile[data-tile="n1"] .tile-tools .tool{background:#FFF6E3}
.tile[data-tile="n1"] .tile-tools .tool[aria-pressed="true"]{background:#8A4F1C;color:#FFFDF8}
.tile-tools{display:none;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1.5px dashed #D9C29C}
.bento.editing .tile-tools{display:flex}
.bento.editing .tile{border:1.5px dashed #B5651D;box-shadow:0 2px 0 #E7D6B8}
.tool-sizes{display:inline-flex;gap:4px}
.tool{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:1.5px solid #D9C29C;background:#FBF5EA;color:#2E1D12;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tool[aria-pressed="true"]{background:#8A4F1C;border-color:#8A4F1C;color:#FFFDF8}
.tool-drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px}
.tile-tools{flex-wrap:nowrap;gap:4px;padding-bottom:0;border-bottom:0}
.tile-tools .tool{min-height:28px;min-width:28px;height:28px;padding:0 7px;border-radius:8px;border-width:1px;font-size:12px}
.tile-tools .tool-drag{font-size:14px}
.tile-tools .tool-sizes{gap:2px}
@media (pointer:coarse){.tile-tools{flex-wrap:wrap}.tile-tools .tool{min-height:44px;min-width:44px;height:auto;font-size:inherit}}
.tile-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.bento.editing .tile-actions{display:none}
.act-knead{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;background:#8A4F1C;color:#FFFDF8;font-weight:700;font-size:14px;text-decoration:none}
a.act-knead:hover{background:#5E3412;color:#FFFDF8}
.act{position:relative;min-height:36px;min-width:36px;padding:0 12px;gap:6px;border-radius:999px;border:1.5px solid #D9C29C;background:#FFFDF8;color:#2E1D12;font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.act:hover{border-color:#8A4F1C}
a.act{text-decoration:none}a.act:hover{color:#2E1D12}
.act .ico-plein{display:none}
.act[aria-pressed="true"]{background:#F3E6CF;border-color:#8A4F1C;color:#5E3412}
.act[aria-pressed="true"] .ico-plein{display:inline}
.act[aria-pressed="true"] .ico-vide{display:none}
.tile[data-tile="n1"] .act{background:#FFF6E3;border-color:#B87420}
.tile[data-tile="n1"] .act[aria-pressed="true"]{background:#8A4F1C;color:#FFF6E3}
@media (min-width:641px){.tile-M .act[data-act="read"]{padding:0}.tile-M .act[data-act="read"] .act-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (min-width:641px){.tile-S .news-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tile-S .tile-body{gap:6px}.tile-S .tile-actions{padding-top:0;gap:6px}}
@media (min-width:641px){.tile-S .act{padding:0}.tile-S .act-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (pointer:coarse){.act{min-height:44px;min-width:44px}}
#pq-toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;display:flex;justify-content:center;pointer-events:none;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif}
@keyframes pq-apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast-box{animation:none!important}}
.toast-box{animation:pq-apparait .2s ease-out;pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:520px;min-height:44px;padding:8px 8px 8px 18px;border-radius:14px;background:#2E1D12;color:#FBF5EA;font-size:15px;font-weight:600;box-shadow:0 10px 26px rgba(46,29,18,.30)}
.toast-box button{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:#F2C46D;color:#2E1D12;font:inherit;font-weight:700;cursor:pointer}
.toast-box button:focus-visible{outline:2px solid #FBF5EA;outline-offset:2px}
.mep-zone{flex:1 1 100%;display:flex;flex-direction:column;gap:8px}
.mep-titre{margin:0;font-weight:700;font-size:14px;color:#2E1D12}
.mep-groupe{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mep{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-height:44px;padding:10px;border-radius:14px;border:1.5px solid #D9C29C;background:#FBF5EA;color:#2E1D12;font:inherit;text-align:left;cursor:pointer}
.mep:hover{border-color:#8A4F1C}
.mep[aria-checked="true"]{border:2px solid #8A4F1C;padding:9.5px;background:#FFFDF8;box-shadow:0 0 0 3px rgba(138,79,28,.15)}
.mep[aria-checked="true"] .mep-nom::before{content:'✓ ';color:#8A4F1C}
.mep-mini{display:block;padding:6px;border-radius:8px;background:#F3E6CF}
.mep-mini svg{display:block;width:100%;height:auto;max-height:84px}
.mep-nom{font-weight:700;font-size:14px}
.mep-desc{font-size:12.5px;color:#6B5443;line-height:1.35}
.tile.dragging{opacity:.6;box-shadow:0 12px 28px rgba(46,29,18,.25);transform:scale(.98)}
html.is-dragging,html.is-dragging *{cursor:grabbing!important;user-select:none}
@media (min-width:641px){.tile-S .only-M,.tile-S .only-L,.tile-M .only-L{display:none!important}}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-S{grid-column:span 1}.tile-M,.tile-L{grid-column:span 2}}
@media (max-width:640px){.bento{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}.tile-S,.tile-M,.tile-L{grid-column:auto;grid-row:auto}.tile,.tile-body{overflow:visible}}
</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script>
</head><body><div id="root"></div>
<div id="pq-toast" aria-live="polite"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:#FBF5EA;color:#2E1D12;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="fournee" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:#F3E6CF;border-right:1px solid #E7D6B8;padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:22px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A5B23">{{eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:#6B5443;font-size:16px">{{t.subtitle}}</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#FFFDF8;border:1px dashed #D9C29C;color:#6B5443">{{t.sample}}</span>
<button type="button" data-act="edit" aria-pressed="{{editPressed}}" onClick="{{toggleEdit}}" style="{{editBtnStyle}}">{{editLabel}}</button>
</div>
</header>
<p role="status" style="{{loadingStyle}}">{{t.loading}}</p>
<div role="status" style="{{waitStyle}}"><svg class="four-pain" width="96" height="72" viewBox="0 0 96 72" aria-hidden="true"><rect x="4" y="58" width="88" height="10" rx="5" fill="#8A4F1C"></rect><g class="four-pain-miche"><path d="M14 56c0-17 15-30 34-30s34 13 34 30z" fill="#D9A15B"></path><path d="M30 38l6 8M45 34l6 8M60 38l6 8" stroke="#8A4F1C" stroke-width="3" stroke-linecap="round"></path></g></svg><p style="margin:0;font-family:Fraunces, Georgia, serif;font-size:24px;font-weight:800;color:#2E1D12">{{waitTitle}}</p><p style="margin:0;color:#6B5443">{{t.waiting}}</p></div>
<p role="alert" style="{{errorStyle}}">{{t.loadError}}</p>
<p role="status" style="{{exempleStyle}}">{{t.exemple}}</p>
<div style="{{editBarStyle}}">
<div class="mep-zone">
<p id="mep-t" class="mep-titre">{{t.mepTitre}}</p>
<div class="mep-groupe" role="radiogroup" aria-labelledby="mep-t" onKeydown="{{clavierMep}}">
<sc-for list="{{mep}}" as="p" hint-placeholder-count="5">
<button type="button" role="radio" class="mep" data-mep="{{p.id}}" data-act="mep-{{p.id}}" aria-checked="{{p.checked}}" tabindex="{{p.tabindex}}" onClick="{{choisirMep}}"><span class="mep-mini" data-mini="{{p.id}}" aria-hidden="true"></span><span class="mep-nom">{{p.nom}}</span><span class="mep-desc">{{p.desc}}</span></button>
</sc-for>
</div>
</div>
<p style="margin:0;flex:1 1 320px;font-size:14px;color:#5E3412">{{t.editHint}}</p>
<div role="group" aria-label="{{t.countLabel}}" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<span class="muted" style="margin-right:4px">{{t.countLabel}}</span>
<button type="button" class="tool" data-count="1" data-act="count-1" onClick="{{setCount}}" aria-pressed="false">1</button>
<button type="button" class="tool" data-count="3" data-act="count-3" onClick="{{setCount}}" aria-pressed="false">3</button>
<button type="button" class="tool" data-count="5" data-act="count-5" onClick="{{setCount}}" aria-pressed="false">5</button>
<button type="button" class="tool" data-count="7" data-act="count-7" onClick="{{setCount}}" aria-pressed="false">7</button>
</div>
<button type="button" class="tool" data-act="reset" onClick="{{resetLayout}}">{{t.reset}}</button>
</div>
<div style="{{emptyStyle}}"><p style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px;font-weight:800;color:#2E1D12">{{t.allDone}}</p><button type="button" data-act="unskip-all" onClick="{{unskipAll}}" style="min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#8A4F1C;color:#FFFDF8;font:inherit;font-weight:700;cursor:pointer">{{t.bringBack}}</button></div>
<div data-bento class="bento {{gridClass}}" style="{{gridStyle}}">

<sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
<section data-tile="{{s.id}}" class="tile" aria-labelledby="tt-{{s.id}}">
<div class="tile-tools" role="group" aria-label="{{s.toolsLabel}}">
<span class="tool tool-drag" data-drag title="{{s.dragLabel}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="{{s.id}}" data-act="up" onClick="{{tileUp}}" aria-label="{{s.upLabel}}">↑</button>
<button type="button" class="tool" data-id="{{s.id}}" data-act="down" onClick="{{tileDown}}" aria-label="{{s.downLabel}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{s.sizeLabel}}">
<button type="button" class="tool" data-id="{{s.id}}" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="{{s.id}}" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="{{s.id}}" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
</div>
<div class="tile-body">
<div style="display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:#4A3324">
<span class="rank" title="{{s.rankHint}}">{{s.rank}}</span>
<span style="{{s.chip}}">{{s.state}}</span>
<span>{{s.source}}</span>
</div>
<h2 id="tt-{{s.id}}" class="news-title">{{s.title}}</h2>
<p class="only-M" style="margin:0;color:#5A4434;font-size:14px">{{s.summary}}</p>
<p class="only-L" style="margin:0;font-size:13.5px;color:#8A4F1C;font-weight:600">{{s.forYou}}</p>
<p class="only-L" style="margin:0;font-size:12.5px;color:#6B5443"><strong>{{s.whyLabel}}</strong> {{s.why}}</p>
<p class="only-L" style="margin:0;font-size:12.5px;color:#6B5443">{{s.scoreLine}}</p>
<strong style="font-family:Fraunces, Georgia, serif;font-size:17px">{{s.money}}</strong>
<div class="tile-actions">
<a href="{{s.kneadHref}}" data-act="knead" data-id="{{s.id}}" class="act-knead">{{s.knead}}</a>
<button type="button" class="act" data-act="save" data-id="{{s.id}}" aria-pressed="{{s.saved}}" title="{{s.saveLabel}}" onClick="{{toggleSave}}"><svg class="ico-vide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg><svg class="ico-plein" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg><span class="act-label">{{s.saveLabel}}</span></button>
<button type="button" class="act" data-act="skip" data-id="{{s.id}}" title="{{s.skipLabel}}" onClick="{{skip}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg><span class="act-label">{{s.skipLabel}}</span></button>
<a class="act" data-act="read" data-id="{{s.id}}" href="{{s.url}}" target="_blank" rel="noopener" aria-label="{{s.readLabel}}" title="{{s.readLabel}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg><span class="act-label">{{s.read}}</span></a>
</div>
</div>
</section>
</sc-for>

<section data-tile="graph" class="tile" aria-labelledby="tt-graph">
<div class="tile-tools" role="group" aria-label="{{g.toolsLabel}}">
<span class="tool tool-drag" data-drag title="{{g.dragLabel}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="graph" data-act="up" onClick="{{tileUp}}" aria-label="{{g.upLabel}}">↑</button>
<button type="button" class="tool" data-id="graph" data-act="down" onClick="{{tileDown}}" aria-label="{{g.downLabel}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{g.sizeLabel}}">
<button type="button" class="tool" data-id="graph" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="graph" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="graph" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
</div>
<div class="tile-head"><h2 id="tt-graph" class="tile-title">{{t.graphTitle}}</h2><span class="muted">{{t.graphSub}}</span></div>
<div style="flex:1 1 auto;min-height:90px;display:flex;gap:10px;align-items:stretch;border-bottom:2px solid #E7D6B8;padding-bottom:4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px">
<span style="font-size:12px;font-weight:700">{{b.value}}</span>
<div style="{{b.barStyle}}" aria-hidden="true"></div>
</div>
</sc-for>
</div>
<div style="display:flex;gap:10px;font-size:11.5px;color:#4A3324;text-align:center">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<span style="flex:1 1 0;min-width:0;overflow-wrap:anywhere">{{b.label}}</span>
</sc-for>
</div>
</section>

</div>
</main>
</div>
</script>
<script src="/dc.js"></script><script src="/api.js"></script><script src="/bento.js"></script><script src="/bento-ui.js"></script><script src="/comptoir.js"></script><script>

fr: {

},

var STOCKAGE_VIDE = { getItem: function () { return null; }, setItem: function () { throw new Error('stockage indisponible'); } };
function stockage() { try { return window.localStorage || STOCKAGE_VIDE; } catch (e) { return STOCKAGE_VIDE; } }
function prenomCourant() { try { var u = Auth.utilisateurCourant(); return u ? u.prenom : ''; } catch (e) { return ''; } }
function fill(s, vals) { return s.replace(/\{(\w+)\}/g, function (m, k) { return vals[k] == null ? m : vals[k]; }); }
function mepIds() { return Bento.PRESETS.map(function (p) { return p.id; }).concat(Bento.PRESET_PERSO); }
function toolLabels(t, name) {
var n = { name: name };
return { toolsLabel: fill(t.toolsGroup, n), upLabel: fill(t.up, n), downLabel: fill(t.down, n), sizeLabel: fill(t.size, n), dragLabel: t.drag };
}
class Component extends DCLogic {
constructor(props) {
super(props);
var layout;
try { layout = Bento.loadLayout(window.localStorage); } catch (e) { layout = Bento.defaultLayout(); }
this.state = { lang: 'fr', editing: false, layout: layout, perso: Bento.loadPerso(stockage()), data: null, posts: [], loadError: false, store: Store.charger(stockage()) };
var self = this;
BentoUI.initDrag({
isEditing: function () { return !!self.state.editing; },
onDrop: function (id, index) { self.updateLayout(Bento.moveTile(self.state.layout, id, index)); }
});
this.charger();
}
// Tant que l'adaptateur répond « attente », on réinterroge toutes les 2 secondes.
charger() {
var self = this;
Promise.all([Api.chargerFournee(), Api.chargerPosts().catch(function () { return []; })])
.then(function (res) {
if (res[0].etat === 'invalide') throw new Error('identifiant invalide');
self.setState({ data: res[0], posts: res[1] });
if (res[0].etat === 'attente') setTimeout(function () { self.charger(); }, 2000);
})
.catch(function () { self.setState({ loadError: true }); });
}
// Articles du jour non ignorés, triés par rang : l'emplacement n°K reçoit le K-ième.
restants() {
var st = this.state || {};
var d = st.data;
if (!d || d.etat !== 'pret') return [];
return Bento.pickTopics(d.articles, d.articles.length, Store.refsIgnorees(st.store || Store.etatInitial(), Store.dateDuJour(new Date())));
}

// Mettre de côté (bascule) ou ignorer l'article de l'emplacement id. Le store est relu avant
// d'écrire pour ne pas écraser un changement fait dans un autre onglet.
// clavier : action déclenchée au clavier (clic d'activation, e.detail === 0) : le focus passe sur « Annuler ».
agir(id, act, clavier) {
var a = this.restants()[Bento.rankOf(id) - 1];
if (!a) return;
var store = Store.charger(stockage());
var type;
if (act === 'skip') { store = Store.ignorer(store, a.ref, Store.dateDuJour(new Date())); type = 'skip'; }
else if (Store.estDeCote(store, a.ref)) { store = Store.retirer(store, a.ref); type = 'unsave'; }
else { store = Store.mettreDeCote(store, a, new Date().toISOString()); type = 'save'; }
Store.enregistrer(stockage(), store);
// Si l'emplacement disparaît (plus assez de sujets), le focus se replie sur « Annuler ».
this.pendingFocus = clavier ? { toast: true, id: id, act: act } : { id: id, act: act, repli: '[data-toast-undo]' };
this.setState({ store: store, toast: this.nouveauToast({ type: type, article: a, date: Store.dateDuJour(new Date()), origine: { id: id, act: act } }) });
}
// Chaque message remplace le précédent (seule la dernière action est annulable) et dure 5 s.
nouveauToast(t) {
var self = this;
clearTimeout(this.toastTimer);
this.toastN = (this.toastN || 0) + 1;
t.n = this.toastN;
this.toastTimer = setTimeout(function () { self.expirer(); }, 5000);
return t;
}
expirer() {
var t = this.state.toast;
var u = document.querySelector('[data-toast-undo]');
if (t && u && document.activeElement === u) this.pendingFocus = t.origine;
this.setState({ toast: null });
}
annuler() {
var t = this.state.toast;
if (!t || t.type === 'undone') return;
var store = Store.charger(stockage());
if (t.type === 'save') store = Store.retirer(store, t.article.ref);
else if (t.type === 'unsave') store = Store.mettreDeCote(store, t.article, new Date().toISOString());
else store = Store.desIgnorer(store, t.article.ref, t.date);
Store.enregistrer(stockage(), store);
this.pendingFocus = t.origine;
this.setState({ store: store, toast: this.nouveauToast({ type: 'undone' }) });
}
toutFaireRevenir() {
var date = Store.dateDuJour(new Date());
var store = Store.charger(stockage());
Store.refsIgnorees(store, date).forEach(function (ref) { store = Store.desIgnorer(store, ref, date); });
Store.enregistrer(stockage(), store);
clearTimeout(this.toastTimer);
this.pendingFocus = { id: 'n1', act: 'knead' };
this.setState({ store: store, toast: null });
}
// Enregistre la disposition puis re-rend la page. focus = { id, act } du bouton à refocaliser après le rendu.
updateLayout(layout, focus) {
try { Bento.saveLayout(window.localStorage, layout); } catch (e) {}
this.pendingFocus = focus || null;
this.setState({ layout: layout });
}
// Panneau « Mise en page » : applique un préréglage (ou rend la disposition personnalisée),

choisirMep(id, focus) {
var st = this.state;

if (r.perso && r.perso !== st.perso) Bento.savePerso(stockage(), r.perso);
var vide = id === Bento.PRESET_PERSO && !st.perso && Bento.presetCourant(st.layout) !== Bento.PRESET_PERSO;
try { Bento.saveLayout(window.localStorage, r.layout); } catch (e) {}
this.pendingFocus = { act: focus || 'mep-' + id };
this.setState({ layout: r.layout, perso: r.perso, toast: this.nouveauToast({ type: vide ? 'mepVide' : 'mep', mep: id }) });
}
afterRender(root) {

root.querySelectorAll('[data-mini]').forEach(function (el) {
var id = el.getAttribute('data-mini');
var l = id !== Bento.PRESET_PERSO ? Bento.appliquerPreset(lay, id) : (Bento.presetCourant(lay) === Bento.PRESET_PERSO ? lay : (perso || lay));
BentoUI.miniature(el, l);
});
var self = this;
var zone = document.getElementById('pq-toast');
BentoUI.toast(zone, this.vueToast(), function () { self.annuler(); });
BentoUI.suivreToast(zone, {
pause: function () { clearTimeout(self.toastTimer); },
reprise: function () { clearTimeout(self.toastTimer); if (self.state.toast) self.toastTimer = setTimeout(function () { self.expirer(); }, 5000); },
echap: function () { var t = self.state.toast; clearTimeout(self.toastTimer); self.pendingFocus = t && t.origine; self.setState({ toast: null }); }
});
var f = this.pendingFocus;
this.pendingFocus = null;
if (!f) return;
var el = f.toast ? document.querySelector('[data-toast-undo]') : null;
if (!el || !el.offsetParent) el = root.querySelector('[data-act="' + f.act + '"]' + (f.id ? '[data-id="' + f.id + '"]' : ''));
if ((!el || !el.offsetParent) && f.repli) el = document.querySelector(f.repli);
if (!el || !el.offsetParent) el = root.querySelector('[data-act="unskip-all"]');
if (!el || !el.offsetParent) el = root.querySelector('[data-act="edit"]');
if (el) el.focus();
}
vueToast() {
var t = this.state.toast;
if (!t) return null;
var tx = T[this.state.lang || 'fr'];
var textes = { save: tx.toastSave, unsave: tx.toastUnsave, skip: tx.toastSkip, undone: tx.toastUndone, mepVide: tx.mepVide };
if (t.type === 'mep') textes.mep = fill(tx.toastMep, { nom: tx.mep[t.mep][0] });
var sansAnnuler = t.type === 'undone' || t.type === 'mep' || t.type === 'mepVide';
return { cle: t.n + '-' + (this.state.lang || 'fr'), texte: textes[t.type], annuler: sansAnnuler ? '' : tx.undo };
}
renderVals() {
var st = this.state || {};
var lang = st.lang || 'fr';
var t = T[lang];
var data = st.data;
var layout = st.layout;
var locale = lang === 'fr' ? 'fr-FR' : 'en-GB';
var num = function (n) { return new Intl.NumberFormat(locale).format(n); };
var self = this;
var available = this.available();
var idOf = function (e) { return e.currentTarget.getAttribute('data-id'); };
var ready = !!data && data.etat === 'pret';
var picked = this.restants();
var store = st.store || Store.etatInitial();
var posts = st.posts || [];
var today = new Intl.DateTimeFormat(locale, { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
var eyebrow = today.charAt(0).toUpperCase() + today.slice(1) + ' · ' + t.eyebrowTail;
var maintenant = new Date().toISOString();
var barres = Comptoir.graphique(Comptoir.fusionner(Comptoir.depuisExemples(posts, maintenant), Comptoir.depuisPublies(store.publies, ready ? data.articles : [], store.sauves)));
return {
t: t,
eyebrow: eyebrow,
toggleEdit: function () { self.pendingFocus = { act: 'edit' }; self.setState({ editing: !st.editing }); },
tileUp: function (e) { var id = idOf(e); self.updateLayout(Bento.stepTile(layout, id, -1, available), { id: id, act: 'up' }); },
tileDown: function (e) { var id = idOf(e); self.updateLayout(Bento.stepTile(layout, id, 1, available), { id: id, act: 'down' }); },
tileSize: function (e) { var id = idOf(e), s = e.currentTarget.getAttribute('data-size'); self.updateLayout(Bento.setSize(layout, id, s), { id: id, act: 'size-' + s }); },
setCount: function (e) { var n = Number(e.currentTarget.getAttribute('data-count')); self.updateLayout(Bento.setNewsCount(layout, n), { act: 'count-' + n }); },
resetLayout: function () { self.choisirMep('equilibree', 'reset'); },
choisirMep: function (e) { self.choisirMep(e.currentTarget.getAttribute('data-mep')); },
// Groupe de boutons radio : les flèches cochent la carte voisine (en boucle), Début et Fin les extrémités.
clavierMep: function (e) {
var ordre = mepIds();
var cur = e.target.closest && e.target.closest('[data-mep]');
var i = cur ? ordre.indexOf(cur.getAttribute('data-mep')) : -1;
if (i === -1) return;

e.preventDefault();

mep: (function () {
var courant = Bento.presetCourant(layout);
return mepIds().map(function (id) {

return { id: id, nom: t.mep[id][0], desc: t.mep[id][1], checked: String(on), tabindex: on ? '0' : '-1' };
});
})(),
toggleSave: function (e) { self.agir(idOf(e), 'save', e.detail === 0); },
skip: function (e) { self.agir(idOf(e), 'skip', e.detail === 0); },
unskipAll: function () { self.toutFaireRevenir(); },
emptyStyle: ready && data.articles.length > 0 && available === 0 ? 'display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 32px 24px; border-radius: 18px; background: #F6E7CC' : HIDE,
editPressed: String(!!st.editing),
editLabel: st.editing ? t.done : t.customize,
editBtnStyle: 'min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #8A4F1C; background: ' + (st.editing ? '#8A4F1C; color: #FFFDF8' : '#FFFDF8; color: #8A4F1C') + '; font: inherit; font-weight: 700; cursor: pointer',
loadingStyle: !data && !st.loadError ? 'margin: 0; color: #6B5443' : HIDE,
waitStyle: data && data.etat === 'attente' && !st.loadError ? 'display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 40px 24px; border-radius: 18px; background: #F6E7CC' : HIDE,
waitTitle: fill(t.waitTitle, { prenom: prenomCourant() }),
exempleStyle: data && data.source === 'exemple' ? 'margin:0;font-size:13px;color:#6B5443;padding:6px 12px;border-radius:10px;border:1px dashed #D9C29C;align-self:flex-start' : HIDE,
errorStyle: st.loadError ? 'margin: 0; padding: 14px 18px; border-radius: 14px; background: #F5DAD3; color: #8E2A1C; font-weight: 600' : HIDE,
editBarStyle: ready && st.editing ? 'display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 14px 18px; border-radius: 16px; background: #F6E7CC' : HIDE,
gridClass: st.editing ? 'editing' : '',
gridStyle: ready ? '' : HIDE,
slots: SLOT_IDS.map(function (id) {
var k = Bento.rankOf(id);
var c = picked[k - 1];
var labels = toolLabels(t, fill(t.slotName, { n: k }));
var s = {
id: id, rank: fill(t.rank, { n: k }), rankHint: fill(t.rankHint, { n: k }),
chip: HIDE, state: '', source: '', title: '', summary: '', forYou: '', why: '', whyLabel: t.why, scoreLine: '', money: '', url: '#',
knead: t.knead, read: t.read, readLabel: t.read, saveLabel: t.save, skipLabel: t.skip, kneadHref: '/fournil', saved: 'false'

}),

})
};
}
