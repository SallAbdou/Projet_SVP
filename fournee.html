<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>La fournée du jour · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="Today’s batch · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<style>
body{margin:0;background:var(--fond-page)}
a{color:var(--brun)}a:hover{color:var(--brun-fonce)}
button:focus-visible,a:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
</style>
<style>.four-pain-miche{transform-origin:48px 56px;animation:lever 1.6s ease-in-out infinite alternate}@keyframes lever{from{transform:scale(.86,.7)}to{transform:scale(1,1)}}@media (prefers-reduced-motion:reduce){.four-pain-miche{animation:none}}</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<style>
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(180px,auto);grid-auto-flow:dense;gap:16px}
.tile{container-type:inline-size;min-width:0;min-height:0;overflow:hidden;background:var(--creme);border:1px solid var(--bord);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.tile-body{flex:1 0 auto;display:flex;flex-direction:column;gap:8px}
.tile[hidden]{display:none}
/* Arrivée depuis le four du comptoir : halo doré de 2 s, fixe sous prefers-reduced-motion. */
.bento .tile.pq-halo{box-shadow:0 0 0 4px var(--croute),0 0 26px 8px color-mix(in srgb,var(--croute) 55%,transparent);animation:pq-halo 1s ease-in-out 2 alternate}
@keyframes pq-halo{from{box-shadow:0 0 0 3px var(--croute),0 0 10px 2px color-mix(in srgb,var(--croute) 35%,transparent)}to{box-shadow:0 0 0 5px var(--croute),0 0 30px 10px color-mix(in srgb,var(--croute) 60%,transparent)}}
@media (prefers-reduced-motion:reduce){.bento .tile.pq-halo{animation:none}}
.bento .tile.pq-halo .act-knead:focus{outline:2px solid var(--braise);outline-offset:2px}
.tile-S{grid-column:span 1;grid-row:span 1}
.tile-M{grid-column:span 2;grid-row:span 1}
.tile-L{grid-column:span 2;grid-row:span 2}
.tile-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.tile-title{margin:0;font-family:Fraunces, Georgia, serif;font-size:20px;line-height:1.2}
.news-title{margin:0;overflow-wrap:anywhere;font-family:Fraunces, Georgia, serif;font-size:18px;line-height:1.3}
.tile-S .news-title{font-size:16px}
.tile-L .news-title{font-size:24px}
.rank{font-family:Fraunces, Georgia, serif;font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;background:var(--texte);color:var(--fond)}
.muted{font-size:13px;color:var(--doux)}
.score{margin:0;font-family:Fraunces, Georgia, serif;font-size:15px;font-weight:700;line-height:1.3}
.score:empty{display:none}
/* Jauges de monétisation (taille L, donc le n°1 par défaut) : total en avant, trois jauges de 0 à 5.
   La valeur est écrite en clair à côté de chaque barre (décorative), rien ne passe par la couleur seule. */
.jauges{display:flex;flex-direction:column;gap:7px;padding:12px 16px 14px;border-radius:14px;background:var(--creme);border:1px solid var(--bord-fort)}
.jauges-total{margin:0 0 2px;font-family:Fraunces, Georgia, serif;font-weight:800;font-size:20px;line-height:1.2;color:var(--brun)}
.jauge{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.6em;align-items:center;gap:12px;font-size:13px;line-height:1.3;color:var(--texte)}
.jauge-nom{font-weight:600}
.jauge-piste{display:block;height:12px;border-radius:999px;background:color-mix(in srgb,var(--brun) 14%,transparent);box-shadow:inset 0 0 0 1px var(--bord-fort);overflow:hidden}
.jauge-plein{display:block;height:100%;border-radius:inherit;background:var(--brun)}
.jauge-val{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
@media (min-width:641px){.tile-L .score{display:none}}
/* Fournée sans défilement sur grand écran (au moins 1101 x 700) quand la grille tient en 3 rangées
   (Bento.rangees) et hors mode Personnaliser : la page prend au moins la hauteur de l'écran, la grille se
   partage la hauteur restante, titres et textes sont tronqués à quelques lignes. Une rangée ne descend
   jamais sous la hauteur de son contenu : si le contenu ne tient pas (ex. 7 news), la page défile au lieu
   de couper un bouton. Ailleurs, défilement normal. */
@media (min-width:1101px) and (min-height:700px){
main.fournee-tient{min-height:100vh;padding:22px 32px 22px!important;gap:14px!important}
main.fournee-tient h1{font-size:32px!important}
main.fournee-tient header p{font-size:14px!important}
main.fournee-tient .bento{flex:1 0 auto;grid-auto-rows:minmax(min-content,1fr);gap:14px}
main.fournee-tient .tile{padding:14px 18px;gap:8px}
main.fournee-tient .tile-body{flex:1 1 auto;min-height:0;gap:5px}
main.fournee-tient .tile-body>*{flex-shrink:0}
main.fournee-tient .tile-M .resume{-webkit-line-clamp:1}
main.fournee-tient .news-title,main.fournee-tient .resume,main.fournee-tient .raison,main.fournee-tient .pour-toi>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
main.fournee-tient .tile-M .news-title{font-size:17px}
main.fournee-tient .tile-L .news-title{font-size:22px}
main.fournee-tient .tile-L .resume{-webkit-line-clamp:3}
main.fournee-tient .pour-toi{font-size:15px}
main.fournee-tient .jauges{margin-top:auto}
}
@media (min-width:1101px) and (min-height:880px){main.fournee-tient .tile-M .resume{-webkit-line-clamp:2}}
@media (max-width:640px){.tile .score{display:none}}
/* Emplacement n°1 : doré « Maillard », la croûte bien dorée, pour repérer d'un coup d'œil la news la mieux notée. */
.tile[data-tile="n1"]{--texte:var(--or-texte);--texte-2:var(--or-texte-2);--doux:var(--or-texte-2);--brun:var(--or-brun);--brun-fonce:var(--or-texte-2);--creme:var(--or-surface);--sur-plein:var(--or-sur-plein);--source:var(--or-source);--source-fonce:var(--or-source-fonce);--bord-fort:var(--or-bord);color:var(--sur-clair);background:var(--maillard);border:2px solid var(--cuivre);box-shadow:0 8px 22px color-mix(in srgb,var(--or-bord) 30%,transparent)}
.bento.editing .tile[data-tile="n1"]{border:2px dashed var(--brun)}
.tile[data-tile="n1"] .rank{background:var(--brun);color:var(--or-surface);box-shadow:0 0 0 2px var(--or-haut)}
.tile[data-tile="n1"] .tile-body p{color:var(--sur-clair)!important}
.tile[data-tile="n1"] .tile-body a[target]{background:var(--creme);border-color:var(--cuivre)!important}
.tile[data-tile="n1"] .tile-tools .tool{background:var(--creme)}
.tile[data-tile="n1"] .tile-tools .tool[aria-pressed="true"]{background:var(--brun);color:var(--sur-plein)}
.tile-tools{display:none;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1.5px dashed var(--bord-fort)}
.bento.editing .tile-tools{display:flex}
.bento.editing .tile{border:1.5px dashed var(--cuivre);box-shadow:0 2px 0 var(--bord)}
.tool-sizes{display:inline-flex;gap:4px}
.tool{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:1.5px solid var(--bord-fort);background:var(--fond);color:var(--texte);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tool[aria-pressed="true"]{background:var(--brun);border-color:var(--brun);color:var(--sur-plein)}
.tool-drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px}
.bento.editing .tile{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bento.editing .tile button{cursor:pointer}
.tile-tools{flex-wrap:nowrap;gap:4px;padding-bottom:0;border-bottom:0}
.tile-tools .tool{min-height:28px;min-width:28px;height:28px;padding:0 7px;border-radius:8px;border-width:1px;font-size:12px}
.tile-tools .tool-drag{font-size:14px}
.tile-tools .tool-sizes{gap:2px}
@media (pointer:coarse){.tile-tools{flex-wrap:wrap}.tile-tools .tool{min-height:44px;min-width:44px;height:auto;font-size:inherit}}
.tile-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
.etiquette-source:empty{display:none}
.bento.editing .tile-actions{display:none}
.act{position:relative;flex:none;min-height:36px;min-width:36px;padding:0 12px;gap:6px;border-radius:999px;border:1.5px solid var(--bord-fort);background:var(--creme);color:var(--texte);font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.act:hover{border-color:var(--brun)}
a.act{text-decoration:none}a.act:hover{color:var(--texte)}
.act .ico-plein{display:none}
.act[aria-pressed="true"]{background:var(--sable);border-color:var(--brun);color:var(--brun-fonce)}
.act[aria-pressed="true"] .ico-plein{display:inline}
.act[aria-pressed="true"] .ico-vide{display:none}
.tile[data-tile="n1"] .act{background:var(--creme);border-color:var(--cuivre)}
.tile[data-tile="n1"] .act[aria-pressed="true"]{background:var(--brun);color:var(--creme)}
.act[data-act="read"],.tile[data-tile="n1"] .tile-body a.act[data-act="read"]{background:var(--lire-fond);border-color:var(--lire-fond)!important;color:var(--lire-texte)}
a.act[data-act="read"]:hover,.tile[data-tile="n1"] .tile-body a.act[data-act="read"]:hover{background:var(--lire-survol);border-color:var(--lire-survol)!important;color:var(--lire-texte)}
a.act[data-act="read"]:active{transform:translateY(1px)}
@media (min-width:641px){.tile-S .tile-body{gap:6px}.tile-S .tile-actions{padding-top:0}}
/* Actions sur une ligne : Mettre de côté et Ignorer en icônes seules ; selon la largeur réelle du bloc,
   Lire la source passe en icône (moins de 400 px) puis Pétrir un post devient Pétrir (moins de 280 px). */
.act[data-act="save"],.act[data-act="skip"]{padding:0}
@container (max-width:399.98px){.act[data-act="read"]{padding:0}.act[data-act="read"] .act-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@container (max-width:279.98px){.act-suite{display:none}.act-knead{padding:0 14px}}
@media (pointer:coarse){.act{min-height:44px;min-width:44px}}
#pq-toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;display:flex;justify-content:center;pointer-events:none;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif}
@keyframes pq-apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast-box{animation:none!important}}
.toast-box{animation:pq-apparait .2s ease-out;pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:520px;min-height:44px;padding:8px 8px 8px 18px;border-radius:14px;background:var(--texte);color:var(--fond);font-size:15px;font-weight:600;box-shadow:var(--ombre-3)}
.toast-box button{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--croute);color:var(--sur-clair);font:inherit;font-weight:700;cursor:pointer}
.toast-box button:focus-visible{outline:2px solid var(--fond);outline-offset:2px}
.mep-zone{flex:1 1 100%;display:flex;flex-direction:column;gap:8px}
.mep-titre{margin:0;font-weight:700;font-size:14px;color:var(--texte)}
.mep-groupe{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mep{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-height:44px;padding:10px;border-radius:14px;border:1.5px solid var(--bord-fort);background:var(--fond);color:var(--texte);font:inherit;text-align:left;cursor:pointer}
.mep:hover{border-color:var(--brun)}
.mep[aria-checked="true"]{border:2px solid var(--brun);padding:9.5px;background:var(--creme);box-shadow:0 0 0 3px color-mix(in srgb,var(--brun) 15%,transparent)}
.mep[aria-checked="true"] .mep-nom::before{content:'✓ ';color:var(--brun)}
.mep-mini{display:block;padding:6px;border-radius:8px;background:var(--sable)}
.mep-mini svg{display:block;width:100%;height:auto;max-height:84px}
.mep-nom{font-weight:700;font-size:14px}
.mep-desc{font-size:12.5px;color:var(--doux);line-height:1.35}
.tile.dragging{opacity:.6;box-shadow:var(--ombre-3);transform:scale(.98)}
html.is-dragging,html.is-dragging *{cursor:grabbing!important;user-select:none}
@media (min-width:641px){.tile-S .only-M,.tile-S .only-L,.tile-M .only-L{display:none!important}}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-S{grid-column:span 1}.tile-M,.tile-L{grid-column:span 2}}
@media (max-width:640px){.bento{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}.tile-S,.tile-M,.tile-L{grid-column:auto;grid-row:auto}.tile,.tile-body{overflow:visible}}
</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script><script src="/theme.js"></script>
</head><body><div id="root"></div>
<div id="pq-toast" aria-live="polite"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:var(--fond);color:var(--texte);font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="fournee" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:var(--sable);border-right:1px solid var(--bord);padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main class="{{mainClass}}" style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:22px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--sur-titre)">{{eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:var(--doux);font-size:16px">{{t.subtitle}}</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--creme);border:1px dashed var(--bord-fort);color:var(--doux)">{{t.sample}}</span>
<button type="button" data-act="edit" aria-pressed="{{editPressed}}" onClick="{{toggleEdit}}" style="{{editBtnStyle}}">{{editLabel}}</button>
</div>
</header>
<p role="status" style="{{loadingStyle}}">{{t.loading}}</p>
<div role="status" style="{{waitStyle}}"><svg class="four-pain" width="96" height="72" viewBox="0 0 96 72" aria-hidden="true"><rect x="4" y="58" width="88" height="10" rx="5" fill="var(--brun)"></rect><g class="four-pain-miche"><path d="M14 56c0-17 15-30 34-30s34 13 34 30z" fill="var(--pain-haut)"></path><path d="M30 38l6 8M45 34l6 8M60 38l6 8" stroke="var(--brun)" stroke-width="3" stroke-linecap="round"></path></g></svg><p style="margin:0;font-family:Fraunces, Georgia, serif;font-size:24px;font-weight:800;color:var(--texte)">{{waitTitle}}</p><p style="margin:0;color:var(--doux)">{{t.waiting}}</p></div>
<p role="alert" style="{{errorStyle}}">{{t.loadError}}</p>
<p role="status" style="{{exempleStyle}}">{{t.exemple}}</p>
<div style="{{editBarStyle}}">
<div class="mep-zone">
<p id="mep-t" class="mep-titre">{{t.mepTitre}}</p>
<div class="mep-groupe" role="radiogroup" aria-labelledby="mep-t" onKeydown="{{clavierMep}}">
<sc-for list="{{mep}}" as="p" hint-placeholder-count="5">
<button type="button" role="radio" class="mep" data-mep="{{p.id}}" data-act="mep-{{p.id}}" aria-checked="{{p.checked}}" tabindex="{{p.tabindex}}" onClick="{{choisirMep}}"><span class="mep-mini" data-mini="{{p.id}}" aria-hidden="true"></span><span class="mep-nom">{{p.nom}}</span><span class="mep-desc">{{p.desc}}</span></button>
</sc-for>
</div>
</div>
<p style="margin:0;flex:1 1 320px;font-size:14px;color:var(--brun-fonce)">{{t.editHint}}</p>
<div role="group" aria-label="{{t.countLabel}}" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<span class="muted" style="margin-right:4px">{{t.countLabel}}</span>
<button type="button" class="tool" data-count="1" data-act="count-1" onClick="{{setCount}}" aria-pressed="false">1</button>
<button type="button" class="tool" data-count="3" data-act="count-3" onClick="{{setCount}}" aria-pressed="false">3</button>
<button type="button" class="tool" data-count="5" data-act="count-5" onClick="{{setCount}}" aria-pressed="false">5</button>
<button type="button" class="tool" data-count="7" data-act="count-7" onClick="{{setCount}}" aria-pressed="false">7</button>
</div>
<button type="button" class="tool" data-act="graph-toggle" aria-pressed="{{graphPressed}}" onClick="{{toggleGraph}}">{{graphLabel}}</button>
<button type="button" class="tool" data-act="reset" onClick="{{resetLayout}}">{{t.reset}}</button>
</div>
<div style="{{emptyStyle}}"><p style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px;font-weight:800;color:var(--texte)">{{t.allDone}}</p><button type="button" data-act="unskip-all" onClick="{{unskipAll}}" style="min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--braise);color:var(--sur-plein);font:inherit;font-weight:700;cursor:pointer">{{t.bringBack}}</button></div>
<div data-bento class="bento {{gridClass}}" style="{{gridStyle}}">

<sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
<section data-tile="{{s.id}}" class="tile" aria-labelledby="tt-{{s.id}}">
<div class="tile-tools" role="group" aria-label="{{s.toolsLabel}}">
<span class="tool tool-drag" data-drag title="{{s.dragLabel}}" aria-hidden="true">⠿</span>
<button type="button" class="tool" data-id="{{s.id}}" data-act="up" onClick="{{tileUp}}" aria-label="{{s.upLabel}}">↑</button>
<button type="button" class="tool" data-id="{{s.id}}" data-act="down" onClick="{{tileDown}}" aria-label="{{s.downLabel}}">↓</button>
<span class="tool-sizes" role="group" aria-label="{{s.sizeLabel}}">
<button type="button" class="tool" data-id="{{s.id}}" data-size="S" data-act="size-S" onClick="{{tileSize}}" aria-pressed="false">S</button>
<button type="button" class="tool" data-id="{{s.id}}" data-size="M" data-act="size-M" onClick="{{tileSize}}" aria-pressed="false">M</button>
<button type="button" class="tool" data-id="{{s.id}}" data-size="L" data-act="size-L" onClick="{{tileSize}}" aria-pressed="false">L</button>
</span>
</div>
<div class="tile-body">
<div style="display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--texte-2)">
<span class="rank" title="{{s.rankHint}}">{{s.rank}}</span>
<span class="{{s.chip}}">{{s.state}}</span>
<span class="etiquette-source">{{s.source}}</span>
</div>
<h2 id="tt-{{s.id}}" class="news-title">{{s.title}}</h2>
<p class="only-M resume" style="margin:0;color:var(--texte-2);font-size:14px">{{s.summary}}</p>
<p class="only-L pour-toi" style="margin:0"><svg class="ampoule" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 1v1.8M4.2 4.2l1.3 1.3M19.8 4.2l-1.3 1.3M1.5 11.5h1.8M20.7 11.5h1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><path d="M12 5a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.4h5.2v-.4c0-.8.4-1.5 1-2A6 6 0 0 0 12 5z" fill="currentColor" stroke="var(--brun)" stroke-width="1.2" stroke-linejoin="round"></path><path d="M9.6 20.6h4.8M10.6 22.8h2.8" stroke="var(--brun)" stroke-width="1.6" stroke-linecap="round"></path></svg><span>{{s.forYou}}</span></p>
<p class="raison {{s.whyClass}}" style="margin:0;font-size:12.5px;color:var(--doux)"><strong>{{s.whyLabel}}</strong> {{s.why}}</p>
<div class="only-L jauges" role="group" aria-labelledby="jt-{{s.id}}">
<p id="jt-{{s.id}}" class="jauges-total">{{s.money}}</p>
<div class="jauge"><span class="jauge-nom">{{s.j1Nom}}</span><span class="jauge-piste" aria-hidden="true"><span class="jauge-plein" style="{{s.j1Style}}"></span></span><span class="jauge-val">{{s.j1Val}}</span></div>
<div class="jauge"><span class="jauge-nom">{{s.j2Nom}}</span><span class="jauge-piste" aria-hidden="true"><span class="jauge-plein" style="{{s.j2Style}}"></span></span><span class="jauge-val">{{s.j2Val}}</span></div>
