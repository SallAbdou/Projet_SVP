<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Le garde-manger · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="The pantry · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<style>
body{margin:0;background:var(--fond-page)}
a{color:var(--brun)}a:hover{color:var(--brun-fonce)}
button:focus-visible,a:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
</style>
<style>*{box-sizing:border-box}html{overflow-x:hidden}body{overflow-x:clip}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<style>
.gm-item{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:18px 24px;border-bottom:1px solid var(--trait)}
.gm-item:last-child{border-bottom:0}
.gm-actions{flex:0 1 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.gm-knead{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--braise);color:var(--sur-plein);font-weight:700;font-size:14px;text-decoration:none}
a.gm-knead:hover{background:var(--braise-fonce);color:var(--sur-plein)}
.gm-sec{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--bord-fort);background:var(--creme);color:var(--texte);font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.gm-sec:hover{border-color:var(--brun);color:var(--texte)}
.gm-source{background:var(--lire-fond);border-color:var(--lire-fond);color:var(--lire-texte)}
a.gm-source:hover{background:var(--lire-survol);border-color:var(--lire-survol);color:var(--lire-texte)}
a.gm-source:active{transform:translateY(1px)}
@media (max-width:640px){.gm-item{padding:16px}.gm-actions{justify-content:flex-start}}
/* Filtres aux couleurs des états : contour et pastille de la couleur, rempli et coché quand actif. */
.gm-filtre{--f:var(--brun-fonce);--f-texte:var(--sur-plein);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--f);background:var(--creme);color:var(--texte);font:inherit;font-weight:600;cursor:pointer}
.gm-filtre::before{content:'';flex:none;width:10px;height:10px;border-radius:50%;background:var(--f)}
.gm-filtre:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--brun) 18%,transparent)}
.gm-filtre[aria-pressed="true"]{background:var(--f);color:var(--f-texte);font-weight:700}
.gm-filtre[aria-pressed="true"]::before{content:'✓';content:'✓' / '';width:auto;height:auto;background:none;border-radius:0;font-weight:800}
.gm-filtre-chaud{--f:var(--braise)}
.gm-filtre-enfourner{--f:var(--barre-petrir);--f-texte:var(--chaud-texte)}
.gm-filtre-rassis{--f:var(--rassis-fond)}
/* Lot 33 : onglets Mis de côté / Collection de pains (lot 34). L'onglet choisi est souligné et en texte plein (pas la couleur seule). */
.gm-onglets{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--bord)}
.gm-onglet{min-height:44px;padding:0 18px;margin-bottom:-2px;border:0;border-bottom:4px solid transparent;background:none;color:var(--doux);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.gm-onglet:hover{color:var(--texte);border-bottom-color:var(--bord-fort)}
.gm-onglet[aria-selected="true"]{color:var(--texte);font-weight:800;border-bottom-color:var(--braise)}
.gm-panneau:focus-visible{outline:2px solid var(--braise);outline-offset:4px;border-radius:8px}
/* Lot 34 : collection de pains. Progression par famille, puis historique filtrable du plus récent au plus ancien. */
.col-bloc{display:flex;flex-direction:column;gap:12px}
.col-bloc .jeu-famille-titre{margin:0}
.col-series{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.col-filtres{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.col-filtre{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.col-filtre select{min-height:44px;min-width:11em;padding:0 12px;border-radius:12px;border:1.5px solid var(--bord-fort);background:var(--creme);color:var(--texte);font:inherit;font-weight:600}
.col-filtre select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.col-affichees{margin:0 0 0 auto;font-size:14px;color:var(--doux);align-self:center}
.jeu-carte-mini .jeu-meta{gap:4px 10px}
.jeu-grignes[data-n="3"] path:nth-child(n+4),.jeu-grignes[data-n="2"] path:nth-child(n+3),.jeu-grignes[data-n="1"] path:nth-child(n+2){display:none}
#pq-toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;display:flex;justify-content:center;pointer-events:none;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif}
@keyframes pq-apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){html:not([data-animations="on"]) .toast-box{animation:none!important}}
.toast-box{animation:pq-apparait .2s ease-out;pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:520px;min-height:44px;padding:8px 8px 8px 18px;border-radius:14px;background:var(--texte);color:var(--fond);font-size:15px;font-weight:600;box-shadow:var(--ombre-3)}
.toast-box button{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--croute);color:var(--sur-clair);font:inherit;font-weight:700;cursor:pointer}
.toast-box button:focus-visible{outline:2px solid var(--fond);outline-offset:2px}
</style>

</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a><div id="root"></div>
<div id="pq-toast" aria-live="polite"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:var(--fond);color:var(--texte);font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="garde-manger" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:var(--sable);border-right:1px solid var(--bord);padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main id="contenu" tabindex="-1" style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:24px">
<header style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--sur-titre)">{{t.eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:var(--doux);font-size:16px">{{t.subtitle}}</p>
</header>
<div role="tablist" aria-label="{{j.collection.onglets}}" class="gm-onglets" style="{{ongletsStyle}}" onKeydown="{{clavierOnglets}}">
<button type="button" role="tab" id="gm-onglet-cote" class="gm-onglet" data-act="onglet-cote" data-onglet="cote" aria-selected="{{coteSel}}" aria-controls="gm-panneau-cote" tabindex="{{coteTab}}" onClick="{{choisirOnglet}}">{{ongletCote}}</button>
<button type="button" role="tab" id="gm-onglet-collection" class="gm-onglet" data-act="onglet-collection" data-onglet="collection" aria-selected="{{colSel}}" aria-controls="gm-panneau-collection" tabindex="{{colTab}}" onClick="{{choisirOnglet}}">{{ongletCol}}</button>
</div>
<div role="tabpanel" id="gm-panneau-cote" aria-labelledby="gm-onglet-cote" class="gm-panneau" style="{{panneauCoteStyle}}">
<div role="group" aria-label="{{t.filterLabel}}" style="{{filtersStyle}}">
<sc-for list="{{filtres}}" as="f" hint-placeholder-count="4">
<button type="button" class="gm-filtre gm-filtre-{{f.id}}" data-act="{{f.act}}" data-filtre="{{f.id}}" aria-pressed="{{f.pressed}}" onClick="{{choisirFiltre}}">{{f.label}}</button>
</sc-for>
</div>
<div data-visite="garde" style="{{emptyStyle}}">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--cuivre)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v10H4z"></path><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"></path><path d="M10 14h4"></path></svg>
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:24px;font-weight:800">{{t.emptyTitle}}</h2>
<p style="margin:0;color:var(--doux);max-width:460px">{{t.emptyText}}</p>
<a href="/fournee" data-act="go-batch" class="gm-knead">{{t.emptyLink}}</a>
</div>
<p style="{{noMatchStyle}}">{{t.noMatch}}</p>
<section data-visite="garde" aria-label="{{t.listLabel}}" style="{{listStyle}}">
<sc-for list="{{items}}" as="i" hint-placeholder-count="4">
<article class="gm-item">
<div style="flex:999 1 380px;min-width:0;display:flex;gap:14px">
<span style="{{i.bar}}" aria-hidden="true"></span>
<div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--doux)">
<span class="{{i.chip}}">{{i.state}}</span><span>{{i.source}}</span><span aria-hidden="true" style="{{i.sepStyle}}">·</span><span>{{i.saved}}</span>
</div>
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:19px;line-height:1.3;overflow-wrap:anywhere">{{i.title}}</h2>
</div>
</div>
<div class="gm-actions">
<a href="{{i.kneadHref}}" data-act="knead" data-id="{{i.ref}}" aria-label="{{i.kneadLabel}}" class="btn-petrir"><svg class="pain-ico" viewBox="0 0 24 16" aria-hidden="true" focusable="false"><path d="M1.5 11.2C1.5 6.4 6.2 3 12 3s10.5 3.4 10.5 8.2c0 1.6-1.2 2.8-2.8 2.8H4.3c-1.6 0-2.8-1.2-2.8-2.8z" fill="var(--petrir-pain)" stroke="currentColor" stroke-width="1.3"></path><path d="M6.8 7.4l2.2 2.6M10.9 6.4l2.2 2.6M15 7.4l2.2 2.6" stroke="var(--petrir-grigne)" stroke-width="1.6" stroke-linecap="round" fill="none"></path></svg>{{t.knead}}</a>
<a href="{{i.url}}" target="_blank" rel="noopener" data-act="read" data-id="{{i.ref}}" aria-label="{{i.readLabel}}" class="gm-sec gm-source"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>{{t.read}}</a>
<button type="button" data-act="remove" data-id="{{i.ref}}" aria-label="{{i.removeLabel}}" onClick="{{retirer}}" class="gm-sec">{{t.remove}}</button>
</div>
</article>
</sc-for>
</section>
</div>
<div role="tabpanel" id="gm-panneau-collection" aria-labelledby="gm-onglet-collection" tabindex="0" class="gm-panneau jeu-collection" style="{{panneauColStyle}}">
<p style="margin:0;color:var(--doux);font-size:16px">{{j.collection.intro}}</p>
<p style="{{colExempleStyle}}">{{j.collection.exemple}}</p>
<p style="margin:0;font-weight:700">{{colTotal}}</p>
<div style="{{colVideStyle}}"><p style="margin:0;color:var(--doux)">{{j.collection.vide}}</p><a href="/fournee" class="gm-knead">{{t.emptyLink}}</a></div>
<section class="col-bloc" data-col-familles aria-labelledby="col-fam-t" style="{{colGrilleStyle}}">
<h2 id="col-fam-t" class="jeu-famille-titre">{{j.collection.familles}}</h2>
<ul class="col-series">
<sc-for list="{{colSeries}}" as="f" hint-placeholder-count="3">
<li>{{f.serie}}</li>
</sc-for>
</ul>
</section>
<section class="col-bloc" data-col-historique aria-labelledby="col-hist-t" style="{{colGrilleStyle}}">
<h2 id="col-hist-t" class="jeu-famille-titre">{{j.collection.historique}}</h2>
<div class="col-filtres">
<div class="col-filtre"><label for="col-rarete">{{j.collection.filtreRarete}}</label><select id="col-rarete" data-focus="col-rarete" onChange="{{filtrerRarete}}">
<sc-for list="{{optRarete}}" as="o" hint-placeholder-count="5">
<option value="{{o.v}}" {{o.sel}}>{{o.nom}}</option>
</sc-for>
</select></div>
<div class="col-filtre"><label for="col-famille">{{j.collection.filtreFamille}}</label><select id="col-famille" data-focus="col-famille" onChange="{{filtrerFamille}}">
<sc-for list="{{optFamille}}" as="o" hint-placeholder-count="4">
<option value="{{o.v}}" {{o.sel}}>{{o.nom}}</option>
</sc-for>
</select></div>
<p class="col-affichees" role="status">{{colAffichees}}</p>
</div>
<p style="{{colAucuneStyle}}">{{j.collection.aucune}}</p>
<ol class="jeu-collection-grille" style="{{colListeStyle}}">
<sc-for list="{{colCartes}}" as="x" hint-placeholder-count="6">
<li><article class="jeu-carte jeu-carte-mini" data-rarete="{{x.rarete}}" data-cuite="{{x.cuite}}" aria-labelledby="{{x.id}}-t">
<div class="jeu-tete"><span class="jeu-rarete"><svg class="jeu-grignes" data-n="{{x.grignes}}" viewBox="0 0 30 16" aria-hidden="true" focusable="false"><path d="M3 12l4-8"></path><path d="M10 12l4-8"></path><path d="M17 12l4-8"></path><path d="M24 12l4-8"></path></svg><span>{{x.rareteNom}}</span></span><span class="{{x.chip}}">{{x.fraicheurNom}}</span><span class="jeu-cuite" style="{{x.cuiteStyle}}"><svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M1.5 11.2C1.5 6.4 6.2 3 12 3s10.5 3.4 10.5 8.2c0 1.6-1.2 2.8-2.8 2.8H4.3c-1.6 0-2.8-1.2-2.8-2.8z"></path><path d="M6.8 7.4l2.2 2.6M10.9 6.4l2.2 2.6M15 7.4l2.2 2.6"></path></svg>{{j.cuite}}</span></div>
<h3 id="{{x.id}}-t" class="jeu-titre">{{x.titre}}</h3>
<div class="jeu-meta"><span class="etiquette-source" style="{{x.sourceStyle}}">{{x.source}}</span><span class="jeu-famille">{{x.famille}}</span></div>
<p class="jeu-carte-date">{{x.date}}</p>
</article></li>
</sc-for>
</ol>
</section>
</div>
<div style="display:flex;gap:14px;align-items:flex-start;background:var(--panneau);color:var(--panneau-texte);border-radius:18px;padding:18px 22px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--panneau-or)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M16.3 7.7l2.1-2.1"></path><path d="M8 16a4 4 0 1 1 8 0v2H8z"></path><path d="M10 21h4"></path></svg>
<div style="display:flex;flex-direction:column;gap:4px">
<span style="font-family:Fraunces, Georgia, serif;font-size:18px;font-weight:700;color:var(--panneau-or)">{{t.learnTitle}}</span>
<span style="font-size:14px;color:var(--panneau-doux)">{{t.learnText}}</span>
</div>
</div>
</main>
</div>
</script>
<script src="/dc.js"></script><script src="/bento.js"></script><script src="/bento-ui.js"></script><script src="/garde-manger.js"></script><script src="/charte.js"></script><script>
var HIDE = 'display: none';
var CHIP = { chaud: Charte.puce('chaud'), enfourner: Charte.puce('enfourner'), rassis: Charte.puce('rassis') };
function BAR(cat) { return 'flex: 0 0 6px; align-self: stretch; min-height: 56px; border-radius: 6px; background: ' + Charte.barre(cat) + '; box-shadow: ' + (Charte.contourBarre(cat) || 'none'); }
var T = {
fr: {
navLabel: 'Navigation principale',
eyebrow: 'Articles mis de côté', title: 'Le garde-manger',
subtitle: 'Ce que tu as mis de côté. Chaque article indique sa fraîcheur.',

filtres: { tout: 'Tout', chaud: 'Encore chaud', enfourner: 'À enfourner avant demain', rassis: 'Rassis' },
knead: 'Pétrir', read: 'Lire la source', remove: 'Retirer', newTab: 'nouvel onglet',
emptyTitle: 'Ton garde-manger est vide',
emptyText: 'Dans la fournée du jour, mets de côté les sujets que tu veux garder pour plus tard : ils t’attendront ici.',
emptyLink: 'Aller à la fournée du jour',
noMatch: 'Rien dans cette catégorie pour l’instant',
undo: 'Annuler', toastRemove: 'Retiré du garde-manger', toastUndone: 'Action annulée',
learnTitle: 'Tes choix d’aujourd’hui font une meilleure fournée pour demain', learnText: 'Ce que tu mets de côté, pétris ou ignores sert à mieux choisir les cinq sujets du lendemain.'
},
en: {
navLabel: 'Main navigation',
eyebrow: 'Saved articles', title: 'The pantry',
subtitle: 'What you set aside. Each article shows its freshness.',
filterLabel: 'Filter by freshness', listLabel: 'Saved articles',
filtres: { tout: 'All', chaud: 'Still warm', enfourner: 'Bake before tomorrow', rassis: 'Gone stale' },
knead: 'Knead', read: 'Read the source', remove: 'Remove', newTab: 'new tab',
emptyTitle: 'Your pantry is empty',
emptyText: 'In today’s batch, save the topics you want to keep for later: they will wait for you here.',
emptyLink: 'Go to today’s batch',
noMatch: 'Nothing in this category yet',
undo: 'Undo', toastRemove: 'Removed from the pantry', toastUndone: 'Undone',
learnTitle: 'Today’s choices make a better batch tomorrow', learnText: 'What you save, knead or skip helps pick tomorrow’s five topics.'
}
};
var ONGLETS = ['cote', 'collection'];
function ongletDemande() { try { return new URLSearchParams(window.location.search).get('onglet') === 'collection' ? 'collection' : 'cote'; } catch (e) { return 'cote'; } }
// Lot 35 : thématiques du profil connecté, pour nommer les familles (l'axe WF3 vaut « Axe N »).
function thematiquesCourantes() { try { var u = Auth.utilisateurCourant(); return u && u.profil ? u.profil.thematiques : []; } catch (e) { return []; } }
function cleJeu() { try { return Jeu.cleDuCompte(Auth.utilisateurCourant()); } catch (e) { return null; } }
function dateLisible(iso, lang) {
var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
if (!m) return '';
return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(lang === 'en' ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'long' });
}
var STOCKAGE_VIDE = { getItem: function () { return null; }, setItem: function () { throw new Error('stockage indisponible'); } };
function stockage() { try { return window.localStorage || STOCKAGE_VIDE; } catch (e) { return STOCKAGE_VIDE; } }
// Recherche par attribut sans construire de sélecteur (une ref peut contenir des guillemets).
function trouver(root, act, id) {
var els = root.querySelectorAll('[data-act="' + act + '"]');
for (var i = 0; i < els.length; i++) if (id == null || els[i].getAttribute('data-id') === id) return els[i];
return null;
}
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr', filtre: 'tout', store: Store.charger(stockage()), toast: null, onglet: ongletDemande(), colRarete: '', colFamille: '' }; }
// Lot 33 : onglets « Mis de côté » et « Ma collection » (motif tablist : flèches, Début, Fin, activation immédiate).
choisirOnglet(id, focus) {
if (ONGLETS.indexOf(id) === -1) return;
if (focus) this.pendingFocus = { act: 'onglet-' + id };
try { history.replaceState(null, '', location.pathname + (id === 'collection' ? '?onglet=collection' : '') + location.hash); } catch (e) {}
this.setState({ onglet: id });
}
maintenant() { return new Date().toISOString(); }
visibles() {
var st = this.state || {};
return GardeManger.filtrer((st.store || Store.etatInitial()).sauves, st.filtre, this.maintenant());
}
// Le store est relu avant d'écrire pour ne pas écraser un changement fait dans un autre onglet.
// clavier : action déclenchée au clavier (e.detail === 0) : le focus passe sur « Annuler ».
retirer(ref, clavier) {
var liste = this.visibles();
var i = liste.map(function (a) { return a.ref; }).indexOf(ref);
var store = Store.charger(stockage());
var article = store.sauves.filter(function (s) { return s.ref === ref; })[0];
if (!article) { this.setState({ store: store }); return; }
store = Store.retirer(store, ref);
Store.enregistrer(stockage(), store);
// Focus : Retirer de l'article suivant, sinon du précédent, sinon « Annuler » du message.
var voisin = liste[i + 1] || liste[i - 1];
var suite = { act: 'remove', id: voisin ? voisin.ref : '__aucun__', repli: true };
this.pendingFocus = clavier ? { toast: true, act: suite.act, id: suite.id, repli: true } : suite;
this.setState({ store: store, toast: this.nouveauToast({ type: 'remove', article: article, origine: suite }) });
}
// Chaque message remplace le précédent (seule la dernière action est annulable) et dure 5 s.
nouveauToast(t) {
var self = this;
