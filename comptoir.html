<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Le comptoir · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="The counter · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EA}
a{color:#8A4F1C}a:hover{color:#5E3412}
a:focus-visible{outline:3px solid #B5651D;outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:14px}
.btn-plein{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:#F2C77A;color:#2E1D12;font-weight:700;text-decoration:none}
.btn-plein:hover{background:#FFDDA0;color:#2E1D12}
.btn-ligne{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #8A4F1C;color:#8A4F1C;font-weight:700;font-size:14px;text-decoration:none}
.btn-ligne:hover{background:#8A4F1C;color:#FFFDF8}
</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:1100px){.kpis{grid-template-columns:repeat(3, minmax(0, 1fr))}}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}.kpis{grid-template-columns:repeat(2, minmax(0, 1fr))}.bars{gap:6px!important}}</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script>
</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:#FBF5EA;color:#2E1D12;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="comptoir" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:#F3E6CF;border-right:1px solid #E7D6B8;padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:26px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A5B23">{{eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{title}}</h1>
<p style="margin:0;color:#6B5443;font-size:16px">{{t.subtitle}}</p>
</div>
<span style="{{sampleStyle}}">{{t.sample}}</span>
</header>
<div role="status" style="{{waitStyle}}">
<span style="font-weight:700">{{waitText}}</span>
<a href="/fournil" class="btn-ligne">{{t.waitCta}}</a>
</div>
<section aria-label="{{t.kpiLabel}}" aria-busy="{{busy}}" style="display:flex;flex-direction:column;gap:12px">
<p style="margin:0;font-size:14px;color:#6B5443"><strong style="color:#2E1D12">{{t.kpiTitle}}</strong></p>
<div class="kpis">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="{{k.box}}">
<span style="{{k.labelStyle}}">{{k.label}}</span>
<span style="font-family:Fraunces, Georgia, serif;font-size:32px;font-weight:800;line-height:1.1">{{k.value}}</span>
<span style="{{k.subStyle}}">{{k.sub}}</span>
</div>
</sc-for>
</div>
</section>
<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
<section aria-labelledby="vis-t" style="flex:999 1 520px;min-width:0;background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
<h2 id="vis-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.visTitle}}</h2>
<span style="font-size:13px;color:#6B5443">{{t.visSub}}</span>
</div>
<div style="{{barsStyle}}">
<div class="bars" style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:14px;align-items:end;height:220px;border-bottom:2px solid #E7D6B8;padding-bottom:4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<div role="img" aria-label="{{b.aria}}" style="display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%">
<span style="font-size:12px;font-weight:700" aria-hidden="true">{{b.value}}</span>
<div style="{{b.barStyle}}" aria-hidden="true"></div>
</div>
</sc-for>
</div>
<div class="bars" aria-hidden="true" style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:14px;font-size:12px;color:#4A3324;text-align:center">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<span style="min-width:0;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto"><span style="{{b.dotStyle}}">●</span> {{b.label}}</span>
</sc-for>
</div>
<p style="margin:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#6B5443">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
<span><span style="{{l.dotStyle}}" aria-hidden="true">●</span> {{l.label}}</span>
</sc-for>
</p>
</div>
<p style="{{noBarsStyle}}">{{noBars}}</p>
<p style="margin:0;padding:12px 16px;border-radius:12px;background:#F6E7CC;color:#5E3412;font-size:14px">{{insight}}</p>
</section>
<div style="flex:1 1 330px;min-width:0;display:flex;flex-direction:column;gap:16px">
<section aria-labelledby="next-t" style="background:#2E1D12;color:#FBF5EA;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:10px">
<h2 id="next-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:20px">{{t.nextTitle}}</h2>
<div style="{{nextStyle}}">
<span style="{{next.chip}}">{{next.state}}</span>
<p style="margin:0;font-weight:700;font-size:17px;line-height:1.35">{{next.titre}}</p>
<p style="margin:0;font-size:13.5px;color:#E9D8BA">{{next.pourToi}}</p>
<a href="{{next.href}}" class="btn-plein" style="align-self:flex-start">{{t.nextCta}}</a>
</div>
<div style="{{nextEmptyStyle}}">
<p style="margin:0;font-size:14px;color:#E9D8BA">{{nextEmpty}}</p>
<a href="/fournee" class="btn-plein" style="{{nextEmptyCtaStyle}}">{{t.nextEmptyCta}}</a>
</div>
</section>
<section aria-labelledby="gain-t" style="background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:12px">
<h2 id="gain-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:20px">{{t.gainTitle}}</h2>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:#6B5443">{{t.gainContacts}}</span><strong>{{gainContacts}}</strong></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:#6B5443">{{t.gainPosts}}</span><strong>{{gainPosts}}</strong></div>
<span style="font-size:12px;color:#6B5443">{{t.gainSince}}</span>
</section>
</div>
</div>
<section aria-labelledby="pantry-t" style="background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;padding-bottom:8px">
<h2 id="pantry-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.pantryTitle}}</h2>
<a href="/garde-manger" style="font-weight:700;font-size:14px;display:inline-flex;align-items:center;min-height:44px">{{t.pantryAll}}</a>
</div>
<sc-for list="{{pantry}}" as="p" hint-placeholder-count="3">
<div style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 0;border-top:1px solid #F0E3CC">
<div style="flex:999 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:700;overflow-wrap:anywhere">{{p.titre}}</span><span style="font-size:12px;color:#6B5443">{{p.meta}}</span></div>
<span style="{{p.chip}}">{{p.state}}</span>
<a href="{{p.href}}" class="btn-ligne" aria-label="{{p.kneadLabel}}">{{t.knead}}</a>
</div>
</sc-for>
<div style="{{pantryEmptyStyle}}">
<p style="margin:0;color:#6B5443">{{t.pantryEmpty}}</p>
<a href="/fournee" class="btn-ligne">{{t.pantryEmptyCta}}</a>
</div>
</section>
</main>
</div>
</script>
<script src="/dc.js"></script><script src="/api.js"></script><script src="/bento.js"></script><script src="/garde-manger.js"></script><script src="/comptoir.js"></script><script>
var HIDE = 'display: none';
var PUCE = 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; align-self: flex-start; ';
var CHIP = {
vert: PUCE + 'background: #DCEBD6; color: #2F5E36', orange: PUCE + 'background: #FBE3C2; color: #8A4B00', rouge: PUCE + 'background: #F5DAD3; color: #8E2A1C',
chaud: PUCE + 'background: #DCEBD6; color: #2F5E36', enfourner: PUCE + 'background: #FBE3C2; color: #8A4B00', rassis: PUCE + 'background: #F5DAD3; color: #8E2A1C'
};
var DOT = { vert: 'color: #3F8A4A', orange: 'color: #B36B00', rouge: 'color: #C0392B' };
var BAR = { vert: '#B5651D', orange: '#E3B678', rouge: '#EAD7B4' };
var SENS = { hausse: '#2F5E36', baisse: '#8E2A1C', stable: '#6B5443', nouveau: '#2F5E36' };
var T = {
fr: {
navLabel: 'Navigation principale',
eyebrowTail: 'tes 30 derniers jours',
title: 'Bonjour {prenom}, voici ce que tes fournées t’ont rapporté', titleAnon: 'Bonjour, voici ce que tes fournées t’ont rapporté',
subtitle: 'Chaque matin, on enfourne les nouveautés IA. Toi, tu choisis ce que tu sers à ton audience.',
sample: 'Inclut des données d’exemple',
waitOne: '1 post attend ses chiffres', waitMany: '{n} posts attendent leurs chiffres', waitCta: 'Reporter mes chiffres',
kpiLabel: 'Chiffres clés', kpiTitle: 'Tes posts, 30 derniers jours',
kpis: ['Posts publiés', 'Impressions', 'Réactions', 'Republications', 'Prises de contact'],
ecart: { hausseN: '+{n} vs mois dernier', baisseN: '-{n} vs mois dernier', hausseP: '+{n} %', baisseP: '-{n} %', stable: 'stable', nouveau: 'nouveau' },
visTitle: 'Ce qui est le mieux sorti du four', visSub: 'impressions de tes 6 derniers posts',
bar: '{label} : {n} impressions, sujet {etat}',
etats: { vert: 'Tout chaud', orange: 'À pétrir', rouge: 'Rassis' },
noBars: 'Pas encore de chiffres : publie un post depuis le fournil puis reporte ses chiffres.',
insight: 'Tes posts sur des sujets tout chauds font en moyenne {r} fois plus d’impressions que les autres : sers-les vite.',
insightNeutral: 'Publie et reporte tes chiffres pour voir ce qui marche le mieux.',
nextTitle: 'Tout juste sorti du four', nextCta: 'Pétrir le post',
nextLoading: 'La fournée chauffe…', loading: 'Mise au four…', nextEmpty: 'Rien de nouveau au four pour l’instant.', nextEmptyCta: 'Voir la fournée du jour',
gainTitle: 'Ce que ta veille a rapporté', gainContacts: 'Prises de contact', gainPosts: 'Posts publiés grâce à la fournée', gainSince: 'Depuis le début',
pantryTitle: 'Mis de côté au garde-manger', pantryAll: 'Tout le garde-manger →', knead: 'Pétrir', kneadLabel: 'Pétrir « {titre} »',
fraicheur: { chaud: 'Encore chaud', enfourner: 'À enfourner avant demain', rassis: 'Rassis' },
pantryEmpty: 'Rien de côté pour l’instant.', pantryEmptyCta: 'Aller à la fournée du jour'
},
en: {
navLabel: 'Main navigation',
eyebrowTail: 'your last 30 days',
title: 'Hi {prenom}, here’s what your batches brought in', titleAnon: 'Hi, here’s what your batches brought in',
subtitle: 'Every morning we bake the latest AI news. You pick what to serve your audience.',
sample: 'Includes sample data',
waitOne: '1 post is waiting for its figures', waitMany: '{n} posts are waiting for their figures', waitCta: 'Report my figures',
kpiLabel: 'Key figures', kpiTitle: 'Your posts, last 30 days',
kpis: ['Posts published', 'Impressions', 'Reactions', 'Reposts', 'Contact requests'],
ecart: { hausseN: '+{n} vs last month', baisseN: '-{n} vs last month', hausseP: '+{n}%', baisseP: '-{n}%', stable: 'steady', nouveau: 'new' },
visTitle: 'What came out of the oven best', visSub: 'impressions of your last 6 posts',
bar: '{label}: {n} impressions, topic {etat}',
etats: { vert: 'Piping hot', orange: 'Needs kneading', rouge: 'Gone stale' },
noBars: 'No figures yet: publish a post from the kitchen, then report its figures.',
insight: 'Your posts on piping hot topics get {r} times the impressions of the others on average: serve them fast.',
insightNeutral: 'Publish and report your figures to see what works best.',
nextTitle: 'Fresh out of the oven', nextCta: 'Knead the post',
nextLoading: 'The batch is baking…', loading: 'In the oven…', nextEmpty: 'Nothing new in the oven right now.', nextEmptyCta: 'See today’s batch',
gainTitle: 'What your watch brought in', gainContacts: 'Contact requests', gainPosts: 'Posts published thanks to the batch', gainSince: 'Since the start',
pantryTitle: 'Set aside in the pantry', pantryAll: 'The whole pantry →', knead: 'Knead', kneadLabel: 'Knead “{titre}”',
fraicheur: { chaud: 'Still warm', enfourner: 'Bake before tomorrow', rassis: 'Gone stale' },
pantryEmpty: 'Nothing set aside yet.', pantryEmptyCta: 'Go to today’s batch'
}
};
var STOCKAGE_VIDE = { getItem: function () { return null; }, setItem: function () { throw new Error('stockage indisponible'); } };
function stockage() { try { return window.localStorage || STOCKAGE_VIDE; } catch (e) { return STOCKAGE_VIDE; } }
function remplir(s, v) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { return v[k] === undefined ? m : v[k]; }); }
function texteEcart(e, mode, t) {
if (e.sens === 'stable' || e.sens === 'nouveau') return t.ecart[e.sens];
return remplir(t.ecart[e.sens + (mode === 'nombre' ? 'N' : 'P')], { n: e.valeur });
}
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { lang: 'fr', data: null, fourneeFinie: false, exemples: [], store: Store.charger(stockage()) };
var self = this;
Promise.all([
Api.chargerFournee().catch(function () { return null; }),
Api.chargerPosts().catch(function () { return []; })
]).then(function (res) { self.setState({ data: res[0], exemples: res[1], fourneeFinie: true }); self.relancer(); });
// Retour depuis le fournil par « précédent » : la page peut venir du cache, on relit le store.
window.addEventListener('pageshow', function (e) { if (e.persisted) self.setState({ store: Store.charger(stockage()) }); });
}
// Juste après l'inscription, la fournée répond « attente » : on réinterroge toutes les 2 s (comme /fournee).
relancer() {
var self = this;
if (!this.state.data || this.state.data.etat !== 'attente') return;
setTimeout(function () {
Api.chargerFournee().catch(function () { return null; }).then(function (d) { self.setState({ data: d }); self.relancer(); });
}, 2000);
}
renderVals() {
var st = this.state || {};
var charge = !!st.fourneeFinie;
var lang = st.lang || 'fr';
var t = T[lang];
var locale = lang === 'fr' ? 'fr-FR' : 'en-GB';
var num = function (n) { return new Intl.NumberFormat(locale).format(n); };
var maintenant = new Date().toISOString();
var store = st.store || Store.etatInitial();
var data = st.data;
var articles = data && data.etat === 'pret' ? data.articles : [];
var exemples = Comptoir.depuisExemples(st.exemples || [], maintenant);
var posts = Comptoir.fusionner(exemples, Comptoir.depuisPublies(store.publies, articles, store.sauves));
var k = Comptoir.kpis(posts, maintenant);
var barres = Comptoir.graphique(posts);
var ratio = Comptoir.analyse(posts).ratio;
var attente = Comptoir.sansChiffres(posts);
var bilan = Comptoir.bilan(posts);
var u = null;
try { u = Auth.utilisateurCourant(); } catch (e) {}
var jour = new Intl.DateTimeFormat(locale, { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
var champs = ['posts', 'impressions', 'reactions', 'republications', 'contacts'];
var news = Bento.pickTopics(articles, 1, Store.refsIgnorees(store, Store.dateDuJour(new Date())))[0];
var sauves = GardeManger.trier(store.sauves).slice(0, 3);
return {
t: t,
eyebrow: jour.charAt(0).toUpperCase() + jour.slice(1) + ' · ' + t.eyebrowTail,
title: u && u.prenom ? t.title.replace('{prenom}', u.prenom) : t.titleAnon,
sampleStyle: exemples.length ? 'font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #FFFDF8; border: 1px dashed #D9C29C; color: #6B5443' : HIDE,
waitStyle: attente ? 'display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 18px; border-radius: 14px; background: #FBE3C2; color: #5E3412; border: 1px solid #E9C48E' : HIDE,
waitText: attente === 1 ? t.waitOne : remplir(t.waitMany, { n: attente }),
kpis: champs.map(function (c, i) {
var last = i === champs.length - 1;
var e = k.ecarts[c];
return {
label: t.kpis[i], value: charge ? num(k.actuel[c]) : '…', sub: charge ? texteEcart(e, i === 0 ? 'nombre' : 'pourcent', t) : '',
box: last ? 'background: #8A4F1C; color: #FFFDF8; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0' : 'background: #FFFDF8; border: 1px solid #E7D6B8; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0',
labelStyle: last ? 'font-size: 13px; color: #F6E7CC' : 'font-size: 13px; color: #6B5443',
subStyle: last ? 'font-size: 12px; color: #F6E7CC' : 'font-size: 12px; color: ' + SENS[e.sens]
};
}),
barsStyle: charge && barres.length ? 'display: flex; flex-direction: column; gap: 12px' : HIDE,
noBarsStyle: charge && barres.length ? HIDE : 'margin: 0; color: #6B5443',
noBars: charge ? t.noBars : t.loading,
busy: String(!charge),
bars: barres.map(function (b) {
return {
value: num(b.impressions), label: b.label, dotStyle: DOT[b.feu],
aria: remplir(t.bar, { label: b.label, n: num(b.impressions), etat: t.etats[b.feu] }),
barStyle: 'width: 100%; height: ' + b.hauteur + '%; background: ' + BAR[b.feu] + '; border-radius: 14px 14px 4px 4px'
};
}),
legend: ['vert', 'orange', 'rouge'].map(function (f) { return { label: t.etats[f], dotStyle: DOT[f] }; }),
insight: !charge ? t.loading : ratio === null ? t.insightNeutral : remplir(t.insight, { r: new Intl.NumberFormat(locale, { maximumFractionDigits: 1 }).format(ratio) }),
nextStyle: news ? 'display: flex; flex-direction: column; gap: 10px' : HIDE,
nextEmptyStyle: news ? HIDE : 'display: flex; flex-direction: column; gap: 10px',
nextEmpty: charge && !(data && data.etat === 'attente') ? t.nextEmpty : t.nextLoading,
nextEmptyCtaStyle: charge && !(data && data.etat === 'attente') ? 'align-self: flex-start' : HIDE,
next: news ? { chip: CHIP[news.feu], state: t.etats[news.feu], titre: news.titre, pourToi: news.pourToi || '', href: Bento.lienFournil(news.ref) } : { chip: HIDE, state: '', titre: '', pourToi: '', href: '/fournee' },
gainContacts: num(bilan.contacts),
gainPosts: num(bilan.posts),
pantry: sauves.map(function (a) {
var f = GardeManger.fraicheur(a, maintenant);
var age = GardeManger.libelleAnciennete(GardeManger.joursDepuis(a.savedAt, maintenant), lang);
return {
titre: a.titre, meta: [a.source, age].filter(Boolean).join(' · '), chip: CHIP[f], state: t.fraicheur[f],
href: Bento.lienFournil(a.ref), kneadLabel: remplir(t.kneadLabel, { titre: a.titre })
};
}),
pantryEmptyStyle: sauves.length ? HIDE : 'display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 4px'
};
}
}
</script><script src="/nav.js"></script><script src="/boot.js"></script></body></html>
