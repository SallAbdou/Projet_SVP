<title>Le comptoir · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="The counter · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">

<style>
body{margin:0;background:var(--fond-page)}
a{color:var(--brun)}a:hover{color:var(--brun-fonce)}
a:focus-visible{outline:3px solid var(--braise);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:14px}
.btn-plein{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--croute);color:var(--sur-clair);font-weight:700;text-decoration:none}
.btn-plein:hover{background:var(--or-milieu);color:var(--sur-clair)}
.btn-ligne{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--braise);color:var(--braise);font-weight:700;font-size:14px;text-decoration:none}
.btn-ligne:hover{background:var(--braise);color:var(--sur-plein)}
/* Four illustré : un seul lien vers la news n°1 de la fournée. */
.four-lien{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px 14px;border-radius:16px;color:var(--texte);text-decoration:none;text-align:center;transition:background .2s,transform .2s}
.four-lien:hover{background:var(--miel);color:var(--texte);transform:translateY(-2px)}
.four-lien:hover .four-cta{text-decoration:underline}
.four-svg{display:block;width:100%;max-width:220px;height:auto}
.four-titre{font-weight:700;font-size:16.5px;line-height:1.35;overflow-wrap:anywhere}
.four-cta{font-weight:700;font-size:14px;color:var(--braise)}
.four-vapeur{fill:none;stroke:var(--bord-fort);stroke-width:4;stroke-linecap:round;opacity:0;animation:pq-four-vapeur 3s ease-out infinite}
.four-lueur{animation:pq-four-lueur 2.4s ease-in-out infinite alternate}
@keyframes pq-four-vapeur{0%{opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
@keyframes pq-four-lueur{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){html:not([data-animations="on"]) .four-vapeur{animation:none;opacity:.8}html:not([data-animations="on"]) .four-lueur{animation:none}html:not([data-animations="on"]) .four-lien,html:not([data-animations="on"]) .four-lien:hover{transition:none;transform:none}}
html[data-animations="off"] .four-vapeur{opacity:.8}
html[data-animations="off"] .four-lien,html[data-animations="off"] .four-lien:hover{transition:none;transform:none}
</style>
<style>*{box-sizing:border-box}html{overflow-x:hidden}body{overflow-x:clip}@media (max-width:1100px){.kpis{grid-template-columns:repeat(3, minmax(0, 1fr))}}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}.kpis{grid-template-columns:repeat(2, minmax(0, 1fr))}.bars{gap:6px!important}}</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script><script src="/theme.js"></script><script src="/animations.js"></script>
</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:var(--fond);color:var(--texte);font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">

<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">

<p style="margin:0;color:var(--doux);font-size:16px"><span style="display:block">{{t.subtitle1}}</span><span style="display:block">{{t.subtitle2}}</span></p>
<p role="status" style="{{exempleStyle}}">{{t.exemple}}</p>
</div>
<span style="{{sampleStyle}}">{{t.sample}}</span>
</header>
<div role="status" style="{{waitStyle}}">

<div class="kpis">

</section>
<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">

<span style="font-size:13px;color:var(--doux)">{{t.visSub}}</span>
</div>
<div style="{{barsStyle}}">
<div class="bars" style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:14px;align-items:end;height:220px;border-bottom:2px solid var(--bord);padding-bottom:4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<div role="img" aria-label="{{b.aria}}" style="display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%">

<div style="{{b.barStyle}}" aria-hidden="true"></div>

</div>

<rect x="44" y="86" width="112" height="46" rx="8" fill="none" stroke="var(--bord-fort)" stroke-width="2"></rect>

<a href="/fournee#n1" class="four-lien" aria-label="{{fourLabel}}" style="{{nextStyle}}">

<span class="four-cta">{{t.fourCta}}</span>
</a>
<div role="status" style="{{fourAttenteStyle}}">
<svg class="four-svg" viewBox="0 0 200 170" aria-hidden="true" focusable="false"><use href="#pq-four"></use></svg>
<p style="margin:0;font-size:14px;color:var(--doux)">{{t.nextLoading}}</p>
</div>
<div style="{{nextEmptyStyle}}">
<p style="margin:0;font-size:14px;color:var(--doux)">{{t.nextEmpty}}</p>
<a href="/fournee" class="btn-plein" style="align-self:flex-start">{{t.nextEmptyCta}}</a>
</div>
</section>
<section aria-labelledby="gain-t" style="background:var(--creme);border:1px solid var(--bord);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:12px">

<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:var(--doux)">{{t.gainContacts}}</span><strong>{{gainContacts}}</strong></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:var(--doux)">{{t.gainPosts}}</span><strong>{{gainPosts}}</strong></div>

</div>
</div>
<section aria-labelledby="pantry-t" style="background:var(--creme);border:1px solid var(--bord);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;padding-bottom:8px">
<h2 id="pantry-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.pantryTitle}}</h2>
<a href="/garde-manger" style="font-weight:700;font-size:14px;display:inline-flex;align-items:center;min-height:44px">{{t.pantryAll}}</a>
</div>
<sc-for list="{{pantry}}" as="p" hint-placeholder-count="3">
<div style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 0;border-top:1px solid var(--trait)">
<div style="flex:999 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:700;overflow-wrap:anywhere">{{p.titre}}</span><span style="font-size:12px;color:var(--doux)">{{p.meta}}</span></div>
<span class="{{p.chip}}">{{p.state}}</span>
<a href="{{p.href}}" class="btn-petrir" aria-label="{{p.kneadLabel}}"><svg class="pain-ico" viewBox="0 0 24 16" aria-hidden="true" focusable="false"><path d="M1.5 11.2C1.5 6.4 6.2 3 12 3s10.5 3.4 10.5 8.2c0 1.6-1.2 2.8-2.8 2.8H4.3c-1.6 0-2.8-1.2-2.8-2.8z" fill="var(--petrir-pain)" stroke="currentColor" stroke-width="1.3"></path><path d="M6.8 7.4l2.2 2.6M10.9 6.4l2.2 2.6M15 7.4l2.2 2.6" stroke="var(--petrir-grigne)" stroke-width="1.6" stroke-linecap="round" fill="none"></path></svg>{{t.knead}}</a>

</sc-for>
<div style="{{pantryEmptyStyle}}">
<p style="margin:0;color:var(--doux)">{{t.pantryEmpty}}</p>

</section>
</main>
</div>
</script>

titleL1: u && u.prenom ? t.title.replace('{prenom}', u.prenom) : t.titleAnon,
sampleStyle: exemples.length ? 'font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--creme); border: 1px dashed var(--bord-fort); color: var(--doux)' : HIDE,
waitStyle: attente ? 'display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 18px; border-radius: 14px; background: var(--miel); color: var(--brun-fonce); border: 1px solid var(--bord-fort)' : HIDE,
waitText: attente === 1 ? t.waitOne : remplir(t.waitMany, { n: attente }),
kpis: champs.map(function (c, i) {
var last = i === champs.length - 1;
var e = k.ecarts[c];
return {
label: t.kpis[i], value: charge ? num(k.actuel[c]) : '…', sub: charge ? texteEcart(e, i === 0 ? 'nombre' : 'pourcent', t) : '',
box: last ? 'background: var(--braise); color: var(--sur-plein); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0' : 'background: var(--creme); border: 1px solid var(--bord); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0',
labelStyle: last ? 'font-size: 13px; color: var(--sur-plein)' : 'font-size: 13px; color: var(--doux)',
subStyle: last ? 'font-size: 12px; color: var(--sur-plein)' : 'font-size: 12px; color: ' + SENS[e.sens]
};
}),
barsStyle: charge && barres.length ? 'display: flex; flex-direction: column; gap: 12px' : HIDE,
noBarsStyle: charge && barres.length ? HIDE : 'margin: 0; color: var(--doux)',
noBars: charge ? t.noBars : t.loading,
busy: String(!charge),
bars: barres.map(function (b) {
return {
value: num(b.impressions), label: b.label, etat: t.etats[b.feu],
aria: remplir(t.bar, { label: b.label, n: num(b.impressions), etat: t.etats[b.feu] }),
barStyle: 'width: 100%; height: ' + b.hauteur + '%; background: ' + Charte.barre(b.feu) + '; box-shadow: ' + (Charte.contourBarre(b.feu) || 'none') + '; border-radius: 14px 14px 4px 4px'
};
}),
ins: !charge ? { avant: t.loading, gras: '', apres: '' } : Comptoir.phraseAnalyse(chaudGagne, lang) || { avant: t.insightNeutral, gras: '', apres: '' },
insStyle: charge && chaudGagne ? 'font-size:16px;font-weight:700' : 'font-size:14px',
// Four : lien vers la news n°1 quand la fournée est prête, four qui chauffe sans lien pendant l'attente.
nextStyle: news ? '' : HIDE,
fourAttenteStyle: !news && chauffe ? 'display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center' : HIDE,
nextEmptyStyle: !news && !chauffe ? 'display: flex; flex-direction: column; gap: 10px' : HIDE,
next: { titre: news ? news.titre : '' },
fourLabel: news ? remplir(t.fourLabel, { titre: news.titre }) : '',
gainContacts: num(bilan.contacts),
gainPosts: num(bilan.posts),
pantry: sauves.map(function (a) {
var f = GardeManger.fraicheur(a, maintenant);
var age = GardeManger.libelleAnciennete(GardeManger.joursDepuis(a.savedAt, maintenant), lang);
return {
titre: a.titre, meta: [a.source, age].filter(Boolean).join(' · '), chip: CHIP(f), state: t.fraicheur[f],
href: Bento.lienFournil(a.ref), kneadLabel: remplir(t.kneadLabel, { titre: a.titre })
};
}),
pantryEmptyStyle: sauves.length ? HIDE : 'display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 4px'
};
}
}
