<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Attendez, on cook · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="Hold on, we’re cooking · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800;9..144,900&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<link rel="stylesheet" href="/parcours.css">
<style>
body{margin:0;background:var(--fond)}
a{color:var(--brun)}a:hover{color:var(--brun-fonce)}
@keyframes vapeur{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-22px);opacity:0}}
@keyframes lueur{0%,100%{opacity:.55}50%{opacity:1}}
.vapeur{animation:vapeur 2.6s ease-in-out infinite}
.vapeur.v2{animation-delay:.8s}.vapeur.v3{animation-delay:1.6s}
.lueur{animation:lueur 2.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){html:not([data-animations="on"]) .vapeur,html:not([data-animations="on"]) .lueur{animation:none;opacity:.8}}
html[data-animations="off"] .vapeur,html[data-animations="off"] .lueur{opacity:.8}
</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="min-height:100vh;box-sizing:border-box;background:var(--fond-page);color:var(--texte);font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column;padding:24px 40px 40px">
<header class="entete" data-entete style="padding-left:0;padding-right:0"></header>
<main id="contenu" tabindex="-1" style="flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px 72px;padding:32px 0">
<svg width="340" height="340" viewBox="0 0 340 340" role="img" aria-label="{{t.ovenAlt}}" style="max-width:100%;height:auto;flex:0 1 340px">
<g fill="none" stroke="var(--bord-fort)" stroke-width="5" stroke-linecap="round">
<path class="vapeur" d="M130 64c-10-12 10-20 0-34"></path>
<path class="vapeur v2" d="M170 60c-10-12 10-20 0-34"></path>
<path class="vapeur v3" d="M210 64c-10-12 10-20 0-34"></path>
</g>
<rect x="40" y="86" width="260" height="214" rx="26" fill="var(--brun)"></rect>
<rect x="40" y="86" width="260" height="44" rx="22" fill="var(--brun-fonce)"></rect>
<rect x="40" y="108" width="260" height="22" fill="var(--brun-fonce)"></rect>
<circle cx="78" cy="108" r="9" fill="var(--panneau-or)"></circle>
<circle cx="108" cy="108" r="9" fill="var(--or-haut)"></circle>
<rect x="196" y="100" width="76" height="16" rx="8" fill="var(--panneau)"></rect>
<rect x="196" y="100" width="66" height="16" rx="8" fill="var(--panneau-or)"></rect>
<rect x="66" y="150" width="208" height="124" rx="18" fill="var(--panneau)"></rect>
<rect class="lueur" x="76" y="160" width="188" height="104" rx="12" fill="var(--braise-vive)"></rect>
<g>
<path d="M108 238c0-30 28-50 62-50s62 20 62 50c0 8-6 12-14 12H122c-8 0-14-4-14-12z" fill="var(--pain-haut)"></path>
<path d="M108 238c0-30 28-50 62-50s62 20 62 50c0 8-6 12-14 12H122c-8 0-14-4-14-12z" fill="none" stroke="var(--pain-bas)" stroke-width="3"></path>
<path d="M140 206l10 16M166 200l10 16M192 206l10 16" stroke="var(--pain-bas)" stroke-width="5" stroke-linecap="round"></path>
</g>
<rect x="96" y="276" width="148" height="10" rx="5" fill="var(--brun-fonce)"></rect>
<rect x="62" y="300" width="28" height="18" rx="6" fill="var(--brun-fonce)"></rect>
<rect x="250" y="300" width="28" height="18" rx="6" fill="var(--brun-fonce)"></rect>
</svg>
<div style="flex:0 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px">
<p style="margin:0;font-family:Fraunces, Georgia, serif;font-size:120px;line-height:0.9;font-weight:900;color:var(--brun);letter-spacing:-0.03em">404</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:46px;line-height:1.05;font-weight:800;text-wrap:balance">{{t.title}}</h1>
<p style="margin:0;font-size:17px;color:var(--doux);max-width:46ch">{{t.text}}</p>
<div style="display:flex;flex-direction:column;gap:8px;max-width:420px">
<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--texte-2)"><span>{{t.cook}}</span><span>87 %</span></div>
<div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="87" aria-label="{{t.cook}}" style="height:14px;border-radius:999px;background:var(--sable);overflow:hidden">
<div style="width:87%;height:100%;border-radius:999px;background:linear-gradient(90deg, var(--pain-haut), var(--braise-vive) 70%, var(--braise))"></div>
</div>
<span style="font-size:13px;color:var(--doux)">{{t.hint}}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
<a href="/" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--braise);color:var(--sur-plein);font-weight:700;text-decoration:none">{{t.back}}</a>
<a href="/fournee" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--bord-fort);background:var(--creme);color:var(--texte);font-weight:700;text-decoration:none">{{t.batch}}</a>
</div>
</div>
</main>
<footer style="text-align:center;font-size:13px;color:var(--doux)">{{t.footer}}</footer>
</div>
</script>
<script src="/dc.js"></script><script>
var T = {
fr: {
langLabel: 'Langue', ovenAlt: 'Un four à pain avec une miche en train de cuire',
title: 'Attendez, on cook.',
text: 'Cette page est encore au four. Le boulanger la sort dès qu’elle est bien dorée. En attendant, ta fournée du jour est prête.',
cook: 'Cuisson', hint: 'Encore quelques minutes. Pas la peine d’ouvrir la porte du four.',
back: 'Retour à l’accueil', batch: 'Voir la fournée du jour',
footer: 'Erreur 404 · page introuvable'
},
en: {
langLabel: 'Language', ovenAlt: 'A bread oven with a loaf baking inside',
title: 'Hold on, we’re cooking.',
text: 'This page is still in the oven. The baker will take it out once it’s golden. In the meantime, today’s batch is ready.',
cook: 'Baking', hint: 'A few more minutes. No need to open the oven door.',
back: 'Back to home', batch: 'See today’s batch',
footer: 'Error 404 · page not found'
}
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr' }; }
renderVals() {
var lang = (this.state && this.state.lang) || 'fr';
var on = 'min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--braise); color: var(--sur-plein); font: inherit; font-weight: 700; cursor: pointer';
var off = 'min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--brun-fonce); font: inherit; font-weight: 600; cursor: pointer';
var self = this;
return {
t: T[lang],
setFr: function () { self.setState({ lang: 'fr' }); },
setEn: function () { self.setState({ lang: 'en' }); },
frPressed: String(lang === 'fr'), enPressed: String(lang === 'en'),
frStyle: lang === 'fr' ? on : off, enStyle: lang === 'en' ? on : off
};
}
}
</script><script src="/store.js"></script><script src="/demo.js"></script><script src="/parcours.js"></script><script src="/animations.js"></script><script src="/boot.js"></script></body></html>
