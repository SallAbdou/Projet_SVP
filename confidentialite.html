<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Confidentialité · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="Privacy · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<link rel="stylesheet" href="/parcours.css">
<style>.texte h2{font-size:22px;margin-top:6px}.texte ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}</style>
</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a><div id="root"></div>
<script type="text/plain" id="tpl">
<div class="parcours">
<header class="entete" data-entete></header>
<main id="contenu" tabindex="-1" class="contenu centre">
<article class="carte carte-large texte" aria-labelledby="titre">
<p class="sur-titre">{{t.eyebrow}}</p>
<h1 id="titre" class="titre">{{t.titre}}</h1>
<p class="chapo">{{t.chapo}}</p>
<h2>{{t.quoiT}}</h2>
<ul><sc-for list="{{quoi}}" as="q"><li>{{q.texte}}</li></sc-for></ul>
<h2>{{t.pourquoiT}}</h2><p>{{t.pourquoi}}</p>
<h2>{{t.ouT}}</h2><p>{{t.ou}}</p>
<h2>{{t.dureeT}}</h2><p>{{t.duree}}</p>
<h2>{{t.effacerT}}</h2><p>{{t.effacer}}</p>
<div class="actions" style="{{demandeStyle}}"><button type="button" class="bouton" onClick="{{demander}}" data-focus="effacer">{{t.effacerBouton}}</button></div>
<div class="alerte" style="{{confirmeStyle}}"><p id="confirme-t" style="margin:0 0 12px">{{t.confirmer}}</p>
<div class="actions"><button type="button" class="bouton" onClick="{{effacer}}" data-focus="effacer-oui" aria-describedby="confirme-t">{{t.confirmerOui}}</button><button type="button" class="bouton-secondaire" onClick="{{annuler}}" data-focus="effacer-annuler">{{t.confirmerNon}}</button></div></div>
<p class="mention-demo">{{t.lancement}}</p>
<div class="liens-bas"><a href="/">{{t.accueil}}</a><a href="/questionnaire">{{t.questionnaire}}</a></div>
</article>
</main>
<footer class="pied" data-pied></footer>
</div>
</script>
<script src="/dc.js"></script><script>
var T = {
fr: {
eyebrow: 'Tes données', titre: 'Confidentialité', chapo: 'Ce qu’on garde sur toi, pourquoi, et comment l’effacer. En version courte.',
quoiT: 'Quelles données', quoi: ['Ton prénom et ton e-mail.', 'Tes réponses au questionnaire : métier, thématiques, relation avec l’IA, langue.', 'Les articles que tu mets de côté, tes brouillons et tes posts publiés.', 'Les retours que tu écris pour affiner ta fournée.'],
pourquoiT: 'Pourquoi', pourquoi: 'Uniquement pour choisir tes articles chaque matin (en tenant compte de tes retours) et suivre ceux que tu gardes ou publies. Rien n’est revendu.',
ouT: 'Où', ou: 'Pour cette démo : uniquement dans ce navigateur, sur cet appareil. Rien n’est envoyé à un serveur, aucun mot de passe n’est enregistré.',
dureeT: 'Combien de temps', duree: 'Tant que tu ne les effaces pas, ou que tu ne vides pas les données de ce site dans ton navigateur.',
effacerT: 'Les effacer', effacer: 'Tout est supprimé de ce navigateur et tu reviens à l’accueil. On te demande de confirmer avant.',
effacerBouton: 'Effacer mes données',
confirmer: 'Tout sera supprimé de ce navigateur : profil, articles mis de côté, brouillons et retours. C’est définitif.',
confirmerOui: 'Oui, tout effacer', confirmerNon: 'Annuler',
lancement: 'Au lancement réel, cette page sera complétée : hébergeur, sous-traitants, durée de conservation exacte et contact pour exercer tes droits.',
accueil: '← Accueil', questionnaire: 'Retour au questionnaire'
},
en: {
eyebrow: 'Your data', titre: 'Privacy', chapo: 'What we keep about you, why, and how to erase it. The short version.',
quoiT: 'Which data', quoi: ['Your first name and email.', 'Your questionnaire answers: job, topics, relationship with AI, language.', 'The articles you save, your drafts and your published posts.', 'The feedback you write to fine-tune your batch.'],
pourquoiT: 'Why', pourquoi: 'Only to pick your articles every morning (taking your feedback into account) and to keep track of those you save or publish. Nothing is sold.',
ouT: 'Where', ou: 'For this demo: only in this browser, on this device. Nothing is sent to a server, no password is stored.',
dureeT: 'How long', duree: 'Until you erase it, or clear this site’s data in your browser.',
effacerT: 'Erase it', effacer: 'Everything is removed from this browser and you go back to the home page. We ask you to confirm first.',
effacerBouton: 'Erase my data',
confirmer: 'Everything will be removed from this browser: profile, saved articles, drafts and feedback. This cannot be undone.',
confirmerOui: 'Yes, erase everything', confirmerNon: 'Cancel',
lancement: 'At the real launch, this page will be completed: host, processors, exact retention period and a contact to exercise your rights.',
accueil: '← Home', questionnaire: 'Back to the questionnaire'
}
};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr', confirmer: false }; }
// Lot 24 (3.3.4) : après « Effacer », le focus va sur la confirmation ; après « Annuler », il revient.
afterRender(root) {
if (!this.focusApres) return;
var el = root.querySelector('[data-focus="' + this.focusApres + '"]');
this.focusApres = null;
if (el) el.focus();
}
renderVals() {
var self = this;
var t = T[(this.state && this.state.lang) || 'fr'];
return {
t: t,
quoi: t.quoi.map(function (x) { return { texte: x }; }),
demandeStyle: self.state.confirmer ? 'display: none' : '',
confirmeStyle: self.state.confirmer ? '' : 'display: none',
demander: function () { self.focusApres = 'effacer-oui'; self.setState({ confirmer: true }); },
annuler: function () { self.focusApres = 'effacer'; self.setState({ confirmer: false }); },
effacer: function () {
try { Store.reinitialiserDemo(window.localStorage); } catch (e) {}
try { sessionStorage.removeItem('pq-mail'); } catch (e) {}
location.href = '/';
}
};
}
}
</script><script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/parcours.js"></script><script src="/animations.js"></script><script src="/boot.js"></script></body></html>
