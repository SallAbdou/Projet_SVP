<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le fournil · Votre pAIn quotidien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>

a{color:#8A4F1C}a:hover{color:#5E3412}

</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:#FBF5EA;color:#2E1D12;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:#F3E6CF;border-right:1px solid #E7D6B8;padding:28px 18px;display:flex;flex-direction:column;gap:26px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:10px">
<span style="width:38px;height:38px;border-radius:12px;background:#8A4F1C;color:#FBF5EA;display:inline-flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14c0-4.4 3.6-8 8-8s8 3.6 8 8v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M9 10l1.5 2M12 9.5l1.5 2M15 10l1.5 2"></path></svg>
</span>
<span style="font-family:Fraunces, Georgia, serif;font-weight:800;font-size:20px;line-height:1.1">Votre p<span style="color:#B5651D">AI</span>n quotidien</span>
</div>
<span style="font-size:13px;color:#6B5443">{{t.tagline}}</span>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<a href="/" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v10H3z"></path><path d="M5 10l2-5h10l2 5"></path></svg>{{t.nav.counter}}</a>
<a href="/fournee" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>{{t.nav.batch}}</a>
<a href="/fournil" aria-current="page" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;background:#FFFDF8;color:#5E3412;font-weight:700;text-decoration:none;box-shadow:inset 0 0 0 1px #E7D6B8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><rect x="7" y="9" width="10" height="7" rx="2"></rect></svg>{{t.nav.kitchen}}</a>
<a href="/garde-manger" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>{{t.nav.pantry}}<span style="margin-left:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">4</span></a>
<a href="/preferences" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>{{t.nav.prefs}}<span style="margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">V1</span></a>
</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:14px">
<div role="group" aria-label="{{t.langLabel}}" style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#E9D8BA;align-self:flex-start">
<button type="button" aria-pressed="{{frPressed}}" onClick="{{setFr}}" style="{{frStyle}}">FR</button>
<button type="button" aria-pressed="{{enPressed}}" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
</div>
<div style="border-top:1px solid #E7D6B8;padding-top:14px;display:flex;align-items:center;gap:10px">
<span style="width:36px;height:36px;border-radius:50%;background:#B5651D;color:#FFFDF8;display:inline-flex;align-items:center;justify-content:center;font-weight:700">L</span>
<div style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:14px">Léa Martin</span><span style="font-size:12px;color:#6B5443">{{t.role}}</span></div>
</div>
</div>
</nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:26px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:780px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A5B23">{{t.eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:#6B5443;font-size:16px">{{t.subtitle}}</p>
</div>
<span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#FFFDF8;border:1px dashed #D9C29C;color:#6B5443">{{t.sample}}</span>
</header>
<div style="background:#F3E6CF;border:1px solid #E7D6B8;border-radius:16px;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px">
<span style="font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#DCEBD6;color:#2F5E36">{{t.hot}}</span>
<span style="font-family:Fraunces, Georgia, serif;font-weight:700;font-size:17px;flex:1 1 320px;min-width:0">{{t.topic}}</span>
<a href="/fournee" style="font-weight:700;font-size:14px">{{t.change}}</a>
</div>
<section style="display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start">
<div style="flex:999 1 460px;min-width:0;background:#FFFDF8;border:1px solid #E7D6B8;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px">
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.draftTitle}} <span style="font-family:'DM Sans', sans-serif;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#DCEBD6;color:#2F5E36;vertical-align:middle">MVP</span></h2>
<span style="font-size:13px;color:#6B5443">{{t.count}}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#4A3324;flex:1 1 180px">{{t.tone}}
<select style="min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid #D9C29C;background:#FBF5EA;color:#2E1D12;font:inherit;font-weight:500">
<option>{{t.tone1}}</option><option>{{t.tone2}}</option><option>{{t.tone3}}</option>
</select>
</label>
<label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#4A3324;flex:1 1 180px">{{t.langPost}}
<select style="min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid #D9C29C;background:#FBF5EA;color:#2E1D12;font:inherit;font-weight:500">
<option>{{t.l1}}</option><option>{{t.l2}}</option>
</select>
</label>
</div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A3324">{{t.textLabel}}
<textarea rows="13" style="box-sizing:border-box;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #D9C29C;background:#FBF5EA;color:#2E1D12;font:inherit;font-weight:400;font-size:15px;line-height:1.6;resize:vertical">{{t.draft}}</textarea>
</label>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<button type="button" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #D9C29C;background:#FFFDF8;color:#2E1D12;font:inherit;font-weight:700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>{{t.regen}}</button>
<button type="button" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#8A4F1C;color:#FFFDF8;font:inherit;font-weight:700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>{{t.copy}}</button>
<button type="button" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #D9C29C;background:#FFFDF8;color:#2E1D12;font:inherit;font-weight:700">{{t.publish}} <span style="font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#E9D2A9;color:#5E3412">V1</span></button>
</div>
</div>
<aside style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px">
<div style="background:#FFFDF8;border:1px solid #E7D6B8;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#9A5B23">{{t.preview}}</h2>
<div style="display:flex;align-items:center;gap:10px">
<span style="width:40px;height:40px;border-radius:50%;background:#B5651D;color:#FFFDF8;display:inline-flex;align-items:center;justify-content:center;font-weight:700">L</span>
<div style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:14px">Léa Martin</span><span style="font-size:12px;color:#6B5443">{{t.role}}</span></div>
</div>
<p style="margin:0;font-size:14px;color:#3A281B">{{t.previewText}}</p>
<span style="font-size:13px;font-weight:700;color:#8A4F1C">{{t.more}}</span>
</div>
<div style="background:#2E1D12;color:#FBF5EA;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:20px;color:#F2C77A">{{t.checkTitle}}</h2>
<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{checks}}" as="k" hint-placeholder-count="4">
<li style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><span style="{{k.box}}" aria-hidden="true">{{k.mark}}</span><span>{{k.label}}</span></li>
</sc-for>
</ul>
</div>
</aside>
</section>
<section style="background:#FFFDF8;border:1px solid #E7D6B8;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px">
<div style="display:flex;flex-direction:column;gap:4px;max-width:680px">
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:24px">{{t.perfTitle}} <span style="font-family:'DM Sans', sans-serif;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412;vertical-align:middle">V1</span></h2>
<p style="margin:0;color:#6B5443;font-size:14px">{{t.perfSub}}</p>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:12px">
<sc-for list="{{metrics}}" as="m" hint-placeholder-count="5">
<div style="background:#FBF5EA;border:1px solid #EFE2CB;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column">
<span style="font-size:12px;color:#6B5443">{{m.label}}</span>
<span style="font-family:Fraunces, Georgia, serif;font-size:26px;font-weight:800">{{m.value}}</span>
</div>
</sc-for>
</div>
<form onSubmit="{{noSubmit}}" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:#F3E6CF;border-radius:16px;padding:16px">
<span style="flex:1 1 100%;font-size:13px;font-weight:700;color:#4A3324">{{t.formTitle}}</span>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
<label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#4A3324;flex:1 1 120px">{{f.label}}
<input type="number" min="0" placeholder="{{f.ph}}" style="min-height:44px;box-sizing:border-box;padding:0 12px;border-radius:12px;border:1.5px solid #D9C29C;background:#FFFDF8;color:#2E1D12;font:inherit">
</label>
</sc-for>
<button type="submit" style="min-height:44px;padding:0 20px;border-radius:999px;border:0;background:#8A4F1C;color:#FFFDF8;font:inherit;font-weight:700">{{t.save}}</button>
</form>
<div style="overflow-x:auto">
<table style="width:100%;min-width:640px;border-collapse:collapse;font-size:14px">
<thead>
<tr style="text-align:left;color:#6B5443;font-size:12px;text-transform:uppercase;letter-spacing:0.06em">
<th scope="col" style="padding:8px 10px;border-bottom:1px solid #E7D6B8">{{t.c1}}</th>
<th scope="col" style="padding:8px 10px;border-bottom:1px solid #E7D6B8">{{t.c2}}</th>
<th scope="col" style="padding:8px 10px;border-bottom:1px solid #E7D6B8;text-align:right">{{t.c3}}</th>
<th scope="col" style="padding:8px 10px;border-bottom:1px solid #E7D6B8;text-align:right">{{t.c4}}</th>
<th scope="col" style="padding:8px 10px;border-bottom:1px solid #E7D6B8;text-align:right">{{t.c5}}</th>
<th scope="col" style="padding:8px 10px;border-bottom:1px solid #E7D6B8;text-align:right">{{t.c6}}</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<tr>
<td style="padding:10px;border-bottom:1px solid #F0E5D2;white-space:nowrap;color:#6B5443">{{r.date}}</td>
<td style="padding:10px;border-bottom:1px solid #F0E5D2;font-weight:600">{{r.post}}</td>
<td style="padding:10px;border-bottom:1px solid #F0E5D2;text-align:right;font-variant-numeric:tabular-nums">{{r.views}}</td>
<td style="padding:10px;border-bottom:1px solid #F0E5D2;text-align:right;font-variant-numeric:tabular-nums">{{r.likes}}</td>
<td style="padding:10px;border-bottom:1px solid #F0E5D2;text-align:right;font-variant-numeric:tabular-nums">{{r.reposts}}</td>
<td style="padding:10px;border-bottom:1px solid #F0E5D2;text-align:right;font-weight:700;color:#8A4F1C">{{r.leads}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<p style="margin:0;font-size:13px;color:#6B5443">{{t.apiNote}}</p>
</section>
</main>
</div>
</script>

class Component extends DCLogic {
