<!doctype html>
<html lang="fr" data-protegee><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Le fournil · Votre pAIn quotidien</title>
<meta name="pq-titre-en" content="The kitchen · Votre pAIn quotidien">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<style>
body{margin:0;background:var(--fond-page)}
a{color:var(--brun)}a:hover{color:var(--brun-fonce)}
textarea:focus,select:focus,input:focus{outline:2px solid var(--braise);outline-offset:1px}
button:focus-visible,a:focus-visible{outline:2px solid var(--braise);outline-offset:2px}
</style>
<style>*{box-sizing:border-box}html{overflow-x:hidden}body{overflow-x:clip}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
<style>
.fo-carte{background:var(--creme);border:1px solid var(--bord);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.fo-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--bord-fort);background:var(--creme);color:var(--texte);font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.fo-btn:hover{border-color:var(--brun);color:var(--texte)}
.fo-btn-plein{border-color:var(--braise);background:var(--braise);color:var(--sur-plein)}
.fo-btn-plein:hover{border-color:var(--braise-fonce);background:var(--braise-fonce);color:var(--sur-plein)}
.fo-btn:disabled{opacity:.5;cursor:not-allowed}
.fo-btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.fo-btn:active:not(:disabled){transform:translateY(1px)}
.fo-btn-linkedin{border-color:var(--linkedin-bord);background:var(--linkedin-fond);color:var(--linkedin-texte)}
.fo-btn-linkedin:hover:not(:disabled){border-color:var(--linkedin-survol);background:var(--linkedin-survol);color:var(--linkedin-texte)}
.fo-lien{background:none;border:0;padding:0 4px;min-height:44px;font:inherit;font-size:13px;font-weight:700;color:var(--brun);cursor:pointer;align-self:flex-start}
.fo-select{min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--bord-champ);background:var(--fond);color:var(--texte);font:inherit;font-weight:500}
.fo-choix{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 20px;border-bottom:1px solid var(--trait)}
.fo-choix:last-child{border-bottom:0}
.fo-post{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--trait);border-radius:16px;background:var(--fond)}
.fo-champs{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.fo-champ{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--texte-2);flex:1 1 130px;min-width:0}
.fo-champ input{min-height:44px;width:100%;padding:0 12px;border-radius:12px;border:1.5px solid var(--bord-fort);background:var(--creme);color:var(--texte);font:inherit;font-size:15px}
.fo-champ input[aria-invalid="true"]{border-color:var(--erreur)}
.fo-erreur{font-size:12px;font-weight:600;color:var(--erreur)}
.fo-voile{position:fixed;inset:0;z-index:40;background:var(--voile);display:flex;align-items:center;justify-content:center;padding:16px}
.fo-boite{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:var(--creme);border-radius:20px;box-shadow:var(--ombre-3);padding:22px;display:flex;flex-direction:column;gap:14px;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif}
#pq-toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;display:flex;justify-content:center;pointer-events:none;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif}
@keyframes pq-apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){html:not([data-animations="on"]) .toast-box{animation:none!important}}
.toast-box{animation:pq-apparait .2s ease-out;pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:520px;min-height:44px;padding:8px 18px;border-radius:14px;background:var(--texte);color:var(--fond);font-size:15px;font-weight:600;box-shadow:var(--ombre-3)}
/* Lot 35 : « Voir ma vitrine » après un nouveau titre. */
.toast-lien{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--croute);color:var(--sur-clair);font-weight:700;text-decoration:none;white-space:nowrap}
.toast-lien:hover{color:var(--sur-clair);text-decoration:underline}
.toast-lien:focus-visible{outline:2px solid var(--fond);outline-offset:2px}
/* Compte LinkedIn : profil, droits, tuiles de chiffres, courbe des impressions, squelette de chargement. */
.fo-li-tete{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.fo-source{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--miel);color:var(--brun-fonce)}
.fo-source[data-source="linkedin"]{background:var(--linkedin-fond);color:var(--linkedin-texte)}
.fo-li-invite{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px 18px;border:1.5px dashed var(--bord-fort);border-radius:16px}
.fo-li-logo{flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--linkedin-fond);color:var(--linkedin-texte);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:-0.02em}
.fo-li-profil{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--trait);border-radius:16px;background:var(--fond)}
.fo-li-photo{flex:0 0 auto;width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--linkedin-fond)}
.fo-li-initiale{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--linkedin-fond);color:var(--linkedin-texte);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.fo-droits{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.fo-droit{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px dashed var(--bord-fort);color:var(--doux)}
.fo-droit[data-ok="true"]{border:1px solid var(--ok);background:var(--ok-fond);color:var(--texte)}
.fo-tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fo-tuile{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--trait);border-radius:16px;background:var(--fond);min-width:0}
.fo-tuile-l{font-size:12px;font-weight:700;color:var(--texte-2)}
.fo-tuile-v{font-family:Fraunces, Georgia, serif;font-size:26px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.fo-tuile-d{font-size:12px;color:var(--doux)}
.fo-courbe-bloc{margin:0;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--trait);border-radius:16px;background:var(--fond)}
.fo-courbe-bloc figcaption{font-size:13px;font-weight:700;color:var(--texte-2)}
.fo-courbe{display:flex;align-items:flex-end;gap:3px;height:96px;border-bottom:1px solid var(--trait)}
.fo-barre{flex:1 1 0;min-width:2px;border-radius:4px 4px 0 0;background:var(--braise)}
.fo-barre:hover{background:var(--brun)}
.fo-squelette{border-radius:14px;background:var(--sable);animation:fo-pulse 1.1s ease-in-out infinite alternate}
@keyframes fo-pulse{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){html:not([data-animations="on"]) .fo-squelette{animation:none!important}}
@media (max-width:640px){.fo-carte{padding:18px}.fo-choix{padding:14px 16px}}
</style>
<script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/garde.js"></script><script src="/theme.js"></script><script src="/animations.js"></script>
</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a><div id="root"></div>
<div id="pq-toast" role="status" aria-live="polite"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:var(--fond);color:var(--texte);font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav data-nav data-page="fournil" aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:var(--sable);border-right:1px solid var(--bord);padding:28px 18px;display:flex;flex-direction:column;gap:26px"></nav>
<main id="contenu" tabindex="-1" style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:26px">
<header style="display:flex;flex-direction:column;gap:6px;max-width:780px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--sur-titre)">{{t.eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em"><span style="display:block">{{t.titre1}}</span><span style="display:block">{{t.titre2}}</span></h1>
<p style="margin:0;color:var(--doux);font-size:16px">{{t.subtitle}}</p>
</header>
<p role="status" style="{{chargementStyle}}">{{t.chargement}}</p>
<section aria-labelledby="choix-t" style="{{choixStyle}}">
<h2 id="choix-t" class="pq-sr">{{t.choixTitre}}</h2>
<p style="{{introuvableStyle}}">{{t.introuvable}}</p>
<h3 style="{{jourTitreStyle}}">{{t.choixJour}}</h3>
<div style="{{jourStyle}}">
<sc-for list="{{choixJour}}" as="c" hint-placeholder-count="5">
<div class="fo-choix">
<span class="{{c.chip}}">{{c.etat}}</span>
<div style="flex:999 1 260px;min-width:0;display:flex;flex-direction:column"><span style="font-family:Fraunces, Georgia, serif;font-weight:700;font-size:17px;overflow-wrap:anywhere">{{c.titre}}</span><span style="font-size:13px;color:var(--doux)">{{c.source}}</span></div>
<a href="{{c.href}}" class="btn-petrir" aria-label="{{c.label}}"><svg class="pain-ico" viewBox="0 0 24 16" aria-hidden="true" focusable="false"><path d="M1.5 11.2C1.5 6.4 6.2 3 12 3s10.5 3.4 10.5 8.2c0 1.6-1.2 2.8-2.8 2.8H4.3c-1.6 0-2.8-1.2-2.8-2.8z" fill="var(--petrir-pain)" stroke="currentColor" stroke-width="1.3"></path><path d="M6.8 7.4l2.2 2.6M10.9 6.4l2.2 2.6M15 7.4l2.2 2.6" stroke="var(--petrir-grigne)" stroke-width="1.6" stroke-linecap="round" fill="none"></path></svg>{{t.petrir}}</a>
</div>
</sc-for>
</div>
<h3 style="{{cotesTitreStyle}}">{{t.choixCotes}}</h3>
<div style="{{cotesStyle}}">
<sc-for list="{{choixCotes}}" as="c" hint-placeholder-count="2">
<div class="fo-choix">
<span class="{{c.chip}}">{{c.etat}}</span>
<div style="flex:999 1 260px;min-width:0;display:flex;flex-direction:column"><span style="font-family:Fraunces, Georgia, serif;font-weight:700;font-size:17px;overflow-wrap:anywhere">{{c.titre}}</span><span style="font-size:13px;color:var(--doux)">{{c.source}}</span></div>
<a href="{{c.href}}" class="btn-petrir" aria-label="{{c.label}}"><svg class="pain-ico" viewBox="0 0 24 16" aria-hidden="true" focusable="false"><path d="M1.5 11.2C1.5 6.4 6.2 3 12 3s10.5 3.4 10.5 8.2c0 1.6-1.2 2.8-2.8 2.8H4.3c-1.6 0-2.8-1.2-2.8-2.8z" fill="var(--petrir-pain)" stroke="currentColor" stroke-width="1.3"></path><path d="M6.8 7.4l2.2 2.6M10.9 6.4l2.2 2.6M15 7.4l2.2 2.6" stroke="var(--petrir-grigne)" stroke-width="1.6" stroke-linecap="round" fill="none"></path></svg>{{t.petrir}}</a>
</div>
</sc-for>
</div>
<div style="{{choixVideStyle}}"><p style="margin:0;color:var(--doux)">{{t.choixVide}}</p><a href="/fournee" class="fo-btn fo-btn-plein" style="align-self:flex-start">{{t.allerFournee}}</a></div>
</section>
<div data-visite="sujet" style="{{sujetStyle}}">
<div style="background:var(--sable);border:1px solid var(--bord);border-radius:16px;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px">
<span class="{{sujet.chip}}">{{sujet.etat}}</span>
<div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-family:Fraunces, Georgia, serif;font-weight:700;font-size:17px;overflow-wrap:anywhere">{{sujet.titre}}</span>
<span style="font-size:13px;color:var(--doux)">{{sujet.source}}</span>
<span class="pour-toi" style="{{sujet.pourToiStyle}}"><svg class="ampoule" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 1v1.8M4.2 4.2l1.3 1.3M19.8 4.2l-1.3 1.3M1.5 11.5h1.8M20.7 11.5h1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><path d="M12 5a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.4h5.2v-.4c0-.8.4-1.5 1-2A6 6 0 0 0 12 5z" fill="currentColor" stroke="var(--brun)" stroke-width="1.2" stroke-linejoin="round"></path><path d="M9.6 20.6h4.8M10.6 22.8h2.8" stroke="var(--brun)" stroke-width="1.6" stroke-linecap="round"></path></svg><span>{{sujet.pourToi}}</span></span>
</div>
<a href="/fournil" data-focus="changer" style="font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center">{{t.change}}</a>
</div>
<section data-visite="brouillon" style="display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start">
<div class="fo-carte" style="flex:999 1 460px;min-width:0">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px">
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.draftTitle}}</h2>
<span id="compteur-brouillon" style="{{compteurStyle}}">{{compteur}}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<label for="sel-ton" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--texte-2);flex:1 1 180px">{{t.tone}}
<select id="sel-ton" class="fo-select" onChange="{{choisirTon}}">
<sc-for list="{{tons}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}" {{o.sel}}>{{o.label}}</option></sc-for>
</select>
</label>
<label for="sel-langue" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--texte-2);flex:1 1 180px">{{t.langPost}}
<select id="sel-langue" class="fo-select" onChange="{{choisirLangue}}">
<sc-for list="{{langues}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}" {{o.sel}}>{{o.label}}</option></sc-for>
</select>
</label>
</div>
<div role="alert" style="{{attenteStyle}}">
<span style="flex:1 1 100%;font-weight:600">{{attenteTexte}}</span>
<button type="button" class="fo-btn fo-btn-plein" data-focus="remplacer" onClick="{{remplacer}}">{{t.remplacer}}</button>
<button type="button" class="fo-btn" data-focus="garder" onClick="{{garder}}">{{t.garder}}</button>
</div>
<label for="brouillon" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--texte-2)">{{t.textLabel}}
<textarea id="brouillon" aria-describedby="compteur-brouillon" rows="14" onInput="{{saisir}}" onCompositionend="{{saisir}}" style="box-sizing:border-box;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--bord-champ);background:var(--fond);color:var(--texte);font:inherit;font-weight:400;font-size:15px;line-height:1.6;resize:vertical">
{{texte}}</textarea>
</label>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<button type="button" class="fo-btn" data-focus="repetrir" onClick="{{repetrir}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg>{{t.regen}}</button>
<button type="button" class="fo-btn fo-btn-plein" data-focus="copier" onClick="{{copier}}" {{desactive}}>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>{{t.copy}}</button>
<button type="button" class="fo-btn fo-btn-linkedin" data-focus="publier" onClick="{{ouvrirModale}}" {{desactive}}>{{t.publish}}</button>
</div>
</div>
<div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px">
<div style="background:var(--panneau);color:var(--panneau-texte);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:20px;color:var(--panneau-or)">{{t.checkTitle}}</h2>
<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{checks}}" as="k" hint-placeholder-count="4">
<li style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><span style="{{k.box}}" aria-hidden="true">{{k.mark}}</span><span>{{k.label}}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">{{k.etat}}</span></span></li>
</sc-for>
</ul>
</div>
<div style="background:var(--creme);border:1px solid var(--bord);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
<h2 style="margin:0;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--sur-titre)">{{t.preview}}</h2>
<div style="display:flex;align-items:center;gap:10px">
<img src="{{auteur.photo}}" alt="" width="40" height="40" style="{{auteur.photoStyle}}"><span aria-hidden="true" style="{{auteur.initialeStyle}}">{{auteur.initiale}}</span>
<div style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:700;font-size:14px">{{auteur.prenom}}</span><span style="font-size:12px;color:var(--doux)">{{auteur.role}}</span></div>
</div>
<p id="apercu-texte" style="margin:0;font-size:14px;color:var(--texte-2);white-space:pre-line;overflow-wrap:anywhere">{{apercu.texte}}</p>
<button type="button" class="fo-lien" data-focus="voir-plus" aria-expanded="{{apercu.ouvert}}" aria-controls="apercu-texte" onClick="{{basculerApercu}}" style="{{apercu.boutonStyle}}">{{apercu.bouton}}</button>
</div>
</div>
</section>
</div>
<section class="fo-carte" aria-labelledby="li-t" aria-busy="{{li.occupe}}">
<div class="fo-li-tete">
<div style="display:flex;flex-direction:column;gap:4px;max-width:680px;min-width:0">
<h2 id="li-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:24px">{{t.li.titre}}</h2>
<p style="margin:0;color:var(--doux);font-size:14px">{{li.sousTitre}}</p>
</div>
<span class="fo-source" data-source="{{li.source}}" style="{{li.sourceStyle}}">{{li.sourceTexte}}</span>
</div>
<div style="{{li.squeletteStyle}}" aria-hidden="true">
<div class="fo-squelette" style="height:88px"></div>
<div class="fo-tuiles"><div class="fo-squelette" style="height:84px"></div><div class="fo-squelette" style="height:84px"></div><div class="fo-squelette" style="height:84px"></div><div class="fo-squelette" style="height:84px"></div></div>
</div>
<p class="pq-pleine" style="{{li.chargementStyle}}">{{t.li.chargement}}</p>
<div class="fo-li-invite" style="{{li.inviteStyle}}">
<span class="fo-li-logo" aria-hidden="true">in</span>
<p class="pq-pleine" style="margin:0;flex:1 1 260px;min-width:0;font-size:14px;color:var(--texte-2)">{{li.inviteTexte}}</p>
<a href="{{li.connexionHref}}" class="fo-btn fo-btn-linkedin" data-focus="li-connecter" style="{{li.connexionStyle}}">{{li.connexionTexte}}</a>
<button type="button" class="fo-btn" data-focus="li-reessayer" onClick="{{reessayerLinkedIn}}" style="{{li.reessayerStyle}}">{{t.li.reessayer}}</button>
</div>
<div class="fo-li-profil" style="{{li.profilStyle}}">
<img class="fo-li-photo" src="{{li.photo}}" alt="" width="56" height="56" style="{{li.photoStyle}}">
<span class="fo-li-initiale" aria-hidden="true" style="{{li.initialeStyle}}">{{li.initiale}}</span>
<div style="flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:1px">
<span style="font-weight:700;font-size:17px;overflow-wrap:anywhere">{{li.nom}}</span>
<span style="font-size:13px;color:var(--doux);overflow-wrap:anywhere">{{li.email}}</span>
<span style="font-size:13px;font-weight:700;color:var(--ok)">{{li.connexion}}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" class="fo-btn" data-focus="li-actualiser" onClick="{{actualiserLinkedIn}}">{{t.li.actualiser}}</button>
<button type="button" class="fo-btn" data-focus="li-deconnecter" onClick="{{deconnecterLinkedIn}}">{{t.li.deconnecter}}</button>
</div>
</div>
<ul class="fo-droits" aria-label="{{t.li.droitsLabel}}" style="{{li.droitsStyle}}">
<sc-for list="{{liDroits}}" as="d" hint-placeholder-count="5"><li class="fo-droit" data-ok="{{d.ok}}"><span aria-hidden="true">{{d.mark}}</span>{{d.label}}<span class="pq-sr">{{d.etat}}</span></li></sc-for>
</ul>
<div style="{{li.chiffresStyle}}">
<p class="pq-pleine" style="{{li.noteStyle}}">{{li.note}}</p>
<div class="fo-tuiles">
<sc-for list="{{liTuiles}}" as="m" hint-placeholder-count="7"><div class="fo-tuile"><span class="fo-tuile-l">{{m.label}}</span><span class="fo-tuile-v">{{m.valeur}}</span><span class="fo-tuile-d">{{m.detail}}</span></div></sc-for>
</div>
<figure class="fo-courbe-bloc" style="{{li.courbeStyle}}">
<figcaption>{{li.courbeTitre}}</figcaption>
<div class="fo-courbe" aria-hidden="true"><sc-for list="{{liJours}}" as="j" hint-placeholder-count="28"><span class="fo-barre" style="{{j.style}}" title="{{j.titre}}"></span></sc-for></div>
<p class="pq-sr">{{li.courbeResume}}</p>
</figure>
</div>
</section>
<section class="fo-carte" aria-labelledby="perf-t">
<div style="display:flex;flex-direction:column;gap:4px;max-width:680px">
<h2 id="perf-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:24px">{{t.perfTitle}}</h2>
<p style="margin:0;color:var(--doux);font-size:14px">{{t.perfSub}}</p>
</div>
<p class="pq-pleine" style="{{perfVideStyle}}">{{t.perfVide}}</p>
<sc-for list="{{posts}}" as="p" hint-placeholder-count="2">
<form class="fo-post" data-index="{{p.i}}" data-id="{{p.id}}" onSubmit="{{enregistrerChiffres}}" novalidate aria-label="{{p.formLabel}}">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px"><h3 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:17px;overflow-wrap:anywhere">{{p.titre}}</h3><span style="font-size:13px;color:var(--doux)">{{p.date}}</span></div>
<p style="margin:0;font-size:14px;color:var(--texte-2)">{{p.resume}}</p>
<div style="{{p.liStyle}}"><a href="{{p.liHref}}" target="_blank" rel="noopener" aria-label="{{p.liLabel}}" style="font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center">{{t.voirPost}}</a><button type="button" class="fo-lien" data-index="{{p.i}}" data-focus="{{p.remplirFocus}}" onClick="{{remplirDepuisLinkedIn}}" style="{{p.remplirStyle}}">{{t.li.remplir}}</button></div>
<span style="font-size:13px;font-weight:700;color:var(--texte-2)">{{t.formTitle}}</span>
<div class="fo-champs">
<label class="fo-champ" for="{{p.idImpressions}}">{{t.champs.impressions}}<input id="{{p.idImpressions}}" data-index="{{p.i}}" data-champ="impressions" inputmode="numeric" autocomplete="off" value="{{p.vImpressions}}" aria-invalid="{{p.invImpressions}}" aria-describedby="{{p.idImpressions}}-e" onInput="{{saisirChiffre}}"><span id="{{p.idImpressions}}-e" class="fo-erreur">{{p.eImpressions}}</span></label>
<label class="fo-champ" for="{{p.idReactions}}">{{t.champs.reactions}}<input id="{{p.idReactions}}" data-index="{{p.i}}" data-champ="reactions" inputmode="numeric" autocomplete="off" value="{{p.vReactions}}" aria-invalid="{{p.invReactions}}" aria-describedby="{{p.idReactions}}-e" onInput="{{saisirChiffre}}"><span id="{{p.idReactions}}-e" class="fo-erreur">{{p.eReactions}}</span></label>
<label class="fo-champ" for="{{p.idRepublications}}">{{t.champs.republications}}<input id="{{p.idRepublications}}" data-index="{{p.i}}" data-champ="republications" inputmode="numeric" autocomplete="off" value="{{p.vRepublications}}" aria-invalid="{{p.invRepublications}}" aria-describedby="{{p.idRepublications}}-e" onInput="{{saisirChiffre}}"><span id="{{p.idRepublications}}-e" class="fo-erreur">{{p.eRepublications}}</span></label>
<label class="fo-champ" for="{{p.idCommentaires}}">{{t.champs.commentaires}}<input id="{{p.idCommentaires}}" data-index="{{p.i}}" data-champ="commentaires" inputmode="numeric" autocomplete="off" value="{{p.vCommentaires}}" aria-invalid="{{p.invCommentaires}}" aria-describedby="{{p.idCommentaires}}-e" onInput="{{saisirChiffre}}"><span id="{{p.idCommentaires}}-e" class="fo-erreur">{{p.eCommentaires}}</span></label>
<label class="fo-champ" for="{{p.idContacts}}">{{t.champs.contacts}}<input id="{{p.idContacts}}" data-index="{{p.i}}" data-champ="contacts" inputmode="numeric" autocomplete="off" value="{{p.vContacts}}" aria-invalid="{{p.invContacts}}" aria-describedby="{{p.idContacts}}-e" onInput="{{saisirChiffre}}"><span id="{{p.idContacts}}-e" class="fo-erreur">{{p.eContacts}}</span></label>
</div>
<button type="submit" class="fo-btn fo-btn-plein" id="{{p.idBouton}}" style="align-self:flex-start">{{t.save}}</button>
</form>
</sc-for>
<p style="margin:0;font-size:13px;color:var(--doux)">{{t.apiNote}}</p>
</section>
</main>
</div>
<div class="fo-voile" style="{{modaleStyle}}" onClick="{{clicVoile}}">
<div class="fo-boite" role="dialog" aria-modal="true" aria-labelledby="modale-t" aria-describedby="modale-d" onKeydown="{{clavierModale}}">
<h2 id="modale-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.modaleTitre}}</h2>
<p id="modale-d" style="{{modale.noteStyle}}">{{modale.note}}</p>
<div style="border:1px solid var(--bord);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--champ)">
<div style="display:flex;align-items:center;gap:10px">
<img src="{{auteur.photo}}" alt="" width="40" height="40" style="{{auteur.photoStyle}}"><span aria-hidden="true" style="{{auteur.initialeStyle}}">{{auteur.initiale}}</span>
<div style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:700;font-size:14px">{{auteur.prenom}}</span><span style="font-size:12px;color:var(--doux)">{{auteur.role}}</span></div>
</div>
<p style="margin:0;font-size:14px;color:var(--texte-2);white-space:pre-line;overflow-wrap:anywhere;max-height:40vh;overflow:auto">{{texteNet}}</p>
</div>
<label for="sel-visibilite" style="{{modale.visibiliteStyle}}">{{t.visibiliteLabel}}
<select id="sel-visibilite" class="fo-select" onChange="{{choisirVisibilite}}">
<sc-for list="{{visibilites}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}" {{o.sel}}>{{o.label}}</option></sc-for>
</select>
</label>
<p role="alert" style="{{modale.erreurStyle}}">{{modale.erreur}}</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end">
<button type="button" class="fo-btn" data-focus="modale-annuler" onClick="{{fermerModale}}">{{t.annuler}}</button>
<button type="button" class="fo-btn {{modale.confirmerClasse}}" data-focus="modale-confirmer" onClick="{{confirmerPublication}}" {{modale.desactive}}>{{modale.confirmer}}</button>
</div>
</div>
</div>
</script>

visibilites: ['PUBLIC', 'CONNECTIONS'].map(function (v) { return { v: v, label: t.visibilites[v], sel: v === st.visibilite ? 'selected' : '' }; }),
apercu: { texte: ouvert ? String(st.texte).trim() : ap.texte, ouvert: String(!!ouvert), bouton: ouvert ? t.less : t.more, boutonStyle: ap.coupe ? '' : HIDE },

var s = self.saisiesDe(i);
var e = st.erreurs[i] || {};
var v = { i: i, id: p.id, titre: p.titre || '', date: t.publieLe.replace('{d}', dateLisible(p.publieLe, lang)), formLabel: t.formLabel.replace('{t}', p.titre || ''), idBouton: 'ch-' + i + '-ok',
resume: p.chiffres ? Fournil.CHAMPS.map(function (k) { return t.champs[k] + sep + nombre(p.chiffres[k], lang); }).join(' · ') : t.pasDeChiffres };
var lk = p.linkedin && p.linkedin.url ? p.linkedin : null;
v.liStyle = lk ? 'display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px' : HIDE;
v.liHref = lk ? lk.url : '';
v.liLabel = t.voirPostDe.replace('{t}', p.titre || '');
v.remplirStyle = lk && vl.parPost[lk.urn] ? '' : HIDE;

Fournil.CHAMPS.forEach(function (k) {
var M = CHAMP_MAJ[k];
v['id' + M] = 'ch-' + i + '-' + k;
v['v' + M] = s[k];
v['inv' + M] = String(!!e[k]);

});

}),
choisirTon: function (e) { self.demander(e.target.value, st.langue, 0, 'ton'); },
choisirLangue: function (e) { self.demander(st.ton, e.target.value, 0, 'langue'); },

copier: function () { self.copier(); },

confirmerPublication: function () { self.confirmerPublication(); },
clicVoile: function (e) { if (e.target === e.currentTarget) self.fermerModale(); },
// Focus piégé dans la fenêtre : Tab boucle, Échap ferme.
clavierModale: function (e) {
if (e.key === 'Escape') { e.preventDefault(); self.fermerModale(); return; }
if (e.key !== 'Tab') return;
var els = focalisables(e.currentTarget);
if (!els.length) return;
var premier = els[0], dernier = els[els.length - 1];
if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
},

};
