class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr', qrOuvert: false, chatOuvert: false, posees: [], faqOuvertes: {} }; }
// Appelée par le bouton QR de l'en-tête (parcours.js).
ouvrirQr() { this.pendingFocus = 'qr-fermer'; this.setState({ qrOuvert: true }); }
fermerQr() { this.pendingFocus = 'entete-qr'; this.setState({ qrOuvert: false }); }
ouvrirChat() { this.pendingFocus = 'chat-fermer'; this.setState({ chatOuvert: true }); }
fermerChat() { this.pendingFocus = 'chat-lanceur'; this.setState({ chatOuvert: false }); }
// Question choisie dans le chat : ajoutée au fil, le focus passe à la question suivante.
poser(id) {
var posees = this.state.posees.concat([id]);
var reste = this.restantes(posees);
this.pendingFocus = reste.length ? 'sugg-' + reste[0] : 'chat-fermer';
this.setState({ posees: posees });
}
restantes(posees) {
var t = T[this.state.lang || 'fr'];
return t.faq.map(function (f) { return f[0]; }).filter(function (id) { return posees.indexOf(id) === -1; });
}
afterRender(root) {
var f = this.pendingFocus;
this.pendingFocus = null;
var el = f && root.querySelector('[data-focus="' + f + '"]');
if (el) el.focus();
// « Voir toutes les questions » : après le rendu (boot.js restaure le défilement), on descend à la FAQ.
if (this.allerFaq) {
this.allerFaq = false;
setTimeout(function () { var titre = root.querySelector('#faq-t'); if (titre) { titre.scrollIntoView({ block: 'start' }); titre.focus({ preventScroll: true }); } }, 0);
}
var fil = root.querySelector('.chat-fil');
if (fil) fil.scrollTop = fil.scrollHeight;
brancherCoucou(root);
}
renderVals() {
var self = this;
var s = this.state || {};
var lang = s.lang || 'fr';
var t = T[lang];
var connecte = false;
try { connecte = !!Auth.utilisateurCourant(); } catch (e) {}
var parId = {};
t.faq.forEach(function (f) { parId[f[0]] = f; });
var posees = (s.posees || []).filter(function (id) { return parId[id]; });
var messages = [{ classe: 'chat-msg chat-msg-miette', qui: t.chatMiette, texte: t.chatBonjour }];
posees.forEach(function (id) {
messages.push({ classe: 'chat-msg chat-msg-toi', qui: t.chatToi, texte: parId[id][1] });
messages.push({ classe: 'chat-msg chat-msg-miette', qui: t.chatMiette, texte: reponseTexte(parId[id][2]) });
});
var reste = this.restantes(posees);
if (!reste.length) messages.push({ classe: 'chat-msg chat-msg-miette', qui: t.chatMiette, texte: t.chatFini });
// Dernière réponse de Miette, relayée par la zone d'annonce de boot.js (lot 24).
var chatAnnonce = posees.length ? messages[messages.length - 1].texte : '';
var ouvertes = s.faqOuvertes || {};
return {
t: t,
chatAnnonce: chatAnnonce,
voileStyle: s.qrOuvert ? '' : 'display: none',
fermerQr: function () { self.fermerQr(); },
clicVoile: function (e) { if (e.target === e.currentTarget) self.fermerQr(); },
clavierModale: function (e) { Parcours.clavierModale(e, function () { self.fermerQr(); }); },
ctaHref: connecte ? '/fournee' : '/decouvrir',
ctaLabel: connecte ? t.ctaConnecte : t.cta,
apercu: t.apercu.map(function (a, i) {
return { rang: String(i + 1).padStart(2, '0'), titre: a[0], source: a[1], puce: 'puce puce-' + a[2], etat: t.etats[a[2]], score: a[3] + t.sur15 };
}),
etapes: t.etapes.map(function (e, i) { return { num: i + 1, titre: e[0], texte: e[1] }; }),
// Réponse en un ou deux paragraphes ; la question « données » est rendue à part (lien Confidentialité).
faq: t.faq.filter(function (f) { return f[0] !== 'donnees'; }).map(function (f) {
var r = [].concat(f[2]);
return { id: f[0], q: f[1], r: r[0], suite: r[1] || '', cacheSuite: r[1] ? '' : 'hidden', ouvert: ouvertes[f[0]] ? 'open' : '' };
}),
donnees: { q: parId.donnees[1], ouvert: ouvertes.donnees ? 'open' : '' },
// Ouverture d'une question gardée sans nouveau rendu, pour la retrouver après un changement de langue.
noterFaq: function (e) { s.faqOuvertes = s.faqOuvertes || {}; s.faqOuvertes[e.currentTarget.getAttribute('data-id')] = e.currentTarget.open; },
chatOuvert: String(!!s.chatOuvert),
chatStyle: s.chatOuvert ? '' : 'display: none',
lanceurStyle: s.chatOuvert ? 'display: none' : '',
ouvrirChat: function () { self.ouvrirChat(); },
fermerChat: function () { self.fermerChat(); },
clavierChat: function (e) { if (e.key === 'Escape') { e.preventDefault(); self.fermerChat(); } },
versFaq: function (e) { e.preventDefault(); self.allerFaq = true; self.setState({ chatOuvert: false }); },
messages: messages,
// Quatre questions proposées à la fois, pour garder le chat lisible sur téléphone.
suggestions: reste.slice(0, 4).map(function (id) { return { id: id, q: parId[id][1] }; }),
poser: function (e) { self.poser(e.currentTarget.getAttribute('data-id')); }
};
}
}
// Une réponse de FAQ est une chaîne ou une liste de paragraphes ; le chat les met bout à bout.
function reponseTexte(r) { return [].concat(r).join(' '); }
// Lot 39 : coucou de Miette. Le survol l'anime en CSS ; un appui (écran tactile, sans survol) pose la classe miette-coucou,
// qui garde aussi le geste jusqu'au bout si la souris part en cours de route. Retirée à la fin du bras droit (le plus long).
// Aucun gestionnaire touch ou pointer : le défilement n'est pas gêné. Miette reste une image décorative, pas un bouton.
function brancherCoucou(root) {
var m = root.querySelector('.miette-accueil');
if (!m) return;
function saluer() { m.classList.add('miette-coucou'); }
m.addEventListener('click', saluer);
m.addEventListener('mouseenter', saluer);
m.addEventListener('animationend', function (e) { if (e.animationName === 'miette-coucou-d') m.classList.remove('miette-coucou'); });
}
</script><script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/parcours.js"></script><script src="/animations.js"></script><script src="/boot.js"></script></body></html>
