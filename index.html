<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le comptoir · Votre pAIn quotidien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EA}
a{color:#8A4F1C}a:hover{color:#5E3412}
</style>
<style>*{box-sizing:border-box}html,body{overflow-x:hidden}@media (max-width:640px){main{padding:24px 16px 40px!important}h1{font-size:30px!important}}</style>
</head><body><div id="root"></div>
<script type="text/plain" id="tpl">
<div style="display:flex;flex-wrap:wrap;min-height:100vh;background:#FBF5EA;color:#2E1D12;font-family:'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;font-size:15px;line-height:1.5">
<nav aria-label="{{t.navLabel}}" style="flex:1 1 250px;max-width:100%;box-sizing:border-box;background:#F3E6CF;border-right:1px solid #E7D6B8;padding:28px 18px;display:flex;flex-direction:column;gap:26px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:10px">
<span style="width:38px;height:38px;border-radius:12px;background:#8A4F1C;color:#FBF5EA;display:inline-flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14c0-4.4 3.6-8 8-8s8 3.6 8 8v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M9 10l1.5 2M12 9.5l1.5 2M15 10l1.5 2"></path></svg>
</span>
<span style="font-family:Fraunces, Georgia, serif;font-weight:800;font-size:20px;line-height:1.1">Votre p<span style="color:#B5651D">AI</span>n quotidien</span>
</div>
<span style="font-size:13px;color:#6B5443">{{t.tagline}}</span>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<a href="/" aria-current="page" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;background:#FFFDF8;color:#5E3412;font-weight:700;text-decoration:none;box-shadow:inset 0 0 0 1px #E7D6B8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v10H3z"></path><path d="M5 10l2-5h10l2 5"></path></svg>{{t.nav.counter}}</a>
<a href="/fournee" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>{{t.nav.batch}}</a>
<a href="/fournil" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><rect x="7" y="9" width="10" height="7" rx="2"></rect></svg>{{t.nav.kitchen}}</a>
<a href="/garde-manger" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>{{t.nav.pantry}}<span style="margin-left:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">4</span></a>
<a href="/preferences" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#4A3324;text-decoration:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>{{t.nav.prefs}}<span style="margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">V1</span></a>
</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:14px">
<div role="group" aria-label="{{t.langLabel}}" style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#E9D8BA;align-self:flex-start">
<button type="button" aria-pressed="{{frPressed}}" onClick="{{setFr}}" style="{{frStyle}}">FR</button>
<button type="button" aria-pressed="{{enPressed}}" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
</div>
<div style="border-top:1px solid #E7D6B8;padding-top:14px;display:flex;align-items:center;gap:10px">
<span style="width:36px;height:36px;border-radius:50%;background:#B5651D;color:#FFFDF8;display:inline-flex;align-items:center;justify-content:center;font-weight:700">L</span>
<div style="display:flex;flex-direction:column"><span style="font-weight:700;font-size:14px">Léa Martin</span><span style="font-size:12px;color:#6B5443">{{t.role}}</span></div>
</div>
</div>
</nav>
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 60px;display:flex;flex-direction:column;gap:26px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
<p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9A5B23">{{t.eyebrow}}</p>
<h1 style="margin:0;font-family:Fraunces, Georgia, serif;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.01em">{{t.title}}</h1>
<p style="margin:0;color:#6B5443;font-size:16px">{{t.subtitle}}</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#6B5443">
<span style="font-weight:700;padding:2px 8px;border-radius:999px;background:#DCEBD6;color:#2F5E36">MVP</span>{{t.built}}
<span style="font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">V1</span>{{t.next}}
<span style="font-weight:600;padding:4px 10px;border-radius:999px;background:#FFFDF8;border:1px dashed #D9C29C;color:#6B5443">{{t.sample}}</span>
</div>
</header>
<section aria-label="{{t.kpiLabel}}" style="display:flex;flex-direction:column;gap:12px">
<p style="margin:0;font-size:14px;color:#6B5443"><strong style="color:#2E1D12">{{t.kpiTitle}}</strong> <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412">V1</span></p>
<div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:14px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="{{k.box}}">
<span style="{{k.labelStyle}}">{{k.label}}</span>
<span style="font-family:Fraunces, Georgia, serif;font-size:32px;font-weight:800;line-height:1.1">{{k.value}}</span>
<span style="{{k.subStyle}}">{{k.sub}}</span>
</div>
</sc-for>
</div>
</section>
<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
<section aria-labelledby="vis-t" style="flex:999 1 520px;min-width:0;background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
<h2 id="vis-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.visTitle}} <span style="font-family:'DM Sans', sans-serif;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412;vertical-align:middle">V1</span></h2>
<span style="font-size:13px;color:#6B5443">{{t.visSub}}</span>
</div>
<div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:14px;align-items:end;height:220px;border-bottom:2px solid #E7D6B8;padding-bottom:4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%">
<span style="font-size:12px;font-weight:700">{{b.value}}</span>
<div style="{{b.barStyle}}"></div>
</div>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:14px;font-size:12px;color:#4A3324;text-align:center">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
<span><span style="{{b.dotStyle}}" aria-hidden="true">●</span> {{b.label}}</span>
</sc-for>
</div>
<p style="margin:0;padding:12px 16px;border-radius:12px;background:#F6E7CC;color:#5E3412;font-size:14px">{{t.insight}}</p>
</section>
<div style="flex:1 1 330px;min-width:0;display:flex;flex-direction:column;gap:16px">
<section aria-labelledby="next-t" style="background:#2E1D12;color:#FBF5EA;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
<h2 id="next-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:20px">{{t.nextTitle}}</h2>
<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#DCEBD6;color:#2F5E36">MVP</span>
</div>
<span style="align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F2C77A;color:#3B2416">{{t.hot}}</span>
<p style="margin:0;font-weight:700;font-size:17px;line-height:1.35">{{t.nextArticle}}</p>
<p style="margin:0;font-size:13.5px;color:#E9D8BA">{{t.nextWhy}}</p>
<a href="/fournil" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:#F2C77A;color:#2E1D12;font-weight:700;text-decoration:none">{{t.nextCta}}</a>
</section>
<section aria-labelledby="gain-t" style="background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:12px">
<h2 id="gain-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:20px">{{t.gainTitle}} <span style="font-family:'DM Sans', sans-serif;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412;vertical-align:middle">V1</span></h2>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:#6B5443">{{t.gainQuotes}}</span><strong>3</strong></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:#6B5443">{{t.gainClicks}}</span><strong>41</strong></div>
</section>
</div>
</div>
<section aria-labelledby="pantry-t" style="background:#FFFDF8;border:1px solid #E7D6B8;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;padding-bottom:8px">
<h2 id="pantry-t" style="margin:0;font-family:Fraunces, Georgia, serif;font-size:22px">{{t.pantryTitle}} <span style="font-family:'DM Sans', sans-serif;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9D2A9;color:#5E3412;vertical-align:middle">V1</span></h2>
<a href="/garde-manger" style="font-weight:700;font-size:14px">{{t.pantryAll}}</a>
</div>
<sc-for list="{{pantry}}" as="p" hint-placeholder-count="3">
<div style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 0;border-top:1px solid #F0E3CC">
<div style="flex:999 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:700">{{p.title}}</span><span style="font-size:12px;color:#6B5443">{{p.meta}}</span></div>
<span style="{{p.chip}}">{{p.state}}</span>
<a href="/fournil" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #8A4F1C;color:#8A4F1C;font-weight:700;font-size:14px;text-decoration:none">{{t.knead}}</a>
</div>
</sc-for>
</section>
</main>
</div>
</script>
<script src="/dc.js"></script><script>
var CHIP = {
hot: 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #DCEBD6; color: #2F5E36',

};
var DOT = { hot: 'color: #3F8A4A', knead: 'color: #D98200', stale: 'color: #C0392B' };
var T = {
fr: {

nav: { counter: 'Le comptoir', batch: 'La fournée du jour', kitchen: 'Le fournil', pantry: 'Le garde-manger', prefs: 'Mes préférences' },
eyebrow: 'Vendredi 30 octobre · tes 30 derniers jours',

nextTitle: 'Tout juste sorti du four', hot: 'Tout chaud · publie vite',

nextWhy: 'Pour toi : tu conseilles des PME sur l’automatisation.', nextCta: 'Pétrir le post',
gainTitle: 'Ce que ta veille a rapporté', gainQuotes: 'Demandes de devis', gainClicks: 'Clics vers ton offre',
pantryTitle: 'Mis de côté au garde-manger', pantryAll: 'Tout le garde-manger →', knead: 'Pétrir',
kpis: [['Posts publiés', '6', '+2 vs mois dernier'], ['Impressions', '4 820', '+38 %'], ['Réactions', '312', '+21 %'], ['Reposts', '27', 'stable'], ['Clics vers ton offre', '41', '→ 3 demandes de devis']],

},
en: {
navLabel: 'Main navigation', langLabel: 'Language', tagline: 'We knead the AI news for you.', role: 'AI consultant · solopreneur',
nav: { counter: 'The counter', batch: 'Today’s batch', kitchen: 'The kitchen', pantry: 'The pantry', prefs: 'My preferences' },
eyebrow: 'Friday, October 30 · your last 30 days',
title: 'Hi Léa, here’s what your batches brought in',
subtitle: 'Every morning we bake the latest AI news. You pick what to serve your audience.',
built: 'built', next: 'next version', sample: 'Sample data',
kpiLabel: 'Key figures', kpiTitle: 'Your posts, last 30 days',
visTitle: 'What came out of the oven best', visSub: 'impressions per post · colour = topic status when published',
insight: 'Posts on “fresh out of the oven” topics get twice the impressions on average: serve them fast.',
nextTitle: 'Fresh out of the oven', hot: 'Piping hot · post it fast',

pantryTitle: 'Set aside in the pantry', pantryAll: 'The whole pantry →', knead: 'Knead',
kpis: [['Posts published', '6', '+2 vs last month'], ['Impressions', '4,820', '+38%'], ['Reactions', '312', '+21%'], ['Reposts', '27', 'steady'], ['Clicks to your offer', '41', '→ 3 quote requests']],
bars: ['AI chips', 'GDPR & LLMs', 'Agents in SMBs', 'Prompting', 'Mistral OCR', 'AI & quotes'],
pantry: [['An open-source agent triages security alerts', 'Hacker News · set aside 1 day ago', 'hot', 'Still warm'], ['Small businesses use AI for their quotes', 'MIT Tech Review · set aside 3 days ago', 'knead', 'Bake before tomorrow'], ['GDPR versus large language models', 'The Verge · set aside 6 days ago', 'stale', 'Gone stale']]

};
var BARS = [['520', 36, 'stale'], ['410', 28, 'knead'], ['1 240', 86, 'hot'], ['680', 47, 'knead'], ['1 080', 75, 'hot'], ['890', 62, 'hot']];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr' }; }
renderVals() {
var lang = (this.state && this.state.lang) || 'fr';
var t = T[lang];
var on = 'min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #8A4F1C; color: #FFFDF8; font: inherit; font-weight: 700; cursor: pointer';
var off = 'min-height: 44px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #5E3412; font: inherit; font-weight: 600; cursor: pointer';
var self = this;
return {
t: t,
setFr: function () { self.setState({ lang: 'fr' }); },
setEn: function () { self.setState({ lang: 'en' }); },
frPressed: String(lang === 'fr'), enPressed: String(lang === 'en'),
frStyle: lang === 'fr' ? on : off, enStyle: lang === 'en' ? on : off,
kpis: t.kpis.map(function (k, i) {
var last = i === t.kpis.length - 1;
return {
label: k[0], value: k[1], sub: k[2],
box: last ? 'background: #8A4F1C; color: #FFFDF8; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px' : 'background: #FFFDF8; border: 1px solid #E7D6B8; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px',

};
}),
bars: BARS.map(function (b, i) {
var color = b[2] === 'hot' ? '#B5651D' : (b[2] === 'knead' ? '#E3B678' : '#EAD7B4');
return { value: b[0], label: t.bars[i], dotStyle: DOT[b[2]], barStyle: 'width: 100%; height: ' + b[1] + '%; background: ' + color + '; border-radius: 14px 14px 4px 4px' };
}),
pantry: t.pantry.map(function (p) { return { title: p[0], meta: p[1], chip: CHIP[p[2]], state: p[3] }; })
};
}
}
</script><script src="/boot.js"></script></body></html>
