<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/config.js"></script>
<title>Votre pAIn quotidien · l'actu IA qui compte pour ton métier</title>
<meta name="pq-titre-en" content="Votre pAIn quotidien · the AI news that matters for your job">
<meta name="description" content="Chaque matin, l'actu IA qui compte pour ton métier, prête à pétrir en post LinkedIn.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=DM+Mono:wght@500&amp;display=swap">
<link rel="stylesheet" href="/charte.css">
<link rel="stylesheet" href="/parcours.css">
</head><body><a class="pq-evitement" href="#contenu">Aller au contenu</a><div id="root"></div>
<script type="text/plain" id="tpl">
<div class="parcours">
<header class="entete" data-entete data-connexion data-qr></header>
<main id="contenu" tabindex="-1" class="contenu">
<section class="heros" aria-labelledby="heros-t">
<div class="heros-texte">
<p class="sur-titre">{{t.eyebrow}}</p>
<h1 id="heros-t">{{t.promesse}}</h1>
<p class="chapo">{{t.chapo}}</p>
<div class="actions">
<a class="bouton" href="{{ctaHref}}" data-focus="cta">{{ctaLabel}}</a>
<a class="lien" href="/connexion">{{t.dejaCompte}}</a>
</div>
</div>
<figure class="apercu">
<div class="apercu-scene">
<div class="miette-accueil">
<p class="miette-bulle">{{t.mietteBulle}}</p>
<svg class="miette miette-grande" viewBox="0 0 120 120" role="img" aria-label="{{t.mietteAlt}}" focusable="false">
<ellipse class="miette-ombre" cx="60" cy="110" rx="36" ry="5"></ellipse>
<path class="miette-membre" d="M14 76c-9-3-13-12-9-20M106 82c6 3 9 8 8 13M44 100v8M76 100v8"></path>
<path class="miette-mie" d="M14 78c0-30 20-52 46-52s46 22 46 52c0 14-10 22-24 22H38c-14 0-24-8-24-22z"></path>
<path class="miette-grigne" d="M40 42l8 12M58 36l8 12M76 42l8 12"></path>
<circle class="miette-trait" cx="48" cy="74" r="4.5"></circle><circle class="miette-trait" cx="72" cy="74" r="4.5"></circle>
<path class="miette-sourire" d="M52 84q8 7 16 0"></path>
<circle class="miette-joue" cx="39" cy="84" r="5"></circle><circle class="miette-joue" cx="81" cy="84" r="5"></circle>
</svg>
</div>
<div class="ticket">
<p class="ticket-tete"><span>{{t.ticketTitre}}</span><span>{{t.ticketCompte}}</span></p>
<ol class="ticket-liste">
<sc-for list="{{apercu}}" as="a"><li class="ticket-ligne"><span class="ticket-rang" aria-hidden="true">{{a.rang}}</span><span class="ticket-corps"><span class="ticket-titre">{{a.titre}}</span><span class="ticket-meta"><span class="{{a.puce}}">{{a.etat}}</span><span>{{a.source}} · {{a.score}}</span></span></span></li></sc-for>
</ol>
<p class="ticket-pied">{{t.ticketPied}}</p>
</div>
</div>
<figcaption class="apercu-legende">{{t.apercuLegende}}</figcaption>
</figure>
</section>
<section aria-labelledby="etapes-t">
<h2 id="etapes-t" class="section-titre">{{t.commentTitre}}</h2>
<ol class="etapes">
<sc-for list="{{etapes}}" as="e"><li class="etape"><span class="etape-num" aria-hidden="true">{{e.num}}</span><h3>{{e.titre}}</h3><p>{{e.texte}}</p></li></sc-for>
</ol>
</section>
<section id="faq" class="faq" aria-labelledby="faq-t">
<div class="faq-intro">
<h2 id="faq-t" class="section-titre" tabindex="-1">{{t.faqTitre}}</h2>
<p class="chapo">{{t.faqChapo}}</p>
<button type="button" class="bouton-secondaire" onClick="{{ouvrirChat}}" data-focus="faq-chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h16v11H9l-5 4z"></path></svg>{{t.faqChat}}</button>
</div>
<div class="faq-liste">
<sc-for list="{{faq}}" as="f"><details class="faq-item" data-id="{{f.id}}" onToggle="{{noterFaq}}" {{f.ouvert}}><summary>{{f.q}}<svg class="faq-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"></path></svg></summary><p>{{f.r}}</p></details></sc-for>
</div>
</section>
<section style="margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center" aria-labelledby="fin-t">
<h2 id="fin-t" class="section-titre" style="margin:0">{{t.finTitre}}</h2>
<a class="bouton" href="{{ctaHref}}">{{ctaLabel}}</a>
</section>
</main>
<footer class="pied pied-lanceur">
<span>© 2026 Votre pAIn quotidien</span>
<a href="/confidentialite">{{t.confidentialite}}</a>
<span>{{t.demo}}</span>
</footer>
<button type="button" class="chat-lanceur" onClick="{{ouvrirChat}}" aria-haspopup="dialog" aria-controls="chat" aria-expanded="{{chatOuvert}}" data-focus="chat-lanceur" style="{{lanceurStyle}}">
<span class="chat-tete"><svg class="miette" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path class="miette-mie" d="M14 78c0-30 20-52 46-52s46 22 46 52c0 14-10 22-24 22H38c-14 0-24-8-24-22z"></path><path class="miette-grigne" d="M40 42l8 12M58 36l8 12M76 42l8 12"></path><circle class="miette-trait" cx="48" cy="74" r="6"></circle><circle class="miette-trait" cx="72" cy="74" r="6"></circle><path class="miette-sourire" d="M52 86q8 7 16 0"></path></svg></span>
<span class="chat-lanceur-texte">{{t.chatLanceur}}</span>
</button>
<section id="chat" class="chat" role="dialog" aria-labelledby="chat-t" aria-describedby="chat-d" style="{{chatStyle}}" onKeydown="{{clavierChat}}">
<div class="chat-barre">
<span class="chat-tete"><svg class="miette" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path class="miette-mie" d="M14 78c0-30 20-52 46-52s46 22 46 52c0 14-10 22-24 22H38c-14 0-24-8-24-22z"></path><path class="miette-grigne" d="M40 42l8 12M58 36l8 12M76 42l8 12"></path><circle class="miette-trait" cx="48" cy="74" r="6"></circle><circle class="miette-trait" cx="72" cy="74" r="6"></circle><path class="miette-sourire" d="M52 86q8 7 16 0"></path></svg></span>
<div class="chat-nom"><h2 id="chat-t">Miette</h2><p>{{t.chatSousTitre}}</p></div>
<button type="button" class="chat-fermer" onClick="{{fermerChat}}" aria-label="{{t.chatFermer}}" data-focus="chat-fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="chat-fil" tabindex="0" role="region" aria-label="{{t.chatFilNom}}">
<sc-for list="{{messages}}" as="m"><p class="{{m.classe}}"><span class="pq-sr">{{m.qui}}</span>{{m.texte}}</p></sc-for>
</div>
<p class="pq-sr" data-annonce>{{chatAnnonce}}</p>
<div class="chat-suggestions" role="group" aria-label="{{t.chatSuggestions}}">
<sc-for list="{{suggestions}}" as="s"><button type="button" class="chat-suggestion" data-id="{{s.id}}" data-focus="sugg-{{s.id}}" onClick="{{poser}}">{{s.q}}</button></sc-for>
<a class="lien" href="#faq" onClick="{{versFaq}}">{{t.chatToutes}}</a>
</div>
<p id="chat-d" class="chat-note">{{t.chatNote}}</p>
</section>
<div class="voile" style="{{voileStyle}}" onClick="{{clicVoile}}">
<div class="boite qr-boite" role="dialog" aria-modal="true" aria-labelledby="qr-t" aria-describedby="qr-d" onKeydown="{{clavierModale}}">
<div class="boite-barre"><h2 id="qr-t">{{t.qrTitre}}</h2><button type="button" class="bouton-secondaire" style="min-height:44px;padding:0 16px" onClick="{{fermerQr}}" data-focus="qr-fermer">{{t.fermer}}</button></div>
<div class="qr-contenu">
<img src="/assets/qr-landing.svg" width="320" height="320" alt="{{t.qrAlt}}">
<p class="qr-contenu-adresse">https://team42svp.vercel.app/</p>
<p id="qr-d" class="qr-contenu-aide">{{t.qrAide}}</p>
<a class="lien" href="/qr">{{t.qrImprimer}}</a>
</div>
</div>
</div>
</div>
</script>
<script src="/dc.js"></script><script>

],

chatFini: 'That’s everything! The rest is in the FAQ, just above.',

};
class Component extends DCLogic {
constructor(props) { super(props); this.state = { lang: 'fr', qrOuvert: false, chatOuvert: false, posees: [], faqOuvertes: {} }; }
// Appelée par le bouton QR de l'en-tête (parcours.js).
ouvrirQr() { this.pendingFocus = 'qr-fermer'; this.setState({ qrOuvert: true }); }
fermerQr() { this.pendingFocus = 'entete-qr'; this.setState({ qrOuvert: false }); }
ouvrirChat() { this.pendingFocus = 'chat-fermer'; this.setState({ chatOuvert: true }); }
fermerChat() { this.pendingFocus = 'chat-lanceur'; this.setState({ chatOuvert: false }); }
// Question choisie dans le chat : ajoutée au fil, le focus passe à la question suivante.
poser(id) {
var posees = this.state.posees.concat([id]);
var reste = this.restantes(posees);
this.pendingFocus = reste.length ? 'sugg-' + reste[0] : 'chat-fermer';
this.setState({ posees: posees });
}
restantes(posees) {
var t = T[this.state.lang || 'fr'];
return t.faq.map(function (f) { return f[0]; }).filter(function (id) { return posees.indexOf(id) === -1; });
}
afterRender(root) {
var f = this.pendingFocus;
this.pendingFocus = null;
var el = f && root.querySelector('[data-focus="' + f + '"]');
if (el) el.focus();
// « Voir toutes les questions » : après le rendu (boot.js restaure le défilement), on descend à la FAQ.
if (this.allerFaq) {
this.allerFaq = false;
setTimeout(function () { var titre = root.querySelector('#faq-t'); if (titre) { titre.scrollIntoView({ block: 'start' }); titre.focus({ preventScroll: true }); } }, 0);
}
var fil = root.querySelector('.chat-fil');
if (fil) fil.scrollTop = fil.scrollHeight;
}
renderVals() {
var self = this;
var s = this.state || {};
var lang = s.lang || 'fr';
var t = T[lang];
var connecte = false;
try { connecte = !!Auth.utilisateurCourant(); } catch (e) {}
var parId = {};
t.faq.forEach(function (f) { parId[f[0]] = f; });
var posees = (s.posees || []).filter(function (id) { return parId[id]; });
var messages = [{ classe: 'chat-msg chat-msg-miette', qui: t.chatMiette, texte: t.chatBonjour }];
posees.forEach(function (id) {
messages.push({ classe: 'chat-msg chat-msg-toi', qui: t.chatToi, texte: parId[id][1] });
messages.push({ classe: 'chat-msg chat-msg-miette', qui: t.chatMiette, texte: parId[id][2] });
});
var reste = this.restantes(posees);
if (!reste.length) messages.push({ classe: 'chat-msg chat-msg-miette', qui: t.chatMiette, texte: t.chatFini });
// Dernière réponse de Miette, relayée par la zone d'annonce de boot.js (lot 24).
var chatAnnonce = posees.length ? messages[messages.length - 1].texte : '';
var ouvertes = s.faqOuvertes || {};
return {
t: t,
chatAnnonce: chatAnnonce,
voileStyle: s.qrOuvert ? '' : 'display: none',
fermerQr: function () { self.fermerQr(); },
clicVoile: function (e) { if (e.target === e.currentTarget) self.fermerQr(); },
clavierModale: function (e) { Parcours.clavierModale(e, function () { self.fermerQr(); }); },
ctaHref: connecte ? '/fournee' : '/decouvrir',
ctaLabel: connecte ? t.ctaConnecte : t.cta,
apercu: t.apercu.map(function (a, i) {
return { rang: String(i + 1).padStart(2, '0'), titre: a[0], source: a[1], puce: 'puce puce-' + a[2], etat: t.etats[a[2]], score: a[3] + t.sur15 };
}),
etapes: t.etapes.map(function (e, i) { return { num: i + 1, titre: e[0], texte: e[1] }; }),
faq: t.faq.map(function (f) { return { id: f[0], q: f[1], r: f[2], ouvert: ouvertes[f[0]] ? 'open' : '' }; }),
// Ouverture d'une question gardée sans nouveau rendu, pour la retrouver après un changement de langue.
noterFaq: function (e) { s.faqOuvertes = s.faqOuvertes || {}; s.faqOuvertes[e.currentTarget.getAttribute('data-id')] = e.currentTarget.open; },
chatOuvert: String(!!s.chatOuvert),
chatStyle: s.chatOuvert ? '' : 'display: none',
lanceurStyle: s.chatOuvert ? 'display: none' : '',
ouvrirChat: function () { self.ouvrirChat(); },
fermerChat: function () { self.fermerChat(); },
clavierChat: function (e) { if (e.key === 'Escape') { e.preventDefault(); self.fermerChat(); } },
versFaq: function (e) { e.preventDefault(); self.allerFaq = true; self.setState({ chatOuvert: false }); },
messages: messages,
// Quatre questions proposées à la fois, pour garder le chat lisible sur téléphone.
suggestions: reste.slice(0, 4).map(function (id) { return { id: id, q: parId[id][1] }; }),
poser: function (e) { self.poser(e.currentTarget.getAttribute('data-id')); }
};
}
}
</script><script src="/store.js"></script><script src="/demo.js"></script><script src="/auth.js"></script><script src="/parcours.js"></script><script src="/animations.js"></script><script src="/boot.js"></script></body></html>
